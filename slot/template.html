<title>Wandering Slot Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@500;600;700&family=Monoton&family=Yellowtail&family=Outfit:wght@400;500;700&display=swap">
<style>
/* Layout: full-height phone screen in 4 bands — HUD (credits) · face (top quarter, the machine's mood) · reels (fills the rest) · thumb controls */
:root{
  --void:#0a0816; --hull:#141028; --panel:#1d1838; --glass:#000; --rule:#2e2752;
  --ink:#f1edff; --dim:#9a92c7;
  --lime:#b8ff3d; --goop:#7dff3a; --gold:#ffd23f; --pink:#ff5fae; --sky:#4fd8ff; --violet:#b490ff; --ember:#ff6a3d;
  --l1:var(--lime); --l2:var(--gold); --l3:var(--pink); --l4:var(--sky); --l5:var(--violet);
  --f-sign:"Bungee", "Impact", sans-serif;
  --f-ui:"Outfit", system-ui, sans-serif;
  --f-tech:"Chakra Petch", "Outfit", system-ui, sans-serif;   /* readouts and labels: crisp, a little technical */
  --cell:90px;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:radial-gradient(100% 50% at 50% 0%, var(--bg-top, #251a4d) 0%, var(--void) 75%);color:var(--ink);font-family:var(--f-ui);
  display:flex;justify-content:center;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.app{position:relative;width:100%;max-width:480px;height:100%;box-sizing:border-box;display:grid;
  grid-template-rows:auto auto minmax(0,1fr) auto;gap:10px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:10px 14px}
.app.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97) 2}
@keyframes shake{20%,80%{transform:translate(-2px,1px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-4px,2px)}}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--lime);outline-offset:2px}

/* HUD */
.hud{display:flex;align-items:center;gap:8px}
.coins{display:flex;align-items:center;gap:8px;padding:5px 14px 5px 5px;border-radius:999px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--rule);transition:transform .15s}
.coins.bump{transform:scale(1.08)}
.coin{width:34px;height:28px;margin:-4px -2px -4px -4px;background-position:center;background-size:contain;background-repeat:no-repeat}   /* the gold bar: the game's currency */
.coins b{font-family:var(--f-sign);font-weight:400;font-size:1.1rem;font-variant-numeric:tabular-nums;min-width:3ch}
.hud .sp{flex:1}
.icon{width:38px;height:38px;border-radius:12px;border:0;background:var(--panel);box-shadow:inset 0 0 0 1px var(--rule);display:grid;place-items:center;color:var(--dim)}
.icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon[aria-pressed="false"] .on,.icon[aria-pressed="true"] .off{display:none}

/* Face — the machine's screen. Expressions are set with data-x on .face */
.facebox{position:relative;border-radius:26px;background:var(--glass);
  box-shadow:inset 0 0 0 1px var(--rule), inset 0 0 40px #000, 0 0 60px -30px var(--fc, var(--lime))}
.facebox::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:.35;
  background:repeating-linear-gradient(0deg, #ffffff06 0 1px, transparent 1px 3px)}
/* ---- Machine title: neon sign in the header. Colours come from the machine's theme ---- */
:root{--t-main:#ffd23f; --t-glow:#ff9d3d; --t-accent:#ff5fae; --t-cream:#fff6d6}
.app.bonus .title{--t-main:var(--goop); --t-glow:var(--goop); --t-accent:var(--gold); --t-cream:color-mix(in srgb, var(--goop) 22%, #fff)}
.hud{position:relative;min-height:54px}
.title{position:absolute;left:50%;top:50%;transform:translate(-50%,-46%) scale(var(--ts,1));text-align:center;line-height:.9;cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.title .l1{font:400 1.05rem/1 "Yellowtail", cursive;color:var(--t-cream);text-align:left;transform:rotate(-6deg) translate(-4px,3px);position:relative;z-index:1;
  text-shadow:0 0 2px #fff, 0 0 7px var(--t-accent), 0 0 15px var(--t-accent)}
.title .l2{font:400 1.8rem/1 "Monoton", "Bungee", sans-serif;letter-spacing:.04em;color:var(--t-cream);
  filter:drop-shadow(0 0 2px var(--t-main)) drop-shadow(0 0 7px var(--t-main)) drop-shadow(0 0 16px var(--t-glow))}   /* glow follows the bitten shape */
.title .ltr{display:inline-block;position:relative;animation:buzz 6s steps(1) infinite;animation-delay:calc(var(--i) * -1.37s)}
.title .ltr:nth-child(2){animation-duration:4.3s}
@keyframes buzz{0%,91%,93%,96%,100%{opacity:1}92%{opacity:.35}95%{opacity:.5}}
@property --bite{syntax:"<length>";inherits:false;initial-value:0px}
.title .bitten{--bite:0px;transition:--bite .11s cubic-bezier(.3,1.4,.5,1);padding:.42em;margin:-.42em;
  -webkit-mask-image:radial-gradient(circle at calc(100% - .48em) calc(.5em), transparent var(--bite), #000 calc(var(--bite) + .6px)),radial-gradient(circle at calc(100% - .76em) calc(.38em), transparent calc(var(--bite) * .72), #000 calc(var(--bite) * .72 + .6px)),radial-gradient(circle at calc(100% - .37em) calc(.78em), transparent calc(var(--bite) * .68), #000 calc(var(--bite) * .68 + .6px));
  -webkit-mask-composite:source-in;
  mask-image:radial-gradient(circle at calc(100% - .48em) calc(.5em), transparent var(--bite), #000 calc(var(--bite) + .6px)),radial-gradient(circle at calc(100% - .76em) calc(.38em), transparent calc(var(--bite) * .72), #000 calc(var(--bite) * .72 + .6px)),radial-gradient(circle at calc(100% - .37em) calc(.78em), transparent calc(var(--bite) * .68), #000 calc(var(--bite) * .68 + .6px));mask-composite:intersect}
.title .bitten.regrow{transition:--bite .9s cubic-bezier(.5,0,.3,1)}
.title .l2.chomp{animation:chompshake .22s ease-out}
.title .ltr.pop{animation:pop2 .32s ease-out}
@keyframes pop2{50%{transform:scale(1.28) translateY(-3px)}}
@keyframes chompshake{40%{transform:translate(1px,1px) scale(.985)}}
.crumb{position:absolute;width:4px;height:4px;border-radius:1.5px;background:var(--t-main);box-shadow:0 0 4px var(--t-glow);pointer-events:none;z-index:3;animation:crumb .7s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes crumb{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot))}}
/* ---- Face: gray-alien eyes. Shape = clip-path almond; expressions = the .fill's polygon (acts as eyelids, fully transparent) ---- */
.face{--fc:var(--lime);--es:1;position:absolute;inset:8px 0 30px;display:grid;place-items:center}
.facewrap{position:relative;display:grid;justify-items:center;gap:calc(14px * var(--es))}
.eyes{display:flex;gap:calc(34px * var(--es));transform:translate(var(--lx,0), var(--ly,0));transition:transform .5s cubic-bezier(.3,1.3,.5,1)}
.eye{position:relative;width:calc(84px * var(--es));height:calc(66px * var(--es));transition:transform .28s cubic-bezier(.3,1.5,.5,1)}
.eye::before{content:"";position:absolute;inset:-38% -32%;pointer-events:none;transition:opacity .25s;
  background:radial-gradient(closest-side, color-mix(in srgb, var(--fc) 50%, transparent), color-mix(in srgb, var(--fc) 16%, transparent) 55%, transparent 100%)}
.face.blink .eye::before{opacity:.3}
.face[data-x="sleepy"] .eye::before{opacity:.45}
.eye.l{transform:scaleX(-1)}
.eye .shape{position:relative;width:84px;height:66px;transform:scale(var(--es));transform-origin:0 0;
  clip-path:path("M5 47 C5 24 30 4 58 4 C76 4 82 18 79 32 C74 50 48 63 25 62 C13 61 5 56 5 47 Z")}
.eye .fill{position:absolute;inset:0;transition:clip-path .26s cubic-bezier(.3,1.3,.5,1), background .3s;
  background:radial-gradient(70% 80% at 62% 30%, color-mix(in srgb, var(--fc) 35%, #fff) 0%, var(--fc) 45%, color-mix(in srgb, var(--fc) 70%, #000) 100%);
  clip-path:polygon(0 0,100% 0,100% 100%,87% 100%,75% 100%,62% 100%,50% 100%,37% 100%,25% 100%,12% 100%,0 100%)}
.eye .fill::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 120%, #0006, transparent 60%)}           /* darker underside = roundness */
.eye .spark{position:absolute;border-radius:50%;background:radial-gradient(circle at 40% 40%, #fff, #ffffffcc 55%, #fff0 72%)}
.eye .spark.a{left:57%;top:16%;width:17%;height:21%}
.eye .spark.b{left:44%;top:42%;width:8%;height:10%;opacity:.8}
/* eyelid shapes */
.face.blink .fill{clip-path:polygon(0 52%,100% 46%,100% 54%,87% 54%,75% 54%,62% 54%,50% 54%,37% 54%,25% 54%,12% 54%,0 56%) !important}
.face[data-x="focus"] .fill{clip-path:polygon(0 30%,100% 18%,100% 80%,87% 80%,75% 80%,62% 80%,50% 80%,37% 80%,25% 80%,12% 82%,0 84%)}
.face[data-x="focus"] .eyes{animation:scan .45s ease-in-out infinite alternate}
@keyframes scan{to{transform:translateY(5px)}}
.face[data-x="happy"] .fill,.face[data-x="big"] .fill,.face[data-x="drool"] .fill{clip-path:polygon(0 0,100% 0,100% 74%,87% 60%,75% 52%,62% 48%,50% 47%,37% 50%,25% 58%,12% 70%,0 86%)}
.face[data-x="sad"] .fill{clip-path:polygon(0 6%,100% 46%,100% 100%,87% 100%,75% 100%,62% 100%,50% 100%,37% 100%,25% 100%,12% 100%,0 100%)}
.face[data-x="meh"] .fill{clip-path:polygon(0 42%,100% 34%,100% 100%,87% 100%,75% 100%,62% 100%,50% 100%,37% 100%,25% 100%,12% 100%,0 100%)}
.face[data-x="smug"] .fill{clip-path:polygon(0 40%,100% 52%,100% 92%,87% 88%,75% 86%,62% 86%,50% 87%,37% 88%,25% 90%,12% 93%,0 96%)}
/* angry: lids slant down toward the middle (x 0% = inner corner, 100% = outer) */
.face[data-x="angry"] .fill{clip-path:polygon(0 58%,100% 10%,100% 100%,87% 100%,75% 100%,62% 100%,50% 100%,37% 100%,25% 100%,12% 100%,0 100%)}
.face[data-x="angry"] .eyes{--ly:3px}
/* sly: one eye wide with a raised "brow", the other narrowed */
.face[data-x="sly"] .eye.r .fill{clip-path:polygon(0 12%,100% 0,100% 100%,87% 100%,75% 100%,62% 100%,50% 100%,37% 100%,25% 100%,12% 100%,0 100%)}
.face[data-x="sly"] .eye.r{transform:scale(1.12) translateY(-5%)}
.face[data-x="sly"] .eye.l .fill{clip-path:polygon(0 50%,100% 44%,100% 82%,87% 80%,75% 79%,62% 79%,50% 80%,37% 81%,25% 83%,12% 85%,0 88%)}
.face[data-x="sleepy"] .fill{clip-path:polygon(0 66%,100% 58%,100% 100%,87% 100%,75% 100%,62% 100%,50% 100%,37% 100%,25% 100%,12% 100%,0 100%)}
.face[data-x="sleepy"] .eyes{--ly:6px}
.face[data-x="surprised"] .eye{transform:scale(1.14)}
.face[data-x="surprised"] .eye.l{transform:scaleX(-1) scale(1.14)}
.face[data-x="big"]{--fc:var(--gold)}
.face[data-x="big"] .eyes{animation:throb .35s ease-in-out infinite alternate}
@keyframes throb{to{transform:scale(1.1)}}
.face[data-x="sad"]{--fc:var(--sky)}
.face[data-x="smug"]{--fc:var(--pink)}
.face[data-x="angry"]{--fc:var(--ember)}
.face[data-x="sly"]{--fc:var(--violet)}
/* cheeks: soft pink glow, only when pleased */
.cheek{position:absolute;top:calc(50px * var(--es));width:calc(40px * var(--es));height:calc(18px * var(--es));border-radius:50%;opacity:0;transition:opacity .3s;
  background:radial-gradient(closest-side, #ff6fb5cc, #ff6fb500)}
.cheek.l{left:calc(-30px * var(--es))}.cheek.r{right:calc(-30px * var(--es))}
.face[data-x="happy"] .cheek,.face[data-x="big"] .cheek,.face[data-x="drool"] .cheek,.face[data-x="smug"] .cheek,.face[data-x="sly"] .cheek{opacity:1}
/* mouth: small and rounded, lit like the eyes */
.mouth{position:relative;width:calc(26px * var(--es));height:calc(7px * var(--es));border-radius:99px;
  background:linear-gradient(180deg, color-mix(in srgb, var(--fc) 40%, #fff), var(--fc));box-shadow:0 0 10px color-mix(in srgb, var(--fc) 70%, transparent);transition:all .25s cubic-bezier(.3,1.4,.5,1)}
.face[data-x="happy"] .mouth,.face[data-x="drool"] .mouth{width:calc(30px * var(--es));height:calc(16px * var(--es));border-radius:4px 4px 99px 99px}
.face[data-x="big"] .mouth{width:calc(38px * var(--es));height:calc(24px * var(--es));border-radius:6px 6px 99px 99px}
.face[data-x="sad"] .mouth{width:calc(24px * var(--es));height:calc(10px * var(--es));border-radius:99px 99px 4px 4px;opacity:.85}
.face[data-x="meh"] .mouth{width:calc(18px * var(--es));transform:rotate(-6deg)}
.face[data-x="smug"] .mouth{width:calc(22px * var(--es));transform:translateX(30%) rotate(-10deg)}
.face[data-x="angry"] .mouth{width:calc(26px * var(--es));height:calc(9px * var(--es));border-radius:99px 99px 3px 3px}
.face[data-x="sly"] .mouth{width:calc(24px * var(--es));transform:translateX(35%) rotate(-12deg)}
.face[data-x="surprised"] .mouth{width:calc(16px * var(--es));height:calc(18px * var(--es));border-radius:50%}
.face[data-x="sleepy"] .mouth{width:calc(12px * var(--es))}
/* glass: soft highlight across the top of the screen */
.facebox::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(75% 38% at 50% 0%, #ffffff16, #ffffff00 100%), radial-gradient(120% 90% at 50% 50%, transparent 60%, #0000008c 100%)}
.bubble{position:absolute;left:12px;right:12px;bottom:10px;margin:0;text-align:center;font-size:.9rem;font-weight:500;color:var(--ink);
  min-height:1.3em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bubble::after{content:"▌";color:var(--fc, var(--lime));opacity:0}
.bubble.typing::after{opacity:1;animation:caret .5s steps(2) infinite}
@keyframes caret{50%{opacity:0}}

/* Reels */
.stage{position:relative;display:grid;place-items:center;min-height:0}
.glass{position:relative;display:grid;grid-template-columns:20px auto 20px;gap:4px;background:var(--glass);border-radius:22px;padding:8px 4px;
  box-shadow:inset 0 0 0 1px var(--rule), inset 0 0 30px #000, 0 20px 50px -25px #000}
.rail{display:grid;grid-template-rows:repeat(3,1fr);align-items:center;justify-items:center}
.rail div{display:flex;flex-direction:column;gap:3px}
.chip{width:18px;height:18px;border-radius:6px;font:700 .66rem/18px var(--f-ui);text-align:center;color:var(--void);background:var(--c);opacity:.16;transition:opacity .2s, box-shadow .2s}
.chip.on{opacity:1}
.chip.hot{box-shadow:0 0 0 2px var(--glass), 0 0 0 3.5px var(--c), 0 0 14px var(--c)}
.reels{position:relative;display:grid;grid-template-columns:repeat(3,var(--cell));gap:4px}
.reel{position:relative;height:calc(var(--cell) * 3);overflow:hidden;border-radius:14px;transition:box-shadow .3s}
.reel{--tc:var(--gold)}
.reel.tense{box-shadow:0 0 26px -2px var(--tc)}
.reel.tense::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:3;box-shadow:inset 0 0 0 2px var(--tc), inset 0 0 22px color-mix(in srgb, var(--tc) 60%, transparent);
  animation:pulseop .3s ease-in-out infinite alternate}
@keyframes pulseop{from{opacity:.45}to{opacity:1}}
.reel{overflow:hidden}
.strip{will-change:transform}
.rc{position:absolute;inset:0;width:100%;height:100%;display:none}
.reel.spinning .rc{display:block}
.reel.spinning .strip{visibility:hidden}
.cell{height:var(--cell);background-position:center;background-size:86%;background-repeat:no-repeat;transition:opacity .3s}
.glass.result .cell{opacity:.25}
.glass.result .cell.hit{opacity:1;animation:pop .5s ease-in-out 3}
.glass.result .cell.scatter{opacity:1}
@keyframes pop{50%{transform:scale(1.12)}}
.reels::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:14px;background:linear-gradient(var(--glass), #0000 12%, #0000 88%, var(--glass))}
svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
svg.lines polyline{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
svg.lines .idle{opacity:.45;stroke-dasharray:1 7}
svg.lines .won{stroke-width:5;opacity:.9;filter:drop-shadow(0 0 6px currentColor)}
.winpop{position:absolute;inset:0;z-index:4;display:grid;place-items:center;pointer-events:none}
.winpop div{text-align:center;opacity:0;transform:scale(.5);transition:opacity .2s, transform .4s cubic-bezier(.2,1.7,.4,1)}
.winpop.show div{opacity:1;transform:scale(1)}
.winpop small{display:block;font:700 .8rem var(--f-ui);letter-spacing:.3em;color:var(--ink);text-shadow:0 2px 8px #000}
.winpop b{display:block;font-family:var(--f-sign);font-weight:400;font-size:clamp(2.6rem, 14vw, 4rem);line-height:1;color:var(--gold);
  text-shadow:0 0 22px #ff9d00, 0 4px 0 #7a3b00, 0 0 2px #000;font-variant-numeric:tabular-nums}
.winpop.big small{font-family:var(--f-sign);font-size:1.3rem;letter-spacing:.06em;color:var(--pink);text-shadow:0 0 14px var(--pink), 0 3px 0 #5a0030}

/* Controls */
.controls{display:flex;flex-direction:column;gap:12px}
.picker{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.lp{display:grid;place-items:center;gap:1px;padding:6px 2px 4px;border:0;border-radius:12px;background:var(--glass);color:var(--dim);box-shadow:inset 0 0 0 1px var(--rule);transition:box-shadow .15s, background .15s}
.lp svg{width:100%;max-width:30px;aspect-ratio:1;display:block}
.lp svg circle{fill:var(--rule)}
.lp svg polyline{fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;opacity:.3}
.lp span{font-size:.66rem;font-weight:700}
.lp.on{color:var(--ink);background:color-mix(in srgb, var(--c) 12%, var(--glass));box-shadow:inset 0 0 0 1.5px var(--c)}
.lp.on svg polyline{opacity:1}
.lp.on svg circle{fill:color-mix(in srgb, var(--c) 35%, var(--rule))}
.lp:disabled{opacity:.4;cursor:default}
.deck{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.side{display:flex;flex-direction:column;gap:2px}
.side.r{align-items:flex-end;text-align:right}
.side span{font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.side b{font-family:var(--f-sign);font-weight:400;font-size:1.3rem;line-height:1;font-variant-numeric:tabular-nums}
.side.r b{color:var(--gold)}
.pills{display:flex;gap:6px;margin-top:6px}
.auto{align-self:flex-start;border:0;border-radius:999px;padding:6px 14px;font:700 .72rem var(--f-ui);letter-spacing:.12em;background:var(--panel);color:var(--dim);box-shadow:inset 0 0 0 1px var(--rule)}
.auto[aria-pressed="true"]{background:var(--pink);color:var(--void);box-shadow:0 0 18px -2px var(--pink)}
#fast[aria-pressed="true"]{background:var(--sky);box-shadow:0 0 18px -2px var(--sky)}
.strip.land{animation:land .26s cubic-bezier(.3,.6,.4,1)}
@keyframes land{0%{translate:0 0}35%{translate:0 calc(var(--cell) * -.075)}70%{translate:0 calc(var(--cell) * .02)}100%{translate:0 0}}
.spin{width:104px;height:104px;border-radius:50%;border:0;font-family:var(--f-sign);font-size:1.15rem;color:#132000;line-height:1.05;
  background:radial-gradient(circle at 35% 30%, #eaffb8, var(--lime) 45%, #5f9a00);
  box-shadow:0 7px 0 #3d6400, 0 0 0 6px var(--hull), 0 0 0 7px var(--rule), 0 0 40px -6px var(--lime);transition:transform .08s, box-shadow .08s, filter .2s;
  position:relative;z-index:1}
#centerbtn{position:relative;display:grid;place-items:center}
#centerbtn::before{content:"";position:absolute;width:150%;height:150%;border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side, color-mix(in srgb, var(--lime) 45%, transparent), transparent);animation:breathe 2.4s ease-in-out infinite}
#centerbtn:has(.spin:disabled)::before,#centerbtn:has(.spin[hidden])::before{opacity:0;animation:none}
.app.bonus #centerbtn::before{display:none}
@keyframes breathe{50%{opacity:.35}}
.spin small{display:block;font-family:var(--f-ui);font-weight:700;font-size:.7rem;opacity:.75}
.spin:active:not(:disabled){transform:translateY(5px);box-shadow:0 2px 0 #3d6400, 0 0 0 6px var(--hull), 0 0 0 7px var(--rule)}
.spin:disabled{filter:grayscale(.8) brightness(.55);cursor:default}
.refill{border:0;border-radius:999px;padding:10px 16px;font:700 .85rem var(--f-ui);background:var(--gold);color:var(--void)}

/* Info sheet */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:10;max-height:70%;overflow:auto;background:var(--hull);border-radius:24px 24px 0 0;
  box-shadow:0 -20px 60px #000c, inset 0 1px 0 #ffffff12;padding:14px max(16px, env(safe-area-inset-left, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px));
  transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.9,.3,1)}
.sheet.open{transform:none}
.sheethead{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.tab{border:0;border-radius:999px;padding:6px 12px;font:500 .8rem var(--f-ui);background:transparent;color:var(--dim)}
.tab[aria-selected="true"]{background:var(--panel);color:var(--ink)}
.sheethead .sp{flex:1}
.paygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 6px;font-size:.78rem}
.payitem{display:flex;align-items:center;gap:6px}
.payitem i{width:34px;height:34px;flex:none;background-position:center;background-size:contain;background-repeat:no-repeat}
.payitem b{font-family:var(--f-sign);font-weight:400;font-size:.9rem;color:var(--gold);display:block;line-height:1}
.payitem span{color:var(--dim);font-size:.68rem}
.payitem.wild{grid-column:1/-1;padding-bottom:10px;border-bottom:1px solid var(--rule)}
.payitem.wild b{color:var(--lime)}
.anyb{margin-top:10px;padding-top:10px;border-top:1px solid var(--rule);display:flex;align-items:center;gap:4px;color:var(--dim);font-size:.78rem}
.anyb i{width:24px;height:24px;background-position:center;background-size:contain;background-repeat:no-repeat}
.anyb b{color:var(--gold);font-family:var(--f-sign);font-weight:400;margin-left:auto}
.debug{margin:0;color:var(--dim);font-size:.8rem;line-height:1.6}

.cell.s-wild{position:relative}
.cell.s-wild::after{content:"WILD";position:absolute;left:50%;bottom:6%;transform:translateX(-50%);font:400 .62rem/1 var(--f-sign);letter-spacing:.06em;
  color:var(--void);background:var(--gold);padding:3px 6px 2px;border-radius:6px;box-shadow:0 0 12px #ff9d0088}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
@media (prefers-reduced-motion:reduce){.app.shake,.face[data-x="big"] .eye,.face[data-x="focus"] .eyes,.spin,.reel.tense,.glass.result .cell.hit{animation:none}}
@media (max-height:680px){.app{gap:8px}.spin{width:86px;height:86px}}
/* Bowl-nus */
.face[data-x="drool"] .mouth::after{content:"";position:absolute;left:62%;top:80%;width:9px;height:14px;border-radius:50% 50% 50% 50%/40% 40% 60% 60%;
  background:var(--goop);box-shadow:0 0 10px var(--goop);animation:drip 1.1s ease-in infinite}
@keyframes drip{0%{transform:translateY(-6px) scaleY(.4);opacity:0}30%{opacity:1}100%{transform:translateY(26px) scaleY(1.2);opacity:0}}
.face[data-x="drool"]{--fc:var(--goop)}
.bonuspill{display:flex;align-items:center;gap:6px;padding:5px 12px 5px 5px;border-radius:999px;background:color-mix(in srgb, var(--goop) 18%, var(--panel));
  box-shadow:inset 0 0 0 1.5px var(--goop), 0 0 18px -4px var(--goop);font:400 .78rem var(--f-sign);color:var(--goop)}
.bonuspill i{width:26px;height:26px;background-position:center;background-size:contain;background-repeat:no-repeat}
.bonuspill small{font:700 .7rem var(--f-ui);color:var(--ink);opacity:.8}
.app.bonus .glass{box-shadow:inset 0 0 0 2px var(--goop), inset 0 0 30px #000, 0 0 50px -10px var(--goop)}
.app.bonus .facebox{box-shadow:inset 0 0 0 2px var(--goop), inset 0 0 40px #000, 0 0 60px -20px var(--goop)}
.app.bonus .spin{background:radial-gradient(circle at 35% 30%, #eaffd8, var(--goop) 45%, #2c8a00);box-shadow:0 7px 0 #1f5c00, 0 0 0 6px var(--hull), 0 0 0 7px var(--rule), 0 0 40px -6px var(--goop)}
.app.bonus .spin:disabled{filter:none}
.cell{position:relative;isolation:isolate}
.cell::before{content:"";position:absolute;inset:3%;z-index:-1;border-radius:50%;opacity:0;transition:opacity .25s;
  background:radial-gradient(closest-side, var(--gc), color-mix(in srgb, var(--gc) 70%, transparent) 35%, color-mix(in srgb, var(--gc) 25%, transparent) 70%, transparent 100%)}
.cell.scatter{--gc:var(--goop)}
.cell.setup{--gc:var(--gold)}
.cell.scatter::before,.cell.setup::before{animation:glowpulse .6s ease-in-out infinite alternate}
@keyframes glowpulse{from{opacity:.45;transform:scale(.82)}to{opacity:.95;transform:scale(1)}}
.cell.s-bowl::after,.cell.s-jug::after{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);font:400 .62rem/1 var(--f-sign);letter-spacing:.06em;
  color:var(--void);background:var(--goop);padding:3px 6px 2px;border-radius:6px;box-shadow:0 0 12px color-mix(in srgb, var(--goop) 60%, transparent);white-space:nowrap}
.cell.s-bowl::after{content:"BONUS"}
/* bonus multiplier booster: the top symbol carries a "×+1" tag during Bowl-nus spins */
.app.bonus .cell.s-boar::after{content:var(--boost-tag,"×3");position:absolute;left:50%;bottom:6%;transform:translateX(-50%);font:400 .62rem/1 var(--f-sign);letter-spacing:.06em;
  color:#fff;background:linear-gradient(135deg,#ff5fae,#b13bff);padding:3px 6px 2px;border-radius:6px;box-shadow:0 0 12px #ff5fae99}
.cell.boosting{animation:boostPop .5s cubic-bezier(.3,1.6,.5,1);filter:drop-shadow(0 0 14px #ff5fae)}
@keyframes boostPop{40%{transform:scale(1.25)}}
.boostfly{position:fixed;z-index:25;font:400 20px/1 Bungee,Impact,sans-serif;color:#ffd1ef;text-shadow:0 0 12px #ff5fae,0 0 3px #000;pointer-events:none;
  transition:transform .6s cubic-bezier(.5,-.3,.6,1),opacity .2s .5s}
.medal em.pop{animation:medalPop .6s cubic-bezier(.3,1.8,.5,1)}
@keyframes medalPop{0%{scale:1}35%{scale:1.9}100%{scale:1}}
.medal em.hot{background:linear-gradient(135deg,#ff5fae,#ffd84a);box-shadow:0 0 18px #ff5fae}
.cell.s-jug::after{content:"+2 SPINS"}
.glass.spot .reel:not(.tense) .cell:not(.setup):not(.scatter){opacity:.3;transition:opacity .3s}
.reel.tense.goop{--tc:var(--goop)}
.reel{position:relative}
.reel.linger{box-shadow:inset 0 0 0 1.5px color-mix(in srgb, var(--goop) 70%, transparent), 0 0 18px -6px var(--goop)}
.reel.tense.mild{box-shadow:0 0 18px -6px var(--tc)}
.reel.tense.mild::after{animation:none;opacity:.7}
svg.lines .tease{opacity:.95;stroke-width:4.5;stroke-dasharray:6 6;animation:march .5s linear infinite}
@keyframes march{to{stroke-dashoffset:-12}}
.bonusov{position:absolute;inset:0;z-index:15;display:grid;place-items:center;text-align:center;padding:24px;
  background:radial-gradient(60% 45% at 50% 45%, color-mix(in srgb, var(--goop) 30%, transparent), #05030cee 70%);
  opacity:0;pointer-events:none;transition:opacity .3s}
.bonusov.show{opacity:1;pointer-events:auto}
.bonusov .bowlart{width:min(46vw,200px);aspect-ratio:1;margin:0 auto;background-position:center;background-size:contain;background-repeat:no-repeat;
  animation:wobble 1.4s ease-in-out infinite}
@keyframes wobble{25%{transform:rotate(-5deg) scale(1.03)}75%{transform:rotate(5deg) scale(1.03)}}
.bonusov h2{margin:8px 0 2px;font:400 clamp(2rem, 11vw, 3.2rem)/1 var(--f-sign);color:var(--goop);text-shadow:0 0 24px var(--goop), 0 4px 0 #1f5c00;transform:scale(.6);transition:transform .45s cubic-bezier(.2,1.7,.4,1)}
.bonusov.show h2{transform:scale(1)}
.bonusov h2 span{color:var(--ink);text-shadow:0 0 16px var(--goop), 0 4px 0 #333}
.bonusov p{margin:10px 0 0;color:var(--ink);font-size:1rem}
.bonusov .big{font:400 clamp(2.4rem, 13vw, 3.6rem)/1 var(--f-sign);color:var(--gold);text-shadow:0 0 22px #ff9d00, 0 4px 0 #7a3b00;margin-top:8px}
.bonusov small{display:block;margin-top:16px;color:var(--dim);font-size:.8rem}
.payrow{display:flex;align-items:center;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--rule);font-size:.8rem;color:var(--dim)}
.payrow i{width:40px;height:40px;flex:none;background-position:center;background-size:contain;background-repeat:no-repeat}
.payrow b{color:var(--goop);font-family:var(--f-sign);font-weight:400}
/* ===== Bowl-nus takeover ===== */
#bubbles{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:0;transition:opacity .4s}
body.bonus #bubbles{opacity:1}
.app{z-index:1}
body::before{content:"";position:fixed;inset:-12%;z-index:0;pointer-events:none;opacity:0;transition:opacity .5s;will-change:transform;
  background:radial-gradient(35% 30% at 25% 30%, color-mix(in srgb, var(--goop) 33%, transparent), transparent 70%), radial-gradient(30% 28% at 78% 65%, #ff5fae44, transparent 70%),
             radial-gradient(40% 35% at 55% 95%, #ffd23f33, transparent 70%), radial-gradient(120% 90% at 50% 10%, color-mix(in srgb, var(--goop) 22%, #04030a), color-mix(in srgb, var(--goop) 6%, #04030a) 70%);
}
body.bonus::before{opacity:1}
@keyframes bgdrift{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(4%,-3%) rotate(4deg)}100%{transform:translate(-4%,3%) rotate(-3deg)}}
/* casino marquee frame: gold rail + glass bulbs, built to the exact size of each screen */
.bulbs{position:absolute;inset:-18px;pointer-events:none;z-index:6;opacity:0;transition:opacity .35s}
.app.bonus .bulbs{opacity:1}
.app.bonus{row-gap:30px}   /* room for both frames without touching */
.bulbs canvas{position:absolute;inset:0;width:100%;height:100%}
/* goop hanging off the top of the reel frame: blobs merged + lit by an SVG filter so it looks wet and round */
canvas.goop{position:absolute;left:6px;top:-6px;width:calc(100% - 12px);height:86px;z-index:5;pointer-events:none;opacity:0;transition:opacity .4s}
.app.bonus canvas.goop{opacity:1}
.app.nodrips canvas.goop{display:none}
.mlist{display:grid;gap:8px}
.mbtn{display:flex;align-items:center;gap:12px;text-align:left;border:0;border-radius:16px;padding:10px 12px;background:var(--panel);color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule);font:500 .9rem var(--f-ui)}
.mbtn[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--t-main), 0 0 18px -6px var(--t-main)}
.mbtn i{width:44px;height:44px;flex:none;background-position:center;background-size:contain;background-repeat:no-repeat}
.mbtn small{display:block;color:var(--dim);font-size:.75rem;font-weight:400}
.mbtn:disabled{opacity:.5}
@keyframes marq{to{background-position:200% 0}}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;opacity:0;box-shadow:0 0 70px 4px color-mix(in srgb, var(--goop) 55%, transparent)}
.app.bonus .glass::before{animation:breathe2 1.6s ease-in-out infinite}
@keyframes breathe2{0%,100%{opacity:.3}50%{opacity:1}}
/* bottom scoreboard */
.bonusboard{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:12px 14px;border-radius:22px;
  background:linear-gradient(180deg, color-mix(in srgb, var(--goop) 14%, var(--hull)), var(--hull));box-shadow:inset 0 0 0 1.5px color-mix(in srgb, var(--goop) 55%, transparent)}
.bb{display:flex;flex-direction:column;gap:4px}
.bb.r{align-items:flex-end;text-align:right}
.bb span{font:700 .64rem var(--f-ui);letter-spacing:.16em;text-transform:uppercase;color:color-mix(in srgb, var(--goop) 70%, var(--ink))}
.bb b{font:400 2.2rem/1 var(--f-sign);font-variant-numeric:tabular-nums;color:var(--ink);transition:transform .15s}
.bb.r b{color:var(--gold);text-shadow:0 0 18px #ff9d0088}
.bb b.bump{transform:scale(1.25)}
.medal{position:relative;width:92px;height:92px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 40% 35%, #1b4a0c, #071a04);box-shadow:0 0 0 4px var(--goop), 0 0 24px var(--goop)}
.medal::after{content:"";position:absolute;inset:-14px;border-radius:50%;pointer-events:none;background:radial-gradient(closest-side, color-mix(in srgb, var(--goop) 50%, transparent), transparent);animation:breathe2 2s ease-in-out infinite}
.medal i{width:64px;height:64px;background-position:center;background-size:contain;background-repeat:no-repeat;animation:wobble 1.4s ease-in-out infinite}
.medal em{position:absolute;right:-10px;bottom:-6px;font:400 1.3rem/1 var(--f-sign);font-style:normal;color:var(--void);background:var(--gold);padding:5px 7px 4px;border-radius:10px;
  box-shadow:0 0 14px #ff9d00aa;transform:rotate(-8deg)}
.app.bonus .picker,.app.bonus .deck{display:none}
/* goop wave that washes over the screen on the way in and out */
.goopwipe{position:fixed;left:-5%;right:-5%;top:0;height:170%;z-index:30;pointer-events:none;transform:translateY(105vh);
  background:linear-gradient(180deg, color-mix(in srgb, var(--goop) 70%, #fff), var(--goop) 20%, color-mix(in srgb, var(--goop) 70%, #000) 60%, color-mix(in srgb, var(--goop) 35%, #000))}
.goopwipe::before,.goopwipe::after{content:"";position:absolute;left:0;right:0;height:34px;background-repeat:repeat-x}
.goopwipe::before{top:-33px;background-image:radial-gradient(circle at 50% 100%, color-mix(in srgb, var(--goop) 70%, #fff) 17px, transparent 18px);background-size:44px 34px}
.goopwipe::after{bottom:-33px;background-image:radial-gradient(circle at 50% 0, color-mix(in srgb, var(--goop) 35%, #000) 17px, transparent 18px);background-size:56px 34px}
.goopwipe.go{animation:wipe 1.3s cubic-bezier(.6,.05,.4,.95) forwards}
@keyframes wipe{0%{transform:translateY(105vh)}45%,55%{transform:translateY(-35vh)}100%{transform:translateY(-200vh)}}
.goopwipe .blub{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--goop) 40%, #fff), var(--goop) 50%, color-mix(in srgb, var(--goop) 45%, #000));opacity:.7}
@media (prefers-reduced-motion:reduce){body::before,.medal,.medal i,.app.bonus .glass::before,.title .ltr,#centerbtn::before,.medal::after,.reel.tense::after{animation:none}}
/* ===== Sci-fi control chrome =====
   Angled-corner glass panels: the element itself paints a lit edge gradient, its ::before paints the glass 1px inside it. */
:root{--ui:color-mix(in srgb, var(--t-accent) 45%, #7fe3ff)}
.coins,.icon,.lp,.auto,.bonusboard,.mbtn,.readout{--k:9px;--ehi:color-mix(in srgb, var(--ui) 70%, transparent);--elo:color-mix(in srgb, var(--ui) 14%, transparent);
  position:relative;isolation:isolate;border-radius:0;box-shadow:none;
  clip-path:polygon(var(--k) 0,100% 0,100% calc(100% - var(--k)),calc(100% - var(--k)) 100%,0 100%,0 var(--k));
  background:linear-gradient(135deg, var(--ehi), var(--elo) 30%, var(--elo) 70%, var(--ehi))}
.coins::before,.icon::before,.lp::before,.auto::before,.bonusboard::before,.mbtn::before,.readout::before{content:"";position:absolute;inset:1px;z-index:-1;
  clip-path:polygon(calc(var(--k) - .4px) 0,100% 0,100% calc(100% - var(--k) + .4px),calc(100% - var(--k) + .4px) 100%,0 100%,0 calc(var(--k) - .4px));
  background:repeating-linear-gradient(0deg, #ffffff05 0 1px, transparent 1px 3px), linear-gradient(180deg, #221c44 0%, #120f27 55%, #0b091a 100%)}
.coins{padding:6px 16px 6px 7px}
.coins b{font:700 1.15rem/1 var(--f-tech);letter-spacing:.03em}
.icon{--k:7px}
.icon:active{transform:translateY(1px)}
/* line picker: each button is a little lit circuit of its line */
.lp{--k:8px;padding:6px 2px 7px;color:var(--dim);transition:transform .1s}
.lp::after{content:"";position:absolute;left:24%;right:24%;bottom:3px;height:2px;border-radius:2px;background:var(--c);opacity:.18;transition:opacity .2s}
.lp.on{--ehi:var(--c);--elo:color-mix(in srgb, var(--c) 28%, transparent);color:var(--ink)}
.lp.on::before{background:repeating-linear-gradient(0deg, #ffffff05 0 1px, transparent 1px 3px), radial-gradient(90% 70% at 50% 100%, color-mix(in srgb, var(--c) 22%, transparent), transparent 70%), linear-gradient(180deg, #221c44, #0b091a)}
.lp.on::after{opacity:1;box-shadow:0 0 6px var(--c)}
.lp:active:not(:disabled){transform:translateY(1px)}
.lp span{font:700 .68rem/1 var(--f-tech);letter-spacing:.08em}
.lp svg{max-width:32px}
.lp svg .dot{fill:color-mix(in srgb, var(--ui) 22%, transparent)}
.lp svg .ln{fill:none;stroke-linecap:round;stroke-linejoin:round}
.lp svg .gl{stroke:var(--c);stroke-width:6;opacity:0}
.lp svg .co{stroke:var(--dim);stroke-width:2;opacity:.35}
.lp svg .wh{stroke:#fff;stroke-width:.8;opacity:0}
.lp svg .nd{fill:var(--dim);opacity:.35}
.lp.on svg .gl{opacity:.32}
.lp.on svg .co{stroke:var(--c);opacity:1}
.lp.on svg .wh{opacity:.85}
.lp.on svg .nd{fill:#fff;opacity:1;stroke:var(--c);stroke-width:1.4}
.lp.draw svg .co,.lp.draw svg .wh,.lp.draw svg .gl{stroke-dasharray:100;animation:drawon .35s ease-out}
@keyframes drawon{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
/* rail markers: little arrow tags pointing into the reels */
.chip{width:21px;height:16px;border-radius:0;font:700 .62rem/16px var(--f-tech);color:var(--void);opacity:.14;padding-right:4px;box-sizing:border-box;
  clip-path:polygon(0 0,70% 0,100% 50%,70% 100%,0 100%);background:linear-gradient(180deg, color-mix(in srgb, var(--c) 55%, #fff), var(--c) 50%, color-mix(in srgb, var(--c) 65%, #000))}
#railR .chip{clip-path:polygon(30% 0,100% 0,100% 100%,30% 100%,0 50%);padding:0 0 0 5px}
.chip.on{opacity:.95}
.chip.hot{opacity:1;filter:drop-shadow(0 0 4px var(--c)) brightness(1.15)}
/* paylines: laser beams — wide soft glow, coloured beam, white-hot core, glowing nodes on each symbol */
svg.lines .ln{fill:none;stroke-linecap:round;stroke-linejoin:round}
svg.lines .idle .beam{stroke-width:1.8;opacity:.5;stroke-dasharray:.1 7}
svg.lines .idle .glow,svg.lines .idle .core{display:none}
svg.lines .won .glow{stroke-width:16;opacity:.2}
svg.lines .won .beam{stroke-width:5.5;opacity:.95}
svg.lines .won .core{stroke:#fff;stroke-width:1.8;opacity:.9}
svg.lines .won .ln{stroke-dasharray:100;animation:drawon .45s cubic-bezier(.3,.7,.3,1) both}
svg.lines .node{transform-box:fill-box;transform-origin:center;animation:nodepop .4s cubic-bezier(.3,1.6,.5,1) both}
@keyframes nodepop{from{transform:scale(0)}}
svg.lines .tease .glow{stroke-width:12;opacity:.18}
svg.lines .tease .beam{stroke-width:4;opacity:.95;stroke-dasharray:6 6;animation:march .5s linear infinite}
svg.lines .tease .core{display:none}
/* readouts */
.side span,.bb span{font:600 .64rem/1 var(--f-tech);letter-spacing:.2em}
.side b{font:700 1.4rem/1 var(--f-tech);letter-spacing:.02em}
.side.r b{text-shadow:0 0 12px color-mix(in srgb, var(--gold) 55%, transparent)}
.bb b{font:700 2.2rem/1 var(--f-tech)}
/* AUTO / FAST: switches with an LED */
.auto{--k:6px;padding:7px 9px 7px 20px;font:700 .66rem/1 var(--f-tech);letter-spacing:.1em;color:var(--dim)}
.auto::after{content:"";position:absolute;left:8px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:#3a3460;box-shadow:inset 0 1px 1px #0008}
.auto[aria-pressed="true"]{--ehi:var(--led);--elo:color-mix(in srgb, var(--led) 25%, transparent);color:var(--ink);background:linear-gradient(135deg, var(--ehi), var(--elo) 30%, var(--elo) 70%, var(--ehi));box-shadow:none}
.auto[aria-pressed="true"]::after{background:radial-gradient(circle at 35% 35%, #fff, var(--led) 60%);box-shadow:0 0 6px var(--led), 0 0 12px var(--led)}
#auto{--led:var(--pink)} #fast{--led:var(--sky)}
#fast[aria-pressed="true"]{box-shadow:none}
.auto:disabled{opacity:.4}
/* spin: glowing core inside a machined ring with ticks that turns while the reels spin */
.spin{font:700 1.15rem/1.05 var(--f-tech);letter-spacing:.14em;text-transform:uppercase;color:#112000;
  box-shadow:0 6px 0 #3d6400, inset 0 -6px 14px #0004, inset 0 4px 10px #fff8, 0 0 0 5px #0c0a1a, 0 0 34px -6px var(--lime)}
.spin small{font:700 .66rem var(--f-tech);letter-spacing:.06em}
.spin:active:not(:disabled){box-shadow:0 2px 0 #3d6400, inset 0 -6px 14px #0004, inset 0 4px 10px #fff8, 0 0 0 5px #0c0a1a}
.bonusboard{--k:14px;--ehi:var(--goop);--elo:color-mix(in srgb, var(--goop) 20%, transparent);padding:12px 16px}
.mbtn{--k:10px}
.mbtn[aria-pressed="true"]{--ehi:var(--t-main);--elo:color-mix(in srgb, var(--t-main) 25%, transparent);box-shadow:none}
@media (prefers-reduced-motion:reduce){svg.lines .won .ln,svg.lines .node,.lp.draw svg *{animation:none!important}}
/* control deck: switches stacked left · spin centre · bet and win in their own display windows right */
.deck{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px}   /* equal side columns keep Spin dead centre */
.pills{flex-direction:column;gap:8px;margin:0;justify-self:start}
.auto{width:78px;text-align:left}
.readouts{display:grid;grid-template-columns:1fr 1fr;gap:6px;min-width:0;width:100%;max-width:150px;justify-self:end}
.readout{--k:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:16px 2px 18px;min-width:0}
.readout::before{background:repeating-linear-gradient(0deg, #ffffff04 0 1px, transparent 1px 3px), linear-gradient(180deg, #05040c, #0e0b1f 70%, #15112b);box-shadow:inset 0 3px 8px #000d, inset 0 -1px 0 #ffffff10}
.readout span{font:600 .58rem/1 var(--f-tech);letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.readout b{font:700 1.12rem/1 var(--f-tech);font-variant-numeric:tabular-nums;color:var(--ink);max-width:100%;overflow:hidden;text-overflow:clip}

  background:linear-gradient(180deg, color-mix(in srgb, var(--t-main) 35%, transparent), transparent 70%);clip-path:polygon(45% 0,55% 0,100% 100%,0 100%);animation:swing 3.2s ease-in-out infinite alternate}
.vip .b1{left:-20vmax}.vip .b2{right:-20vmax;animation-direction:alternate-reverse;background:linear-gradient(180deg, color-mix(in srgb, var(--t-accent) 35%, transparent), transparent 70%)}
.vip.on .beam{opacity:1}
@keyframes swing{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}

  background:radial-gradient(circle at 6% 50%, #ffd76a 0 9px, #8a5a10 10px 12px, transparent 13px), radial-gradient(circle at 94% 50%, #ffd76a 0 9px, #8a5a10 10px 12px, transparent 13px),
             radial-gradient(120% 220% at 50% -60%, transparent 62%, #8a0f2a 63%, #d8264a 70%, #6a0a1e 77%, transparent 78%)}
.vipcard{position:absolute;top:12%;width:min(76vw,320px);aspect-ratio:1.54;display:grid;place-items:center;opacity:0;transform:perspective(600px) rotateY(160deg) scale(.3);

.vipcard i{width:100%;height:100%;background-position:center;background-size:contain;background-repeat:no-repeat;filter:drop-shadow(0 12px 24px #000c)}
.vipcard .shine{position:absolute;inset:0;background:linear-gradient(110deg, transparent 35%, #fff9 50%, transparent 65%) -150% 0/250% 100% no-repeat;mix-blend-mode:overlay}
.vip.s1 .vipcard{opacity:1;transform:perspective(600px) rotateY(0) scale(1)}
.vip.s1 .vipcard .shine{animation:shinecard 1.4s .5s ease-in-out}
@keyframes shinecard{to{background-position:150% 0}}
.viptext{position:absolute;top:44%;text-align:center;line-height:1}
.v1{font:700 clamp(1rem,5vw,1.35rem)/1 var(--f-tech);letter-spacing:.32em;color:var(--t-cream);opacity:0;transform:translateY(10px);transition:all .5s}
.v2{position:relative;margin-top:12px;height:clamp(3.2rem,15vw,4.6rem)}
.v2 .alien{position:relative;display:inline-block;font:400 clamp(3rem,15vw,4.4rem)/1 "Bungee", "Impact", sans-serif;letter-spacing:.04em;opacity:0;transform:scale(1.6);transition:transform .45s cubic-bezier(.2,1.6,.4,1), opacity .25s, filter .4s;
  background:linear-gradient(180deg,#fff6c4 0%,#ffd23f 45%,#c27a12 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #6a3a00) drop-shadow(0 0 18px #ffb10088)}
.v2 .alien svg{position:absolute;left:-6%;top:8%;width:112%;height:84%;overflow:visible}
.v2 .alien svg path{fill:none;stroke:#ff2d55;stroke-width:9;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100}
.v2 .human{position:absolute;left:50%;top:-40%;transform:translateX(-50%) rotate(-8deg);font:400 clamp(2.6rem,13vw,3.8rem)/1 "Yellowtail", cursive;color:#fff;white-space:nowrap;
  text-shadow:0 0 4px #fff, 0 0 12px var(--t-main), 0 0 26px var(--t-main), 0 0 44px var(--t-accent);clip-path:inset(0 100% 0 0);transition:clip-path .8s cubic-bezier(.5,0,.3,1)}
.vip.s2 .v1{opacity:1;transform:none}
.vip.s2 .v2 .alien{opacity:1;transform:none}
.vip.s3 .v2 .alien svg path{transition:stroke-dashoffset .35s ease-out;stroke-dashoffset:0}
.vip.s3 .v2 .alien svg path:nth-child(2){transition-delay:.25s}
.vip.s3 .v2 .alien{filter:drop-shadow(0 3px 0 #6a3a00) brightness(.55)}
.vip.s5 .v2 .human{clip-path:inset(-30% -10% -30% -10%)}
.vipsay{position:absolute;top:67%;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:16px;background:#0c0716e6;box-shadow:inset 0 0 0 1px var(--rule), 0 10px 30px #000a;
  font-size:.95rem;opacity:0;transform:translateY(12px) scale(.9);transition:all .35s cubic-bezier(.2,1.4,.4,1)}
.vipsay b{color:var(--t-main)}
.vipsay .me{width:34px;height:20px;flex:none;background:radial-gradient(ellipse 30% 42% at 28% 52%, var(--lime) 60%, transparent 64%), radial-gradient(ellipse 30% 42% at 72% 52%, var(--lime) 60%, transparent 64%)}
.vip.s4 .vipsay{opacity:1;transform:none}
.vipfoot{position:absolute;bottom:4%;text-align:center;opacity:0;transform:translateY(16px);transition:all .5s}
.vipfoot b{display:block;font:400 clamp(1.6rem,8vw,2.2rem)/1 "Monoton", "Bungee", sans-serif;color:var(--t-cream);text-shadow:0 0 8px var(--t-main), 0 0 22px var(--t-main)}
.vipfoot p{margin:8px 0 4px;font-size:1rem}
.vip.s6 .vipfoot{opacity:1;transform:none}
.vip.s6 .vipsay{opacity:0;transform:translateY(-8px)}

/* --- Heist --- */
.intro.heist{background:radial-gradient(80% 60% at 50% 45%, #1c0d05 0%, #070302 70%, #000 100%)}
.heist.kick{animation:kick .12s ease-out}
@keyframes kick{40%{transform:translate(3px,-2px)}70%{transform:translate(-2px,2px)}}
.heist .flashes,.heist .holes{position:absolute;inset:0}
.muz{position:absolute;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;
  background:radial-gradient(circle, #fff 0 8%, #ffe39a 18%, #ff8a00cc 38%, #ff3d0044 55%, transparent 70%);animation:muz .22s ease-out forwards}
@keyframes muz{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.25);opacity:0}}
.hole{position:absolute;width:120px;height:120px;pointer-events:none;animation:holein .08s ease-out}
@keyframes holein{from{opacity:0}}
.caseDrop{position:absolute;top:22%;width:min(66vw,290px);aspect-ratio:1;opacity:0;transform:translateY(-120vh)}
.caseDrop i{display:block;width:100%;height:100%;background-position:center;background-size:contain;background-repeat:no-repeat}
.heist.drop .caseDrop{opacity:1;animation:dropcase .55s cubic-bezier(.5,0,.6,1.4) forwards}
@keyframes dropcase{0%{transform:translateY(-120vh) rotate(-12deg)}70%{transform:translateY(0) rotate(3deg)}85%{transform:translateY(-14px) rotate(-1deg)}100%{transform:translateY(0) rotate(0)}}
.glint{position:absolute;width:26px;height:26px;background:#fff;clip-path:polygon(50% 0,58% 42%,100% 50%,58% 58%,50% 100%,42% 58%,0 50%,42% 42%);opacity:0}
.glint.g1{left:28%;top:44%}.glint.g2{left:70%;top:52%;width:18px;height:18px}
.heist.drop .glint{animation:glint 1.2s .5s ease-in-out infinite}
.heist.drop .glint.g2{animation-delay:.9s}
@keyframes glint{0%,100%{opacity:0;transform:scale(.2) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
.heistTitle{position:absolute;bottom:8%;text-align:center}
.heistTitle b{display:block;font:400 clamp(2.4rem,13vw,3.6rem)/1 "Bungee", "Impact", sans-serif;letter-spacing:.03em;opacity:0;transform:scale(2.6);
  background:linear-gradient(180deg,#fff2c4 0%,#ffcf5a 40%,#b5730e 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #4a2a02) drop-shadow(0 0 20px #ff8a0088)}
.heist.ph-title .heistTitle b{opacity:1;transform:scale(1);transition:transform .32s cubic-bezier(.3,1.5,.5,1), opacity .15s}
.heistTitle p{margin:8px 0 0;opacity:0;transition:opacity .4s}
.heistTitle .sub{font-weight:700;color:var(--t-main)}
.heistTitle small{opacity:0;transition:opacity .4s .4s;display:block;margin-top:8px}
.heist.ph-sub .heistTitle p,.heist.ph-sub .heistTitle small{opacity:1}
@media (prefers-reduced-motion:reduce){.beams i,.vip .beam,.heist.kick,.heist.drop .caseDrop,.glint{animation:none!important}}

/* {{ICON_CSS}} */
/* ---- Moods ---- */
body{--mood:var(--lime)}
body.mood-giddy{--mood:var(--gold)} body.mood-grumpy{--mood:var(--ember)} body.mood-sleepy{--mood:var(--sky)} body.mood-mischievous{--mood:var(--violet)}
/* the reels' window carries the mood's colour, so you always know a mood is on */
body:not(.mood-happy) .app:not(.bonus) .glass{outline:2px solid color-mix(in srgb,var(--mood) 55%,transparent);outline-offset:3px;transition:outline-color .6s}
/* mood badge: runs vertically up the side edges of the face screen so it never covers the eyes */
.moodchip,.moodside{position:absolute;z-index:6;top:50%;writing-mode:vertical-rl;display:flex;align-items:center;gap:7px;padding:9px 4px;max-height:calc(100% - 20px);
  font:700 11px/1 "Chakra Petch",system-ui,sans-serif;letter-spacing:.14em;color:#fff;background:#0b0912cc;border:1px solid color-mix(in srgb,var(--mood) 65%,transparent);
  clip-path:polygon(0 6px,6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%);transition:border-color .5s;pointer-events:none;white-space:nowrap;overflow:hidden}
.moodchip{left:7px;transform:translateY(-50%) rotate(180deg)}       /* reads bottom → top */
.moodside{right:7px;transform:translateY(-50%);color:#d9d2ee;font-weight:600;letter-spacing:.06em;text-overflow:ellipsis}   /* reads top → bottom */
.moodchip i{width:9px;height:9px;border-radius:50%;flex:none;background:var(--mood);box-shadow:0 0 8px var(--mood)}
.moodchip b{color:var(--mood);font-weight:700}
.moodchip.ping,.moodside.ping{animation:chipPing 1.6s ease-out}
@keyframes chipPing{0%,100%{scale:1}15%{scale:1.15}30%{scale:1}45%{scale:1.08}60%{scale:1}}
.moodchip.ping i{animation:dotPing .4s ease-in-out 4 alternate}
@keyframes dotPing{to{box-shadow:0 0 16px 4px var(--mood)}}
.moodchip.warn,.moodside.warn{animation:chipWarn .5s steps(2) 6}
@keyframes chipWarn{50%{opacity:.35}}
.app.bonus .moodside{display:none}
.app.bonus .moodchip{display:none}
/* mood change: the face screen flashes the new colour and names the mood */
.moodshift{position:absolute;inset:0;z-index:7;display:grid;place-content:center;justify-items:center;gap:4px;pointer-events:none;opacity:0;border-radius:inherit;
  background:radial-gradient(70% 90% at 50% 50%,color-mix(in srgb,var(--mood) 30%,#000c),#000e)}
.moodshift small{font:700 11px "Chakra Petch",sans-serif;letter-spacing:.3em;color:#fff9}
.moodshift strong{font:400 34px/1 Bungee,Impact,sans-serif;color:var(--mood);text-shadow:0 0 18px var(--mood);letter-spacing:.04em}
.moodshift em{font:600 13px "Chakra Petch",sans-serif;font-style:normal;color:#fff;text-align:center;padding:0 16px}
.moodshift.show{animation:shiftIn 2.6s ease both}
.moodshift.show strong{animation:shiftWord 2.6s cubic-bezier(.3,1.5,.5,1) both}
@keyframes shiftIn{0%{opacity:0}10%,78%{opacity:1}100%{opacity:0}}
@keyframes shiftWord{0%{transform:scale(1.8);opacity:0}14%{transform:scale(1);opacity:1}}
/* sleepy: a small TAP tag on each reel you can stop */
.reel.tapstop::before{content:"TAP";position:absolute;z-index:4;left:50%;bottom:6px;transform:translateX(-50%);font:700 10px "Chakra Petch",sans-serif;letter-spacing:.18em;color:#08121a;background:#6fc8ff;padding:2px 7px;border-radius:4px;box-shadow:0 0 10px #6fc8ff;animation:tapGlow .7s ease-in-out infinite alternate}
.reel.tapped::before{display:none}
body.mood-happy .face[data-x="idle"] .cheek{opacity:.55}
body.mood-sleepy .face[data-x="sleepy"]{--fc:var(--sky)}
body.mood-giddy .face[data-x="happy"]{--fc:var(--gold)}
body.mood-giddy .face[data-x="happy"] .eyes{animation:giddyBob .42s ease-in-out infinite alternate}
@keyframes giddyBob{to{transform:translateY(-5px) scale(1.04)}}
body.mood-grumpy .face[data-x="angry"] .eyes{animation:fume .12s steps(2) infinite}
@keyframes fume{50%{transform:translateX(1px)}}
.facebox.smack{animation:smack .38s cubic-bezier(.3,1.6,.5,1)}
@keyframes smack{20%{transform:translate(-7px,2px) rotate(-1.5deg)}45%{transform:translate(6px,-1px) rotate(1deg)}70%{transform:translate(-3px,0)}}
/* hint tip: a small chip that fades in near where the trick happens */
.tip{position:absolute;left:50%;z-index:30;transform:translate(-50%,6px);max-width:min(88%,320px);padding:7px 12px 7px 30px;font:600 12.5px/1.3 "Chakra Petch",system-ui,sans-serif;letter-spacing:.02em;color:#fff;
  background:linear-gradient(135deg,#1d1830f2,#120e20f2);border:1px solid color-mix(in srgb,var(--t-main) 70%,transparent);box-shadow:0 0 18px -6px var(--t-main);opacity:0;pointer-events:none;transition:opacity .35s,transform .35s;
  clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px)}
.tip::before{content:"";position:absolute;left:11px;top:50%;width:11px;height:11px;margin-top:-6px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,var(--t-main) 60%);box-shadow:0 0 8px var(--t-main)}
.tip.show{opacity:1;transform:translate(-50%,0)}
.tip.show.out{opacity:0}
.tip.top{top:6px}.tip.mid{top:44%}.tip.bot{bottom:8px}
/* giddy nudge */
.reel.nudgeok{cursor:pointer;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--gold) 70%,transparent)}
.nudgebtn.dn{top:3px;font-size:9.5px}.nudgebtn.dn b{border-left-width:10px;border-right-width:10px;border-top:11px solid var(--gold)}
.reel.nudgeable{box-shadow:inset 0 0 0 3px var(--gold),inset 0 0 26px -6px var(--gold);cursor:pointer;z-index:2;animation:nudgeGlow .5s ease-in-out infinite alternate}
@keyframes nudgeGlow{to{box-shadow:inset 0 0 0 3px #fff6c2,inset 0 0 34px -4px var(--gold)}}
.nudgebtn{position:absolute;z-index:6;left:50%;transform:translateX(-50%);display:grid;justify-items:center;gap:2px;font:700 11px "Chakra Petch",sans-serif;letter-spacing:.14em;color:#1a1300;pointer-events:none;animation:nudgePulse .5s ease-in-out infinite alternate}
.nudgebtn b{display:block;width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent}
.nudgebtn.up{top:2px}.nudgebtn.up b{border-bottom:16px solid var(--gold)}
.nudgebtn.down{bottom:2px}.nudgebtn.down b{border-top:16px solid var(--gold)}
.nudgebtn span{background:var(--gold);padding:2px 7px;border-radius:4px}
@keyframes nudgePulse{to{transform:translateX(-50%) scale(1.12)}}
/* sleepy: reels you can stop */
.reel.tapstop{cursor:pointer}
.reel.tapstop::after{content:"";position:absolute;inset:3px;border-radius:12px;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,#6fc8ff 55%,transparent);animation:tapGlow 1.1s ease-in-out infinite alternate;pointer-events:none}
@keyframes tapGlow{from{opacity:.25}to{opacity:.9}}
.reel.tapped::after{animation:none;opacity:1;box-shadow:inset 0 0 0 2px #fff}
/* mischievous: call the bluff */
.bluff{position:absolute;z-index:7;left:50%;bottom:10px;transform:translateX(-50%);font:700 13px "Chakra Petch",sans-serif;letter-spacing:.12em;color:#fff;border:0;padding:9px 16px;cursor:pointer;
  background:linear-gradient(135deg,#b490ff,#6b3fd1);box-shadow:0 0 22px -4px #b490ff;clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);animation:nudgePulse .45s ease-in-out infinite alternate}
.bluff[disabled]{animation:none;background:#2a2340;color:#cbb8ff}
.stamp{position:absolute;z-index:8;left:50%;top:42%;transform:translate(-50%,-50%) rotate(-8deg) scale(1.6);opacity:0;font:400 30px Bungee,Impact,sans-serif;color:var(--c,#b490ff);
  border:3px solid currentColor;padding:2px 12px;border-radius:8px;text-shadow:0 0 14px currentColor;pointer-events:none;transition:transform .25s cubic-bezier(.3,1.6,.5,1),opacity .2s}
.stamp.show{opacity:1;transform:translate(-50%,-50%) rotate(-8deg) scale(1)}
.cell.swapping{position:relative;z-index:5;transition:transform .5s cubic-bezier(.5,0,.3,1.3);filter:drop-shadow(0 0 10px #b490ff)}
</style>

<script>
/* {{ICON_JS}} */
// One stylesheet rule per symbol (one copy of each image), plus decoded copies for drawing the spinning reels
const iconStyle=document.createElement("style"); document.head.appendChild(iconStyle);   // filled per machine: each role (wild, bowl…) gets that machine's picture
const ICON_IMG={};
const iconsReady=Promise.all(Object.entries(ICON_SRC).map(([k,v])=>new Promise(res=>{ const im=new Image(); im.src=v;
  const done=()=>{ ICON_IMG[k]=im; if(window.createImageBitmap) createImageBitmap(im).then(bm=>{ ICON_IMG[k]=bm; res(); }).catch(res); else res(); };
  (im.decode ? im.decode() : new Promise(r=>im.onload=r)).then(done).catch(done); })));
// The shared wallet: one balance of gold bars across every game in the casino (shared by all games; lives in slot/ for now, like the sound engine).
// Inside the lobby, the lobby holds the balance (window.__alienWallet), so it carries from game to game.
// Opened on its own, a game keeps its balance in this browser's storage, so it survives a reload.
// Each engine does: let credits = Wallet.load(START); … Wallet.watch(() => credits)  (it saves whenever the balance changes).
const Wallet = (() => {
  const KEY = "alien-casino-bars", START = 500, hooks = [];
  const host = (() => { try { if (window.parent !== window && window.parent.__alienWallet) return window.parent.__alienWallet; } catch (e) {} return null; })();
  const read = () => { if (host) return host.get(); try { const v = localStorage.getItem(KEY); return v === null ? null : Number(v); } catch (e) { return null; } };
  const write = v => { if (host) return host.set(v); try { localStorage.setItem(KEY, String(v)); } catch (e) {} };
  return {
    load() { const v = read(); if (v !== null && Number.isFinite(v) && v >= 0) return Math.floor(v); write(START); return START; },
    watch(get) { let last = get(); const save = () => { const v = get(); if (v !== last && Number.isFinite(v)) { last = v; write(Math.floor(v)); } };
      const leave = () => { for (const f of hooks) try { f(); } catch (e) {} save(); };
      setInterval(save, 250); addEventListener("pagehide", leave); document.addEventListener("visibilitychange", save); },
    // onLeave(fn): run fn just before the balance is saved when the player leaves the game (closes it) — e.g. pay out a win still animating
    onLeave(fn) { hooks.push(fn); }
  };
})();

// Shared by every game (inlined after the wallet by each game's build.py): the big-win celebration and the free refill.
// Lives in slot/ with the wallet and sound engine. Uses the game's Sound if it has one, and the game's own `credits`.
//   BigWin.show(win, bet, pre?) -> Promise   full-screen celebration when win is at least 10x the bet (and 50+ bars); resolves when it's gone
//   Refill.start(minBet, busy)         watches the balance; when it stays below minBet (and busy() isn't true: a round still in play), offers a free top-up (once an hour)
const Shared = (() => {
  const css = `
.bw{position:fixed;inset:0;z-index:9000;display:grid;place-items:center;overflow:hidden;cursor:pointer;
  background:radial-gradient(ellipse at 50% 46%,#2a1250e6 0%,#0b0418f2 62%,#030108fa 100%);animation:bwIn .35s ease-out both;-webkit-tap-highlight-color:transparent}
.bw.out{animation:bwOut .4s ease-in forwards}
.bw canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.bw .rays{position:absolute;left:50%;top:46%;width:180vmax;height:180vmax;translate:-50% -50%;opacity:.55;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,var(--bw-a) 0deg 6deg,transparent 6deg 18deg);mask:radial-gradient(circle,#000 0%,#0008 22%,transparent 52%);
  -webkit-mask:radial-gradient(circle,#000 0%,#0008 22%,transparent 52%);animation:bwSpin 14s linear infinite}
.bw .box{position:relative;text-align:center;padding:0 16px;animation:bwPop .6s cubic-bezier(.2,1.6,.4,1) both .1s}
.bw .pre{font:400 clamp(1.6rem,8vw,2.4rem)/1 "Yellowtail",cursive;color:#fff;text-shadow:0 0 12px var(--bw-b),0 2px 0 #0008;rotate:-6deg;margin-bottom:.1em}
.bw .tier{font:400 clamp(2.6rem,15vw,5rem)/.95 "Bungee","Chakra Petch",system-ui,sans-serif;letter-spacing:.02em;
  background:linear-gradient(180deg,#fffbe6 0%,var(--bw-a) 45%,var(--bw-c) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px var(--bw-b)) drop-shadow(0 4px 0 #0009);animation:bwPulse 1.1s ease-in-out infinite .7s}
.bw .amt{display:inline-flex;align-items:center;gap:.25em;margin-top:.35em;padding:.18em .6em .14em;border-radius:999px;
  font:400 clamp(2rem,11vw,3.4rem)/1 "Bungee","Chakra Petch",system-ui,sans-serif;color:#ffe9a8;background:#0009;
  box-shadow:inset 0 0 0 2px #ffd56a88,0 0 30px #ffb52e55;text-shadow:0 2px 0 #7a4a00}
.bw .amt i{width:.95em;height:.55em;border-radius:.12em;background:linear-gradient(180deg,#fff4b8,#ffc93d 45%,#b97a10);box-shadow:inset 0 -2px 0 #8a5a0a}
.bw .x{margin-top:.6em;font:700 clamp(.8rem,3.6vw,1rem)/1 "Chakra Petch",system-ui,sans-serif;letter-spacing:.3em;color:#ffffffb0}
.bw .tap{position:absolute;bottom:max(28px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;font:600 .8rem "Chakra Petch",system-ui,sans-serif;letter-spacing:.3em;color:#ffffff66;animation:bwIn .4s 1.6s both}
.bw.t3 .tier{font-size:clamp(2rem,10.5vw,3.6rem)}
.bw.t3 .box{animation:bwPop .6s cubic-bezier(.2,1.6,.4,1) both .1s,bwShake .5s .2s 2}
@keyframes bwIn{from{opacity:0}}@keyframes bwOut{to{opacity:0}}@keyframes bwSpin{to{rotate:360deg}}
@keyframes bwPop{from{opacity:0;transform:scale(.3)}}@keyframes bwPulse{50%{transform:scale(1.06)}}
@keyframes bwShake{20%{translate:-6px 3px}40%{translate:5px -4px}60%{translate:-4px -2px}80%{translate:3px 4px}}
.rf{position:fixed;inset:0;z-index:8900;display:grid;place-items:center;padding:16px;background:#05020cd9;animation:bwIn .3s ease-out both}
.rf .card{position:relative;width:min(340px,100%);padding:26px 22px 22px;border-radius:22px;text-align:center;color:#fff;
  background:linear-gradient(180deg,#24124a,#120826);box-shadow:inset 0 0 0 1.5px #ffd56a55,0 20px 60px #000c,0 0 40px #b45cff33;animation:bwPop .45s cubic-bezier(.2,1.6,.4,1) both}
.rf h3{margin:0;font:400 1.9rem/1 "Bungee","Chakra Petch",system-ui,sans-serif;color:#ffd56a;text-shadow:0 0 14px #ff9d3d88}
.rf p{margin:.7em 0 1.1em;font:500 .98rem/1.4 "Chakra Petch",system-ui,sans-serif;color:#e8dcff}
.rf .bars{display:flex;justify-content:center;gap:4px;margin:4px 0 14px}.rf .bars i{width:30px;height:16px;border-radius:3px;background:linear-gradient(180deg,#fff4b8,#ffc93d 45%,#b97a10);box-shadow:inset 0 -2px 0 #8a5a0a;animation:rfBob 1.6s ease-in-out infinite}
.rf .bars i:nth-child(2){animation-delay:.15s}.rf .bars i:nth-child(3){animation-delay:.3s}
@keyframes rfBob{50%{translate:0 -4px}}
.rf button.take{width:100%;border:0;border-radius:999px;padding:15px 18px;font:400 1.1rem/1 "Bungee","Chakra Petch",system-ui,sans-serif;color:#2a1400;cursor:pointer;
  background:radial-gradient(circle at 50% 30%,#fff3b0,#ffc93d 55%,#d98a12);box-shadow:inset 0 -3px 0 #a5650a,0 0 24px #ffb52e66}
.rf button.take:disabled{filter:grayscale(1) brightness(.6);box-shadow:none;cursor:default}
.rf button.close{position:absolute;top:10px;right:12px;width:34px;height:34px;border:0;border-radius:50%;background:#ffffff14;color:#fff;font:700 1rem system-ui;cursor:pointer}
.rf small{display:block;margin-top:12px;font:600 .72rem "Chakra Petch",system-ui,sans-serif;letter-spacing:.2em;color:#ffffff70}`;
  let styled = false; const style = () => { if (styled) return; styled = true; const s = document.createElement("style"); s.textContent = css; document.head.appendChild(s); };
  const snd = () => (typeof Sound !== "undefined" ? Sound : null);
  const play = (f) => { try { const S = snd(); if (S) f(S); } catch (e) {} };
  const repaint = () => { try { if (typeof setCredits === "function") setCredits(800); } catch (e) {} try { if (typeof update === "function") update(); } catch (e) {}
    try { if (typeof paint === "function") paint(); } catch (e) {} const el = document.getElementById("credits"); if (el && typeof credits === "number" && typeof setCredits !== "function") el.textContent = credits; };

  // ---- big wins: three sizes, each louder than the last ----
  const TIERS = [[50, "ALIEN-SIZED WIN", "Out of this world", "#7dff3a", "#2bff9a", "#0f8a3a", 3], [25, "HUGE WIN", "Whoa!", "#ff7ad9", "#ff3fae", "#8a1a6a", 2], [10, "BIG WIN", "Nice!", "#ffd23f", "#ff9d3d", "#9a5a00", 1]];
  let showing = null;
  function show(win, bet, pre) {
    win = Math.round(win); if (!(win >= 50) || !(bet > 0) || win < bet * 10 || showing) return Promise.resolve(false);
    style(); const x = win / bet, T = TIERS.find(t => x >= t[0]), lvl = T[6];
    const el = document.createElement("div"); el.className = "bw t" + lvl; el.style.setProperty("--bw-a", T[3]); el.style.setProperty("--bw-b", T[4]); el.style.setProperty("--bw-c", T[5]);
    el.innerHTML = `<div class="rays"></div><canvas></canvas><div class="box"><div class="pre">${pre || T[2]}</div><div class="tier">${T[1].replace(" ", "<br>")}</div><div class="amt"><i></i><span>0</span></div><div class="x">${x >= 100 ? Math.round(x) : x.toFixed(x < 20 ? 1 : 0)}× YOUR BET</div></div><div class="tap">TAP TO COLLECT</div>`;
    document.body.appendChild(el);
    // falling gold bars and sparks
    const cv = el.querySelector("canvas"), c = cv.getContext("2d"), dpr = Math.min(2, devicePixelRatio || 1); let W, H, bits = [], raf = 0;
    const size = () => { W = cv.clientWidth; H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr; c.setTransform(dpr, 0, 0, dpr, 0, 0); }; size();
    const spawn = (n, burst) => { for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, sp = burst ? 4 + Math.random() * 9 : 0;
      bits.push({ x: burst ? W / 2 : Math.random() * W, y: burst ? H * .46 : -20 - Math.random() * H * .3, vx: burst ? Math.cos(a) * sp : (Math.random() - .5) * 1.2, vy: burst ? Math.sin(a) * sp - 3 : 2 + Math.random() * 3,
        r: Math.random() * 6, vr: (Math.random() - .5) * .3, s: 8 + Math.random() * 10, spark: Math.random() < .35, life: 1 }); } };
    spawn(30 + lvl * 25, true); let rain = 0;
    const tick = () => { c.clearRect(0, 0, W, H); if (rain++ % (5 - lvl) === 0 && bits.length < 220) spawn(2 + lvl, false);
      bits = bits.filter(b => { b.vy += .22; b.vx *= .99; b.x += b.vx; b.y += b.vy; b.r += b.vr; if (b.spark) b.life -= .012; return b.y < H + 30 && b.life > 0; });
      for (const b of bits) { c.save(); c.translate(b.x, b.y); c.rotate(b.r); c.globalAlpha = b.life;
        if (b.spark) { c.fillStyle = T[3]; c.beginPath(); c.arc(0, 0, b.s * .18, 0, 7); c.fill(); }
        else { const w = b.s * 1.6, h = b.s * .9, g = c.createLinearGradient(0, -h / 2, 0, h / 2); g.addColorStop(0, "#fff4b8"); g.addColorStop(.45, "#ffc93d"); g.addColorStop(1, "#b97a10");
          c.fillStyle = g; c.beginPath(); c.roundRect ? c.roundRect(-w / 2, -h / 2, w, h, 2) : c.rect(-w / 2, -h / 2, w, h); c.fill(); }
        c.restore(); }
      raf = requestAnimationFrame(tick); }; raf = requestAnimationFrame(tick);
    // the amount counts up, with a coin-counter tick
    const amt = el.querySelector(".amt span"), dur = 1200 + lvl * 600, t0 = performance.now(); let lastTick = 0;
    const count = n => { const k = Math.min(1, (n - t0) / dur), e = 1 - Math.pow(1 - k, 3); amt.textContent = Math.round(win * e).toLocaleString();
      if (n - lastTick > 70 && k < 1) { lastTick = n; play(S => S.tone && S.tone(1400 + e * 900, .03, { type: "square", vol: .03 })); }
      if (k < 1 && el.isConnected) requestAnimationFrame(count); }; requestAnimationFrame(count);
    play(S => { if (S.bigWin) S.bigWin(); if (lvl >= 2 && S.arp) setTimeout(() => S.arp([0, 4, 7, 12, 16, 19, 24], .06, { type: "triangle", vol: .09, dur: .3 }), 500); });
    showing = new Promise(res => { let done = false;
      const close = () => { if (done) return; done = true; el.classList.add("out"); setTimeout(() => { cancelAnimationFrame(raf); el.remove(); showing = null; res(true); }, 400); };
      const minT = setTimeout(() => el.addEventListener("pointerdown", e => { e.stopPropagation(); close(); }), 700); setTimeout(close, dur + 2600 + lvl * 400); });
    return showing;
  }

  // ---- free refill: when the balance runs dry, the house tops you back up (once an hour) ----
  const KEY = "alien-casino-refill-at", COOL = 60 * 60 * 1000, TO = 100;
  // a refill time in the future means the clock was wound back: restart the hour from now, so clock games don't pay
  const lastAt = () => { try { let at = Number(localStorage.getItem(KEY)) || 0; if (at > Date.now()) { at = Date.now(); localStorage.setItem(KEY, String(at)); } return at; } catch (e) { return 0; } };
  let card = null, dismissedUntilReady = false, minBet = 10, low = 0;
  function offer() {
    if (card) return; style(); card = document.createElement("div"); card.className = "rf";
    card.innerHTML = `<div class="card"><button class="close" aria-label="Close">✕</button><h3>OUT OF BARS</h3><p>The aliens don't want you leaving early. Have some on the house.</p><div class="bars"><i></i><i></i><i></i></div><button class="take"></button><small></small></div>`;
    document.body.appendChild(card); const take = card.querySelector(".take"), note = card.querySelector("small");
    const paintCard = () => { if (!card) return; const left = COOL - (Date.now() - lastAt());
      if (left <= 0) { take.disabled = false; take.textContent = `TAKE ${TO} FREE BARS`; note.textContent = "A free refill once an hour"; }
      else { const m = Math.floor(left / 60000), s = Math.floor(left / 1000) % 60; take.disabled = true; take.textContent = `NEXT REFILL ${m}:${String(s).padStart(2, "0")}`; note.textContent = "Or grab your daily reward from the menu"; } };
    paintCard(); const iv = setInterval(paintCard, 500);
    const shut = () => { clearInterval(iv); if (card) card.remove(); card = null; };
    card.querySelector(".close").onclick = () => { dismissedUntilReady = COOL - (Date.now() - lastAt()) > 0; shut(); };
    take.onclick = () => { if (take.disabled || typeof credits !== "number") return; try { localStorage.setItem(KEY, String(Date.now())); } catch (e) {}
      credits = Math.max(credits, TO); play(S => S.refill && S.refill()); repaint(); shut(); };
  }
  function start(mb, busy) { minBet = mb || 1;
    setInterval(() => { if (typeof credits !== "number") return; try { if (busy && busy()) { low = 0; return; } } catch (e) {} if (credits >= minBet) { low = 0; dismissedUntilReady = false; if (card) { card.remove(); card = null; } return; }
      low++; const ready = COOL - (Date.now() - lastAt()) <= 0; if (dismissedUntilReady && ready) dismissedUntilReady = false;
      if (low >= 8 && !card && !dismissedUntilReady && !showing) offer(); }, 500); }   // 4 s of being broke, so a round still paying out can land first
  // balances of a million or more show short (1.23M) so the header never overflows; games keep writing plain numbers to #credits
  const compact = () => { const el = document.getElementById("credits"); if (!el) return;
    const fix = () => { const t = el.textContent.replace(/,/g, ""); if (/^\d{7,}$/.test(t)) { const n = +t; el.textContent = (n >= 1e9 ? (n / 1e9).toFixed(2) + "B" : (n / 1e6).toFixed(n >= 1e8 ? 0 : 2) + "M"); } };
    new MutationObserver(fix).observe(el, { childList: true, characterData: true, subtree: true }); fix(); };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", compact); else setTimeout(compact, 0);
  // opened on its own (not inside the casino app, which has its own), a sideways phone gets the same turn-it-upright card
  if (window.parent === window) { const add = () => { const st = document.createElement("style"); st.textContent = `/* phones turned sideways: the casino is built upright, so ask to turn back rather than show a squashed layout */
#rotate{display:none;position:fixed;inset:0;z-index:2147483000;place-items:center;align-content:center;gap:18px;text-align:center;background:#07030f;color:#e8dcff;font:600 1rem/1.4 "Chakra Petch",system-ui,sans-serif;letter-spacing:.04em}
#rotate i{display:block;width:44px;height:74px;margin:0 auto;border:3px solid #b48cff;border-radius:10px;box-shadow:0 0 18px #8a4dff88,inset 0 0 0 3px #07030f,inset 0 -8px 0 -5px #b48cff;animation:rotPh 2.2s ease-in-out infinite}
#rotate b{display:block;font:400 1.3rem/1 "Bungee","Chakra Petch",system-ui,sans-serif;color:#ffd56a;margin-bottom:4px}
@keyframes rotPh{0%,20%{rotate:-90deg}55%,100%{rotate:0deg}}
@media (orientation:landscape) and (max-height:500px){#rotate{display:grid}}`; document.head.appendChild(st); document.body.insertAdjacentHTML("beforeend", '<div id="rotate" aria-live="polite"><i></i><div><b>TURN IT UPRIGHT</b>The casino is built for holding your phone upright.</div></div>'); };
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", add); else setTimeout(add, 0); }

})();

// <engine> (this block is also run by the tuning simulation)
// ---- Paytable (tuned by simulation) ----
// [id, name, weight, pays for 3 on a line, pays for first 2 on a line, banana?] — pays are × line cost
const SYMBOLS = [
  ["wild",    "Spiky fruit",  1.5, 150,10, 0],   // WILD: counts as any symbol
  ["boar",    "Alien boar",     2,  72, 5, 0],
  ["chicken", "Alien chicken",  3,  42, 3, 0],
  ["egg",     "Chicken egg",    4,  27, 2, 0],
  ["drink",   "Bubbly drink",   5,  19, 2, 0],
  ["pasta",   "Space pasta",    6,  12, 1, 0],
  ["wrap",    "Lettuce wrap",   7,   8, 1, 0],
  ["banana3", "Triple banana",  5,  13, 1, 1],
  ["banana2", "Double banana",  7,   7, 1, 1],
  ["banana1", "Single banana",  9,   4, 0, 1],
  ["bowl",    "Goop bowl",    2.2,   0, 0, 0],   // SCATTER: 3+ anywhere on screen starts Bowl-nus spins
  ["jug",     "Goop jug",       0,   0, 0, 0],   // appears only during Bowl-nus spins: each one adds spins

const WILD = 0, BOWL = 10, JUG = 11;
// Bowl-nus spins: free spins at the bet that triggered them, every win multiplied
// Multiplier booster: during Bowl-nus spins every top-paying symbol (role 1: boar / DJ / Capone) that lands adds +1 to the multiplier, up to multCap
const BONUS = { spins3:8, spins4:12, mult:3, multSym:1, multCap:6, jugAdds:2, floor:8, weights:{ bowl:0, jug:0.15, boar:0.6, wild:3, banana1:4 } };   // retuned: bonus rounds pay ~35x the bet on average and never under 8x (floor)
let bonusMult = BONUS.mult;
let ANY_LABEL = "Any bananas";   // set per machine
const ANY_BANANA = 4;   // any mix of three bananas (or wilds) on a line
const LINE_COST = 2, START = 200;
const LINES = [[1,1,1],[0,0,0],[2,2,2],[0,1,2],[2,1,0]];  // turn on in this order
const LINE_COLORS = ["--l1","--l2","--l3","--l4","--l5"];
// Hidden streak system. The losing streak counts in "full bets" (a 1-line loss counts 1/5), so playing 1 line can't game it.
const STREAK = { pityPerLoss:0.09, pityBehind:0.35, pityMax:0.6, taxAhead:0.45, taxAfterBig:0.35, taxMax:0.6, bigWinX:12, coolSpins:5 };

// ---- Moods: the machine's mood changes how results arrive and what tapping does. Overall payout stays in a tight band; moods change the SHAPE of winning.
//  happy:       baseline, honest teases
//  giddy:       extra small wins + a few more bowls; after every spin the player may NUDGE one reel down a step (handled on screen)
//  grumpy:      throws back most small wins, but sometimes digs up a big one — swingier, same-ish payout
//  sleepy:      slow reels; the player taps to stop each reel themselves (handled on screen)
//  mischievous: fakes bonus teases (plants 2 bowls that can't land a 3rd) and sometimes swaps two symbols after the reels stop
const MOODS = {
  happy:       { len:[18,32] },
  giddy:       { len:[12,22], bowlX:1, tax:.2 },
  grumpy:      { len:[14,26], cutSmall:.75, hunt:.025, huntX:5 },
  sleepy:      { len:[10,18] },
  mischievous: { len:[12,22], swap:.16, swapGood:.4, fake:.07 },

const MOOD_LIST = Object.keys(MOODS);
let mood = "happy", moodLeft = 24, moodNext = null, moodRecent = [];
function setMood(m, len){ mood = m; moodNext = null; const L = MOODS[m].len; moodLeft = len || (L[0] + Math.floor(Math.random()*(L[1]-L[0]+1))); }
function pickNextMood(){
  // the player's recent results push the mood: winning big makes it grumpy, losing makes it happy/giddy (it's eating well)
  const net = moodRecent.reduce((a,b)=>a+b,0) / Math.max(1, cost()*moodRecent.length);
  const w = { happy:3, giddy:2, grumpy:2, sleepy:1.6, mischievous:1.6 };
  if(net > .1){ w.grumpy *= 3; w.giddy *= .5; }
  if(net < -.4){ w.happy *= 1.5; w.giddy *= 2; w.grumpy *= .5; }
  w[mood] = 0;
  let r = Math.random()*MOOD_LIST.reduce((a,m)=>a+w[m],0);
  for(const m of MOOD_LIST){ if((r -= w[m]) < 0) return m; } return "happy";
}
function moodTick(total, spent){   // once per paid spin; returns {warn: next} two spins before a change, {changed, from} when it happens
  moodRecent.push(total - spent); if(moodRecent.length > 12) moodRecent.shift();
  moodLeft--;
  if(moodLeft === 2){ moodNext = pickNextMood(); return { warn:moodNext }; }
  if(moodLeft <= 0){ const from = mood; setMood(moodNext || pickNextMood()); return { changed:mood, from }; }
  return null;
}

const W_BASE  = SYMBOLS.map(s=>s[2]);
const W_BONUS = SYMBOLS.map(s=> s[0] in BONUS.weights ? BONUS.weights[s[0]] : s[2]);
const W_GIDDY = SYMBOLS.map((s,i)=> i===BOWL ? s[2]*MOODS.giddy.bowlX : s[2]);
const SUM = w => w.reduce((a,b)=>a+b,0), SUM_BASE = SUM(W_BASE), SUM_BONUS = SUM(W_BONUS), SUM_GIDDY = SUM(W_GIDDY);
const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

let credits = typeof Wallet !== "undefined" ? Wallet.load() : START, lines = 3, spinning = false;
let lossStreak = 0, coolLeft = 0, lastPity = 0, lastTax = 0;
let bonusLeft = 0, bonusTotal = 0, bonusPlayed = 0, bonusLines = 0;   // bonusLines: the bet is locked at what triggered the bonus
let grid = [[7,1,5],[4,0,8],[3,2,6]]; // grid[reel][row]
const cost = () => lines * LINE_COST;

function pick(bonus=false, giddy=false){ const w = bonus ? W_BONUS : giddy ? W_GIDDY : W_BASE; let r = Math.random()*(bonus ? SUM_BONUS : giddy ? SUM_GIDDY : SUM_BASE);
