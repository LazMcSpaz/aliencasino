function rollGrid(bonus=false, giddy=false){ return [0,1,2].map(()=>[0,1,2].map(()=>pick(bonus, giddy))); }
const countOf = (g, sym) => g.flat().filter(v=>v===sym).length;

// Best pay on one line, treating the wild as whatever symbol pays most
function linePay(a,b,c){
  let best = null;
  const usedWild = n => [a,b,c].slice(0,n).includes(WILD);
  const consider = (count, mult, label) => { if(mult>0 && (!best || mult>best.mult)) best = {count, mult, label, wild:usedWild(count)}; };
  if(a===WILD && b===WILD && c===WILD) consider(3, SYMBOLS[WILD][3], SYMBOLS[WILD][1]);
  for(let x=0; x<SYMBOLS.length; x++){ if(x===WILD) continue;
    const m = v => v===x || v===WILD;
    if(m(a) && m(b) && m(c)) consider(3, SYMBOLS[x][3], SYMBOLS[x][1]);
    else if(m(a) && m(b)) consider(2, SYMBOLS[x][4], SYMBOLS[x][1]);
  }
  const ban = v => v===WILD || SYMBOLS[v][5];
  if(ban(a) && ban(b) && ban(c)) consider(3, ANY_BANANA, ANY_LABEL);
  if(best && best.wild && best.label!==SYMBOLS[WILD][1]) best.label += " (wild)";
  return best;
}
function evaluate(g){
  const wins = [];
  LINES.slice(0, lines).forEach((L,li)=>{ const w = linePay(g[0][L[0]], g[1][L[1]], g[2][L[2]]);
    if(w) wins.push({line:li, count:w.count, label:w.label, amount:w.mult*LINE_COST}); });
  return wins;
}
const payOf = g => evaluate(g).reduce((a,w)=>a+w.amount,0);

// Test hook (debug menu): force the next paid spin to trigger the bonus or land a big win
const FORCE = { bonus:false, big:false };
function forcedGrid(){
  const g = rollGrid().map(col=>col.map(v=>v===BOWL ? 6 : v));      // start from a random screen with no stray bowls
  if(FORCE.bonus){ FORCE.bonus=false; [0,1,2].forEach(r=>{ g[r][Math.floor(Math.random()*3)] = BOWL; }); return g; }
  FORCE.big=false; [0,1,2].forEach(r=>{ g[r][1] = 1; }); return g;   // three of the top symbol on the middle line
}
function decideResult(){ // runs after the bet is taken
  if(FORCE.bonus || FORCE.big) return forcedGrid();
  const M = MOODS[mood], roll = () => rollGrid(false, mood==="giddy");
  let g = roll();
  const behind = Math.max(0,(START-credits)/START), ahead = Math.max(0,(credits-START)/START);
  lastPity = Math.min(.8, Math.min(STREAK.pityMax, STREAK.pityPerLoss*lossStreak + STREAK.pityBehind*behind) + (M.pity||0));
  lastTax  = Math.min(STREAK.taxMax, STREAK.taxAhead*ahead + (coolLeft>0 ? STREAK.taxAfterBig : 0));
  if(payOf(g)===0 && countOf(g,BOWL)<3 && Math.random()<lastPity) g = roll();
  if(payOf(g)>0  && Math.random()<lastTax)  g = roll();
  if(M.tax && payOf(g)>0 && countOf(g,BOWL)<3 && Math.random()<M.tax) g = roll();   // giddy: nudges hand out wins, so the base spin is a touch leaner
  if(M.cutSmall){ const p = payOf(g); if(p>0 && p<cost()*3 && countOf(g,BOWL)<3 && Math.random()<M.cutSmall) g = roll(); }   // grumpy throws back small wins…
  if(M.hunt && payOf(g)===0 && countOf(g,BOWL)<3 && Math.random()<M.hunt){                                                   // …and now and then digs up a big one
    for(let k=0;k<40;k++){ const h = roll(); if(payOf(h) >= cost()*M.huntX){ g = h; break; } } }
  return g;
}
function afterSpin(total, spent){
  lossStreak = total===0 ? lossStreak + lines/5 : 0;
  if(total >= spent*STREAK.bigWinX) coolLeft = STREAK.coolSpins; else if(coolLeft>0) coolLeft--;
  if(typeof document==="undefined") return; // running inside the simulation
  $("debug").textContent = `losing streak ${lossStreak.toFixed(1)} full bets · comeback chance ${Math.round(lastPity*100)}% · cool-off ${Math.round(lastTax*100)}%${coolLeft?` · cold spins left ${coolLeft}`:""}`;
}

// Mischievous: find two neighbouring symbols to swap that change the payout (helpful with chance `good`, otherwise harmful)
function pickSwap(g, good){
  const base = payOf(g), up = [], down = [];
  const cells = []; for(let r=0;r<3;r++) for(let row=0;row<3;row++) cells.push([r,row]);
  for(const a of cells) for(const b of cells){
    const adj = (a[0]===b[0] && b[1]===a[1]+1) || (a[1]===b[1] && b[0]===a[0]+1);
    if(!adj || g[a[0]][a[1]]===g[b[0]][b[1]]) continue;
    const h = g.map(c=>c.slice()); [h[a[0]][a[1]], h[b[0]][b[1]]] = [h[b[0]][b[1]], h[a[0]][a[1]]];
    const d = payOf(h) - base; if(d>0) up.push({a,b,d,h}); else if(d<0) down.push({a,b,d,h}); }
  const list = (Math.random()<good && up.length) || !down.length ? up : down;
  return list.length ? list[Math.floor(Math.random()*list.length)] : null;
}
// Giddy nudge: slide reel k down one step and score the NEW result in place of the old one —
// nudge a winning spin and you can lose the win, so it's a real decision.
function nudgeReel(r, k){
  const g = r.g.map(c=>c.slice()); g[k] = [r.above[k], g[k][0], g[k][1]];

}
// Re-score a spin after the player changed the reels (sleepy stop, giddy nudge). Adjusts credits by the difference.
function rescore(r, g){
  const wins = evaluate(g).map(w=>({...w, amount:w.amount*r.mult})), total = wins.reduce((a,w)=>a+w.amount,0);

    else if(bowls<3 && r.triggered){ bonusLeft = 0; r.triggered = 0; }
    r.bowls = bowls;
  }
  Object.assign(r, { g, wins, total }); return r;
}

// One full spin: takes the bet (unless it's a Bowl-nus spin), picks the result, pays out, handles the bonus
function resolveSpin(){
  const inBonus = bonusLeft > 0; if(inBonus && bonusLines) lines = bonusLines; const spent = inBonus ? 0 : cost();
  let g;
  if(inBonus){ bonusLeft--; bonusPlayed++; g = rollGrid(true); }
  let landed = null, swap = null, nudge = null, fake = false, above = null;
  if(!inBonus){ credits -= spent; const forced = FORCE.bonus || FORCE.big; g = decideResult();
    const M = MOODS[mood];
    if(!forced && mood==="mischievous" && countOf(g,BOWL)<3){
      if(Math.random() < M.fake){   // fake tease: a bowl on reels 1 and 2, and none on reel 3 — it can't actually land
        [0,1].forEach(r=>{ if(!g[r].includes(BOWL)) g[r][Math.floor(Math.random()*3)] = BOWL; });
        g[2] = g[2].map(v=> v===BOWL ? 6 : v); fake = true; }
      else if(Math.random() < M.swap){ const sw = pickSwap(g, M.swapGood); if(sw){ landed = g; g = sw.h; swap = { a:sw.a, b:sw.b, helped:sw.d>0 }; } }
    }
    if(mood==="giddy"){   // the symbol sitting just above each reel — what a nudge would pull into view (never a bowl)
      above = [0,1,2].map(()=>{ let v; do v = pick(); while(v===BOWL || v===WILD); return v; }); }
  }
  const boosts = inBonus ? countOf(g, BONUS.multSym) : 0, multBefore = bonusMult;
  if(inBonus) bonusMult = Math.min(BONUS.multCap, bonusMult + boosts);
  const mult = inBonus ? bonusMult : 1;
  const wins = evaluate(g).map(w=>({...w, amount:w.amount*mult}));
  const total = wins.reduce((a,w)=>a+w.amount,0);
  const bowls = countOf(g,BOWL), jugs = inBonus ? countOf(g,JUG) : 0;

  if(inBonus){
    bonusTotal += total;
    if(jugs){ added = jugs*BONUS.jugAdds; bonusLeft += added; }

      if(BONUS.floor && bonusTotal < cost()*BONUS.floor){ topUp = cost()*BONUS.floor - bonusTotal; credits += topUp; bonusTotal += topUp; }

  } else {
    afterSpin(total + (bowls>=3 ? 1 : 0), spent);
    if(bowls>=3){ triggered = bowls>=4 ? BONUS.spins4 : BONUS.spins3; bonusLeft = triggered; bonusTotal = 0; bonusPlayed = 0; bonusMult = BONUS.mult; bonusLines = lines; }
  }

}

// Tease planner: looks at the result before the reels stop and decides how much drama to add
// tier "goop" = 2 bowls on reels 1–2 (one more starts Bowl-nus) · "big" = a top symbol set up on a played line · "mild" = a mid symbol set up
// early = a bowl on reel 1, so reel 2 lingers a moment
const TEASE_TOP = new Set([WILD, 1, 2]);   // wild, boar, chicken
const TEASE_MID = new Set([3, 4, 7]);      // egg, drink, triple banana
function teaseInfo(g, bonus=false){
  const out = { early:false, tier:null, setup:[], line:null };
  if(!bonus && g[0].includes(BOWL)) out.early = true;
  const bowls01 = [];
  [0,1].forEach(r=>g[r].forEach((v,row)=>{ if(v===BOWL) bowls01.push([r,row]); }));
  if(!bonus && bowls01.length>=2){ out.tier="goop"; out.setup=bowls01; return out; }
  let best = 0;
  LINES.slice(0,lines).forEach((L,li)=>{ const a=g[0][L[0]], b=g[1][L[1]];
    if(a===BOWL || b===BOWL || a===JUG || b===JUG) return;
    if(!(a===b || a===WILD || b===WILD)) return;
    const sym = a===WILD ? b : a;
    const rank = TEASE_TOP.has(sym) ? 2 : TEASE_MID.has(sym) ? 1 : 0;
    if(rank > best){ best = rank; out.line = li; out.setup = [[0,L[0]],[1,L[1]]]; } });
  out.tier = best===2 ? "big" : best===1 ? "mild" : null;
  return out;
}

// keep the shared wallet in step with this game's balance (not in Node tests)
// closing the game in the middle of free spins plays the rest out instantly and pays them, so leaving never throws away a bonus
if (typeof Wallet !== "undefined") Wallet.onLeave(() => { let n = 0; while (bonusLeft > 0 && n++ < 500) resolveSpin(); });
if (typeof Wallet !== "undefined") Wallet.watch(() => credits);


// ---- Rendering ----
function cellEl(i){ const d=document.createElement("div"); d.className="cell s-"+SYMBOLS[i][0]; d.setAttribute("role","img"); d.setAttribute("aria-label",SYMBOLS[i][1]); return d; }
function setCell(el,i){ el.className="cell s-"+SYMBOLS[i][0]; el.setAttribute("aria-label",SYMBOLS[i][1]); }

// ---- Canvas reels: the spinning is drawn on one small canvas per reel, then the real cells take over when it lands ----
const DPR=Math.min(2, devicePixelRatio||1);
let SPR=[], sprCell=0;
function makeSprites(cell){ // pre-draw every symbol (and its tag) at the exact size it shows on screen

  SPR = SYMBOLS.map((s,i)=>{ const c=document.createElement("canvas"); c.width=c.height=px; const g=c.getContext("2d"), im=ICON_IMG[MACH.icons[s[0]]];
    if(im){ const d=px*.86, o=(px-d)/2; g.drawImage(im,o,o,d,d); }
    const tag = i===WILD ? ["WILD","#ffd23f","#0a0816"] : i===BOWL ? ["BONUS","#7dff3a","#0b2a00"] : i===JUG ? ["+2 SPINS","#7dff3a","#0b2a00"] : null;
    if(tag){ const fs=Math.round(px*.105); g.font=`${fs}px Bungee, Impact, sans-serif`; const tw=g.measureText(tag[0]).width+fs*.9, th=fs*1.5, tx=(px-tw)/2, ty=px*.94-th;
      g.fillStyle=tag[1]; g.beginPath(); g.roundRect ? g.roundRect(tx,ty,tw,th,fs*.45) : g.rect(tx,ty,tw,th); g.fill();
      g.fillStyle=tag[2]; g.textAlign="center"; g.textBaseline="middle"; g.fillText(tag[0], px/2, ty+th*.56); }
    return c; });
}
function sizeReelCanvas(){ const cell=parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--cell"))||90;
  for(let r=0;r<3;r++){ const c=$("rc"+r); c.width=Math.round(cell*DPR); c.height=Math.round(cell*3*DPR); } makeSprites(cell); return cell; }
const bez=(x1,y1,x2,y2)=>{ const cx=3*x1, bx=3*(x2-x1)-cx, ax=1-cx-bx, cy=3*y1, by=3*(y2-y1)-cy, ay=1-cy-by;
  const X=t=>((ax*t+bx)*t+cx)*t, Y=t=>((ay*t+by)*t+cy)*t, dX=t=>(3*ax*t+2*bx)*t+cx;
  return x=>{ if(x<=0) return 0; if(x>=1) return 1; let t=x; for(let k=0;k<8;k++){ const e=X(t)-x, d=dX(t); if(Math.abs(e)<1e-5||!d) break; t-=e/d; } return Y(Math.min(1,Math.max(0,t))); }; };

function drawReel(r, plan, o, vel){
  const c=$("rc"+r), g=c.getContext("2d"), H=c.width; g.clearRect(0,0,c.width,c.height);
  const base=Math.floor(o), frac=o-base, blur=Math.min(1, Math.max(0,(vel-.12)/.5));
  for(let k=0;k<4;k++){ const sp=SPR[plan.seq[base+k]]; if(!sp) continue; const y=(k-frac)*H;
    if(blur>0){ g.globalAlpha=.55+.15*(1-blur); g.drawImage(sp,0,y); g.globalAlpha=.32*blur; g.drawImage(sp,0,y+vel*H*.5); g.globalAlpha=1; }
    else g.drawImage(sp,0,y); }
}

// ---- Sound: all synthesized live with Web Audio, no sound files needed ----
const Sound = (()=>{
  let ctx=null, master=null, mbus=null, on=true, musicOn=true, mlevel=1;
  try{ on = localStorage.getItem("slot-sound")!=="off"; musicOn = localStorage.getItem("slot-music")!=="off"; }catch(e){}

    if(!ctx){ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null;
      let shared=null; try{ if(window.parent!==window && window.parent.__alienAudio) shared=window.parent.__alienAudio(); }catch(e){}   // inside the casino app: use its audio, already unlocked by a tap
      ctx=shared||new AC(); master=ctx.createGain(); master.gain.value=0.55;
      const lim=ctx.createDynamicsCompressor(); lim.threshold.value=-10; lim.knee.value=6; lim.ratio.value=8; lim.attack.value=.003; lim.release.value=.15;
      master.connect(lim).connect(ctx.destination);   // limiter: stops loud moments from overdriving a phone speaker

      mbus=ctx.createGain(); mbus.gain.value=musicOn?mlevel:0; mbus.connect(hp).connect(master); decodeClips(); }
    if(ctx.state==="suspended") ctx.resume();
    return ctx;
  }
  // lp = low-pass filter cutoff (warmer, rounder sound); lpEnd = where the cutoff sweeps to; detune in cents; bus "music" goes through the music volume
  function tone(freq, dur, {type="sine", vol=0.2, at=0, slide=0, attack=0.004, lp=0, lpEnd=0, q=1, detune=0, bus=null, vib=0}={}){
    if(!on) return; const c=ensure(); if(!c) return; if(bus==="music") attack=Math.max(attack,.008);   // softer note starts = no clicks
    const t=c.currentTime+Math.max(0,at), o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t); if(detune) o.detune.value=detune;

function fit(){ // reels get the space first; the face gets between ~18% and 25% of the screen

function introShell(cls, html){ const el=document.createElement("div"); el.className="intro "+cls; el.setAttribute("role","dialog"); el.innerHTML=html; document.body.appendChild(el);
  requestAnimationFrame(()=>el.classList.add("on")); return el; }
function introEnd(el, minMs, maxMs){ return new Promise(res=>{ const t0=performance.now(); let done=false;
  const close=()=>{ if(done) return; done=true; el.classList.remove("on"); el.classList.add("off"); setTimeout(()=>{ el.remove(); res(); }, 450); };
  el.addEventListener("click",()=>{ if(performance.now()-t0>minMs) close(); }); setTimeout(close, maxMs); }); }
const at=(ms,fn)=>setTimeout(fn,ms);

// Bullet hole: drawn fresh each time — dark puncture, frosted crush ring, jagged branching cracks and broken fracture rings
function holeCanvas(){
  const S=140, c=document.createElement("canvas"); c.width=c.height=S*2; const g=c.getContext("2d"); g.scale(2,2); g.translate(S/2,S/2);
  const soot=g.createRadialGradient(0,0,2,0,0,22); soot.addColorStop(0,"rgba(0,0,0,.55)"); soot.addColorStop(1,"rgba(0,0,0,0)"); g.fillStyle=soot; g.beginPath(); g.arc(0,0,22,0,Math.PI*2); g.fill();
  const n=8+Math.floor(Math.random()*5), base=Math.random()*Math.PI*2, rays=[];
  g.lineCap="round"; g.lineJoin="round";
  const crack=(x,y,ang,len,w,depth)=>{ const pts=[[x,y]]; let a=ang, d=0;
    while(d<len){ const step=4+Math.random()*6; a+=(Math.random()-.5)*.7; x+=Math.cos(a)*step; y+=Math.sin(a)*step; d+=step; pts.push([x,y]);
      if(depth<2 && Math.random()<.16) crack(x,y,a+(Math.random()<.5?-1:1)*(.5+Math.random()*.5),len*(.25+Math.random()*.3),w*.6,depth+1); }
    for(let i=1;i<pts.length;i++){ const t=i/pts.length; g.strokeStyle=`rgba(255,255,255,${(.85-.6*t)*(depth?.7:1)})`; g.lineWidth=Math.max(.35,w*(1-t*.8));
      g.beginPath(); g.moveTo(pts[i-1][0],pts[i-1][1]); g.lineTo(pts[i][0],pts[i][1]); g.stroke(); }
    return pts; };
  for(let i=0;i<n;i++){ const ang=base+i*Math.PI*2/n+(Math.random()-.5)*.5; rays.push(crack(Math.cos(ang)*5,Math.sin(ang)*5,ang,26+Math.random()*34,1.6,0)); }
  for(const R of [11+Math.random()*4, 21+Math.random()*7]){   // fracture rings: short jagged links between neighbouring cracks
    g.strokeStyle="rgba(255,255,255,.42)"; g.lineWidth=.7;
    rays.forEach((r,i)=>{ if(Math.random()<.35) return; const q=rays[(i+1)%rays.length]; const pa=r.find(p=>Math.hypot(p[0],p[1])>R), pb=q.find(p=>Math.hypot(p[0],p[1])>R); if(!pa||!pb) return;
      const mx=(pa[0]+pb[0])/2*(1+(Math.random()-.5)*.25), my=(pa[1]+pb[1])/2*(1+(Math.random()-.5)*.25); g.beginPath(); g.moveTo(pa[0],pa[1]); g.lineTo(mx,my); g.lineTo(pb[0],pb[1]); g.stroke(); }); }
  const crush=g.createRadialGradient(0,0,2,0,0,10); crush.addColorStop(0,"rgba(255,255,255,.55)"); crush.addColorStop(.6,"rgba(220,230,240,.25)"); crush.addColorStop(1,"rgba(255,255,255,0)");
  g.fillStyle=crush; g.beginPath(); g.arc(0,0,10,0,Math.PI*2); g.fill();
  g.fillStyle="#050302"; g.beginPath(); for(let k=0;k<10;k++){ const a=k/10*Math.PI*2, r=3.6+Math.random()*1.6; k?g.lineTo(Math.cos(a)*r,Math.sin(a)*r):g.moveTo(Math.cos(a)*r,Math.sin(a)*r); } g.closePath(); g.fill();
  g.strokeStyle="rgba(255,255,255,.5)"; g.lineWidth=.6; g.stroke();
  for(let k=0;k<6;k++){ const a=Math.random()*Math.PI*2, r=6+Math.random()*10; g.fillStyle="rgba(255,255,255,.7)"; g.fillRect(Math.cos(a)*r,Math.sin(a)*r,1,1); }
  c.className="hole"; return c;
}
const GUN_SHOTS=[71,150,233,323,404,493,578,625,675,721];   // ms of each shot in the recorded burst (found from the peaks in the audio)
async function introHeist(n){ // Mob: a burst of tommy-gun fire cracks the glass, tyres squeal off-screen, the briefcase is left behind
  const el=introShell("heist",`<i class="backdrop" style="background-image:url(${ICON_SRC.bg_mob})"></i><div class="holes"></div><div class="flashes"></div>
    <div class="caseDrop"><i></i><span class="glint g1"></span><span class="glint g2"></span></div>
    <div class="heistTitle"><b>BRIEF-CASH</b><p>The family's paying up.</p><p class="sub">${n} free spins · every win ×${BONUS.mult}</p><small>Tap to open the case</small></div>`);
  el.querySelector(".caseDrop i").style.backgroundImage=`url(${ICON_SRC.m_caseBig})`;
  const holes=el.querySelector(".holes"), flashes=el.querySelector(".flashes"), START=350;
  const realGun = Sound.clip("gun", {vol:.9, at:START/1000});
  GUN_SHOTS.forEach(ms=>at(START+ms,()=>{ const x=12+Math.random()*76, y=10+Math.random()*58;
    const m=document.createElement("i"); m.className="muz"; m.style.left=x+"%"; m.style.top=y+"%"; flashes.appendChild(m); setTimeout(()=>m.remove(),260);
    const h=holeCanvas(); h.style.left=(x+(Math.random()*6-3))+"%"; h.style.top=(y+(Math.random()*6-3))+"%"; h.style.transform=`translate(-50%,-50%) rotate(${Math.random()*360}deg) scale(${.75+Math.random()*.45})`; holes.appendChild(h);
    el.classList.remove("kick"); void el.offsetWidth; el.classList.add("kick"); if(!realGun) SFX.gunshot(); }));
  const DRIVE=START+GUN_SHOTS[GUN_SHOTS.length-1]+350;
  at(DRIVE-150,()=>{ if(!Sound.clip("tire",{vol:.8})){ SFX.engine(); SFX.squeal(); } });
  at(DRIVE,()=>{ el.classList.add("drive"); setBonusVisuals(true); });
  at(DRIVE+800,()=>{ el.classList.add("drop"); SFX.caseThud(); });
  at(DRIVE+1150,()=>{ burst(innerWidth/2, innerHeight*.5, 26, "bars"); SFX.cashJingle(); });
  at(DRIVE+1650,()=>{ el.classList.add("ph-title"); SFX.caseThud(); SFX.vipChord(-5); });
  at(DRIVE+2250,()=>{ el.classList.add("ph-sub"); });
  return introEnd(el, DRIVE+2350, DRIVE+6200);
}
function bump(el){ el.classList.add("bump"); setTimeout(()=>el.classList.remove("bump"),160); }

    spinning=false; update();
    let pause=650;
    const glowAll = sym => [0,1,2].forEach(i=>[0,1,2].forEach(j=>{ if(result[i][j]===sym) cellAt(i,j).classList.add("scatter"); }));
    if(r.bowls>=2 && !r.inBonus) glowAll(BOWL);
    if(r.jugs) glowAll(JUG);
    const missed = (heavy && t.tier==="big" && x<3) || (t.tier==="goop" && !r.triggered);
    if(total>0){
      $("glass").classList.add("result"); showWins(wins);
      wins.forEach(w=>LINES[w.line].slice(0,w.count).forEach((row,reel)=>cellAt(reel,row).classList.add("hit")));
      const partial = !r.inBonus && total < r.spent;   // got some back, but still down on this spin
      const level = x>=STREAK.bigWinX ? 2 : x>=3 ? 1 : 0, countMs = level===2?1800:level?900:Math.min(1400,350+total*5);
      animateNumber($("winv"),0,total,countMs);
      if(!partial) coinBurst(Math.min(90, 6 + Math.round(total/3)));
      setTimeout(()=>setCredits(1100), 500);
      const bigShow = level===2 && !r.inBonus;   // the shared full-screen celebration (every game uses it); bonus spins keep the quick pop
      if(bigShow) BigWin.show(total, r.spent);
      if(level>=1 && !bigShow){ SFX.countUp(countMs); const wp=$("winpop"); wp.classList.toggle("big",level===2); $("winlabel").textContent= level===2?"BIG WIN": r.inBonus ? `WIN ×${r.mult}` : "WIN";
        wp.classList.add("show"); animateNumber($("winbig"),0,total,countMs); setTimeout(()=>wp.classList.remove("show"), level===2?2600:1500); }
      if(level===2){ if(!bigShow) Sound.bigWin(); setTimeout(signature, 400); $("app").classList.add("shake"); setTimeout(()=>$("app").classList.remove("shake"),1000);
        setFace(resultFace("big", r.mood),{hold:2800,line:sayRand("big")}); pause=2800; if(autoOn && !r.inBonus) setAuto(false); }
      else if(partial){ SFX.plink(); setFace(resultFace("crumbs", r.mood),{hold:1100,line:sayRand(missed?"nearMiss":"crumbs")}); pause=900; }
      else { Sound.win(level); setTimeout(signature, 350); setFace(r.inBonus?"drool":resultFace("win", r.mood),{hold:1600,line:sayRand(missed?"nearMiss":r.inBonus?"bonusSpin":level?"medium":"small")}); pause = level ? 1700 : 1100; }
    } else if(!r.triggered && !r.inBonus){
      showIdleLines(); Sound.lose();
      if(credits < LINE_COST){ setFace("sad",{line:sayRand("broke")}); setAuto(false); }
      else if(missed) setFace(resultFace("near", r.mood),{hold:1400,line:sayRand("nearMiss")});
      else if(coolLeft>0) setFace(resultFace("smug", r.mood),{hold:1400,line:sayRand("smug")});
      else if(lossStreak>=1.6) setFace(resultFace("streak", r.mood),{hold:1400,line:sayRand("streak")});
      else setFace(resultFace("lose", r.mood),{hold:1200,line:sayRand("lose")});
    } else if(r.inBonus && !r.added) showIdleLines();
    if(called){   // the bluff call pays off — or costs two spins if the tease was real
      if(r.triggered){ const cut=Math.min(2, r.triggered-4); r.triggered-=cut; bonusLeft-=cut; stamp("REAL!","#7dff3a"); setFace("angry",{hold:1800,line:pickLine("bluffRude")}); }
      else { const hush=Math.max(1, Math.round(r.spent/2)); credits+=hush; setTimeout(()=>setCredits(700),300); coinBurst(10); stamp("BLUFF!","#b490ff"); Sound.win(0); setFace("sly",{hold:1700,line:pickLine("bluffWin")}); }
      pause=Math.max(pause,1900); }
    if(r.added){ setFace("drool",{line:sayRand("jug")}); $("bonuscount").textContent=`${bonusPlayed}/${bonusPlayed+bonusLeft}`; $("bbleft").textContent=bonusLeft; bump($("bbleft")); pause=Math.max(pause,1600); }
    if(r.inBonus && total>0){ const el=$("bbtotal"), from=bonusTotal-total; setTimeout(()=>{ animateNumber(el, from, bonusTotal, 900); bump(el); }, 700); }

    if(r.triggered){
      setAuto(false); bonusMode=true; update(); Music.stop();
      setFace("drool",{line:sayRand("goop")});
      if(MACH.intro==="vip"){ await wait(900); await introVIP(r.triggered); autoTimer=setTimeout(spin, 300); return; }
      if(MACH.intro==="heist"){ await wait(900); await introHeist(r.triggered); autoTimer=setTimeout(spin, 300); return; }
      SFX.bonusStart();
      await wait(1300);
      await goopWipe(()=>setBonusVisuals(true));
      await overlay(`<div class="bowlart s-bowl"></div><h2>${MACH.bonus.a}<span>${MACH.bonus.b}</span></h2><p><b>${r.triggered} free spins</b> at ${cost()} a spin · every win ×${BONUS.mult} · pays at least ${cost()*BONUS.floor}</p><small>${MACH.bonus.tapIn}</small>`, 3200);
      autoTimer=setTimeout(spin, 300); return;
    }
    if(r.inBonus){
      if(!r.bonusEnded){ autoTimer=setTimeout(spin, Math.max(900, pause)); return; }
      await new Promise(res=>setTimeout(res, Math.max(900,pause)));
      SFX.bonusEnd(); Music.stop();
      setFace(bonusTotal>0?"happy":"meh",{hold:2500,line:sayRand("bonusEnd")});
      if(!(bonusTotal >= cost()*10 && await BigWin.show(bonusTotal, cost(), `${MACH.bonus.a}${MACH.bonus.b} total`)))
      await overlay(`<div class="bowlart s-bowl"></div><h2>${MACH.bonus.a}<span>${MACH.bonus.b}</span> DONE</h2><p>${bonusPlayed} ${MACH.bonus.endLine}</p><div class="big">+${bonusTotal}</div>${r.topUp?`<p>Topped up to the guaranteed ${BONUS.floor}× minimum</p>`:""}<small>Tap to keep playing</small>`, 3200);
      await goopWipe(()=>{ setBonusVisuals(false); bonusMode=false; update(); showIdleLines(); });
      setMood("giddy", 10); applyMoodUI(false); setTimeout(()=>{ setFace(restingFace(),{line:pickLine("afterBonus")}); pingChip(); }, 500);
      if(bonusTotal>0){ coinBurst(Math.min(90, 20+Math.round(bonusTotal/4))); }
      update(); return;
    }
    if(r.moodEvent){ const ev=r.moodEvent; setTimeout(()=>handleMoodEvent(ev), pause); pause += ev.changed ? 1700 : 700; }
    else if(total===0 && Math.random()<.12) setTimeout(()=>{ if(!spinning) setFace(restingFace(),{line:moodSay("chat")}); }, pause);
    if(r.above && !r.triggered && !reduce) openNudge(r);   // giddy: one free nudge, until the next spin
    if(!r.moodEvent && !r.inBonus) moodReminder();
    paintMoodDebug();
    if(autoOn) autoTimer=setTimeout(()=>{ if(autoOn) spin(); }, pause + (missed?600:0));
  });
}

// ---- Wiring ----
function openSheet(v){ $("sheet").classList.toggle("open",v); $("infobtn").setAttribute("aria-expanded",String(v)); Sound.tap(); }
function pickTab(which){ for(const [tab,panel] of [["tabpay","pay"],["tabmach","mach"],["tabdbg","dbg"]]){ const on=panel===which; $(tab).setAttribute("aria-selected",String(on)); $(panel).hidden=!on; }
  if(which==="mach") buildMachineList(); Sound.tap(); }
$("spin").addEventListener("click",()=>{ if(autoOn) setAuto(false); spin(); });
$("auto").addEventListener("click",()=>{ Sound.tap(); setAuto(!autoOn); });
function paintFast(){ $("fast").setAttribute("aria-pressed",String(fastOn)); }
$("fast").addEventListener("click",()=>{ Sound.tap(); fastOn=!fastOn; paintFast(); try{ localStorage.setItem("slot-fast", fastOn?"1":"0"); }catch(e){} });
$("infobtn").addEventListener("click",()=>openSheet(!$("sheet").classList.contains("open")));
$("closesheet").addEventListener("click",()=>openSheet(false));
$("tabpay").addEventListener("click",()=>pickTab("pay"));
$("tabmach").addEventListener("click",()=>pickTab("mach"));
$("tabdbg").addEventListener("click",()=>pickTab("dbg"));
function paintForce(){ $("forcebonus").setAttribute("aria-pressed",String(FORCE.bonus)); $("forcebonus").textContent = FORCE.bonus ? "Bonus armed: spin!" : "Force bonus on next spin";
  $("forcebig").setAttribute("aria-pressed",String(FORCE.big)); $("forcebig").textContent = FORCE.big ? "Big win armed: spin!" : "Force big win on next spin"; }
$("forcebonus").addEventListener("click",()=>{ FORCE.bonus=!FORCE.bonus; FORCE.big=false; paintForce(); Sound.tap(); if(FORCE.bonus) setTimeout(()=>openSheet(false),350); });
$("forcebig").addEventListener("click",()=>{ FORCE.big=!FORCE.big; FORCE.bonus=false; paintForce(); Sound.tap(); if(FORCE.big) setTimeout(()=>openSheet(false),350); });
function paintSound(){ $("sndbtn").setAttribute("aria-pressed",String(Sound.on)); $("musbtn").setAttribute("aria-pressed",String(Sound.musicOn)); }
$("musbtn").addEventListener("click",()=>{ Sound.musicOn=!Sound.musicOn; paintSound(); Sound.tap(); });
$("sndbtn").addEventListener("click",()=>{ Sound.on=!Sound.on; paintSound(); Sound.tap(); });
$("refill").addEventListener("click",()=>{ Sound.refill(); credits=START; lossStreak=0; coolLeft=0; setCredits(800); update(); showIdleLines(); setFace("happy",{hold:1500,line:sayRand("refill")}); });
$("facebox").addEventListener("click",()=>{ poke(); faceTap(); });
document.addEventListener("pointerdown",()=>{ Sound.unlock(); if(!Music.kind && !bonusMode) Music.play("base"); poke(); });
document.addEventListener("keydown",e=>{ if(e.code==="Space" && e.target.tagName!=="BUTTON"){ e.preventDefault(); spin(); } });
let pendingFit=false;
new ResizeObserver(()=>{ if(spinning){ pendingFit=true; return; } fit(); }).observe($("app"));
let bulbT=null; const reBulb=new ResizeObserver(()=>{ if(!bonusVisual) return; clearTimeout(bulbT); bulbT=setTimeout(layoutBulbs,60); });
reBulb.observe($("glass")); reBulb.observe($("facebox")); addEventListener("resize", ()=>{ sizeFx(); sizeBub(); });

setCredits();   // show the wallet balance it opened with
let startMachine="food"; try{ startMachine=localStorage.getItem("slot-machine")||"food"; }catch(e){}
applyMachine(startMachine);
buildRails(); buildPicker(); buildPaytable(); fit(); sizeFx(); sizeBub(); Promise.all([iconsReady, document.fonts ? document.fonts.ready : 0]).then(()=>{ sprCell=0; sizeReelCanvas(); fitTitle(); setTimeout(layoutGoop, 1200); });   // goop flipbook is prepared early, while nothing's happening
render(); update(); showIdleLines(); paintSound(); paintFast();
// opened from a robot in the casino: start in that robot's mood (the lobby leaves it in window.__alienLaunch)
try{ const L=window.parent!==window && window.parent.__alienLaunch; if(L && L.mood && MOOD_LIST.includes(L.mood)) setMood(L.mood);
  // each machine is its own slot in the casino: open on that one and hide the switcher
  if(L && L.machine && MACHINES[L.machine]){ applyMachine(L.machine); fitTitle(); $("tabmach").hidden=true; } }catch(e){}
MOOD_LIST.forEach(m=>{ const b=document.createElement("button"); b.className="mbtn"; b.dataset.m=m; b.textContent="Mood: "+m; b.onclick=()=>{ if(spinning||bonusMode) return; setMood(m); applyMoodUI(true); }; $("dbgmoods").appendChild(b); });
applyMoodUI(false);
Refill.start(LINE_COST, ()=>spinning||bonusMode);
setFace(restingFace(),{line:sayRand("hello")}); blinkLoop(); lookLoop(); poke();
</script>
