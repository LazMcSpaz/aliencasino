<title>Alien Patron 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Monoton&family=Chakra+Petch:wght@500;700&display=swap">
<style>
:root{--bg:#0b0718;--bg2:#1e1240;--ink:#efe8ff;--dim:#9a8fc0;--rule:#ffffff1f;--gold:#ffc845;--pink:#ff5fae;color-scheme:dark}

#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ui{position:fixed;left:0;right:0;bottom:0;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:10px;justify-items:center;pointer-events:none;background:linear-gradient(transparent,#0b0718e6 40%)}

.lab{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);width:100%;text-align:center}
button{font:inherit;color:var(--ink);background:#ffffff0d;border:1px solid var(--rule);padding:7px 12px;border-radius:8px;cursor:pointer;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}

.mood button[aria-pressed=true]{background:color-mix(in srgb,var(--pink) 22%,transparent);border-color:var(--pink)}
header{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;padding:14px max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:space-between;align-items:baseline;pointer-events:none}
h1{margin:0;font-size:18px;font-weight:700;letter-spacing:.06em}h1 b{color:var(--gold)}
.note{margin:0;color:var(--dim);font-size:12px;text-align:center;min-height:1.2em;pointer-events:none}

</style>
<canvas id="c"></canvas>
<header><h1>ALIEN <b>PATRON</b></h1><small>drag to orbit · pinch to zoom</small></header>
<div class="ui">
  <div class="row mood"><span class="lab">Colour</span><button data-p="purple" aria-pressed="true">Purple</button><button data-p="blue">Blue</button><button data-p="orange">Orange</button><button data-p="pale">Pale</button></div>
  <div class="row anim"><span class="lab">Animation</span><button data-a="Idle" aria-pressed="true">Idle</button><button data-a="Glide">Glide</button><button data-a="Play">Play</button><button data-a="Cheer">Cheer</button><button data-a="Stop">Hold still</button></div>
  <p class="note" id="note"></p>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
// The tentacled alien patron, built from the character sheet: narrow waist and broad shoulders with a cream chest, a wide head with big dark eyes,
// a crest of fat head lobes, two thick tentacle arms, and a gown of leg tentacles that hang from the hips and coil on the floor. Harness and belt with cyan lights.
// Every tentacle is one smooth skinned tube with a chain of bones inside it, so it bends without visible joints.
// Units are metres; it faces +Z; origin on the floor under it. About 2.1 m tall with the crest.
// Node names (for animation): Alien, Body (bobs), Torso (leans), Head, ArmL_0…, ArmR_0…, Hair<k>_<j>, Leg<k>_<j>.
// Clips: Idle, Glide (moving across the floor), Play (right arm reaches out and taps a button), Cheer.
function buildAlien(THREE, opts = {}) {
  const PAL = { purple: { base: "#8d3fbd", dark: "#4f2388", cream: "#e2b98a", line: "#b98a6a", crest: "#e455c8", crestDark: "#9a3fc4", spotA: "#ff5fb8", spotB: "#ffb43a", spotC: "#c6e63a", sucker: "#e58fc8" },
    blue:   { base: "#2f7fd0", dark: "#1d4a96", cream: "#b4dcea", line: "#6fa0c0", crest: "#3fb0e8", crestDark: "#2a5fc0", spotA: "#6fe0ff", spotB: "#ffb23a", spotC: "#ffd870", sucker: "#8fd0ee" },
    orange: { base: "#e8642a", dark: "#b03a3a", cream: "#ffcf80", line: "#d08a40", crest: "#ff7a4a", crestDark: "#d0406a", spotA: "#ffb03a", spotB: "#ffe36a", spotC: "#ff5fae", sucker: "#ffb0a0" },
    pale:   { base: "#9aa8c8", dark: "#6a6fa8", cream: "#e4e8e2", line: "#a8a8b8", crest: "#b8c8e0", crestDark: "#8a8fc8", spotA: "#b48cff", spotB: "#8fe0c8", spotC: "#d8c8ff", sucker: "#c8b8e8" } };
  const P = PAL[opts.palette] || PAL.purple;
  let seed = opts.seed || 7; const rnd = () => ((seed = (seed * 9301 + 49297) % 233280) / 233280);
  const ctex = c => { const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4; t.wrapS = THREE.RepeatWrapping; return t; };
  const skin = map => new THREE.MeshStandardMaterial({ map, roughness: .32, metalness: .05 });

  // ---- skin textures. u runs round the limb (0.5 = its underside), v along it (0 = root, 1 = tip) ----
  // blotches: a soft pink patch with a bright orange / yellow / lime centre, like the sheet
  function spots(g, W, H, n, avoid, big = 1) { for (let i = 0; i < n; i++) { const x = rnd() * W, y = rnd() * H; if (avoid && avoid(x / W, y / H)) continue; const rx = (10 + rnd() * 16) * big, ry = rx * (1.4 + rnd() * 1.3), col = [P.spotA, P.spotB, P.spotB, P.spotC][Math.floor(rnd() * 4)];
      for (const dx of [-W, 0, W]) { g.fillStyle = P.spotA; g.globalAlpha = .7; g.beginPath(); g.ellipse(x + dx, y, rx * 1.5, ry * 1.35, 0, 0, 7); g.fill(); g.globalAlpha = 1; g.fillStyle = col; g.beginPath(); g.ellipse(x + dx, y, rx * .8, ry * .8, 0, 0, 7); g.fill(); } } }
  function limbTex(suckers, wide) { const c = document.createElement("canvas"); c.width = 256; c.height = 512; const g = c.getContext("2d"), e = wide ? .1 : 0;
    const gr = g.createLinearGradient(0, 0, 256, 0); gr.addColorStop(0, P.dark); gr.addColorStop(.16, P.base); gr.addColorStop(.3 - e, P.base); gr.addColorStop(.37 - e, P.cream); gr.addColorStop(.63 + e, P.cream); gr.addColorStop(.7 + e, P.base); gr.addColorStop(.84, P.base); gr.addColorStop(1, P.dark);
    g.fillStyle = gr; g.fillRect(0, 0, 256, 512);
    spots(g, 256, 512, wide ? 22 : 24, (u) => u > .3 - e && u < .7 + e, wide ? 1.15 : 1);
    if (wide) for (let i = 0; i < 9; i++) { g.fillStyle = P.base; g.globalAlpha = .8; g.beginPath(); g.ellipse(80 + rnd() * 96, rnd() * 512, 5 + rnd() * 7, 10 + rnd() * 16, 0, 0, 7); g.fill(); g.globalAlpha = 1; }   // a few purple flecks on the cream
    if (suckers) for (let i = 0; i < 17; i++) { const y = 120 + i * 23, r = 13 - i * .4; for (const x of [106, 150]) { g.strokeStyle = P.sucker; g.lineWidth = 6; g.beginPath(); g.arc(x + (i % 2 ? 4 : -4), y, r, 0, 7); g.stroke(); g.fillStyle = P.spotB; g.globalAlpha = .55; g.beginPath(); g.arc(x + (i % 2 ? 4 : -4), y, r - 4, 0, 7); g.fill(); g.globalAlpha = 1; } }
    return ctex(c); }
  function crestTex() { const c = document.createElement("canvas"); c.width = 256; c.height = 512; const g = c.getContext("2d");
    const gr = g.createLinearGradient(0, 0, 0, 512); gr.addColorStop(0, P.spotA); gr.addColorStop(.45, P.crest); gr.addColorStop(1, P.crestDark); g.fillStyle = gr; g.fillRect(0, 0, 256, 512);
    const un = g.createLinearGradient(0, 0, 256, 0); un.addColorStop(.28, "rgba(0,0,0,0)"); un.addColorStop(.5, P.crestDark); un.addColorStop(.72, "rgba(0,0,0,0)"); g.globalAlpha = .75; g.fillStyle = un; g.fillRect(0, 0, 256, 512); g.globalAlpha = 1;
    for (let i = 0; i < 8; i++) { const x = (i % 2 ? 20 : 200) + rnd() * 40, y = 40 + i * 40 + rnd() * 20, rx = 15 + rnd() * 10, ry = rx * (2.2 + rnd()); for (const dx of [-256, 0, 256]) { g.fillStyle = [P.spotC, P.spotB, P.spotC][i % 3]; g.beginPath(); g.ellipse(x + dx, y, rx, ry, 0, 0, 7); g.fill(); } }
    return ctex(c); }
  // a cream patch down the front (the lathe's seam, u = 0 and 1). `sh` = [[v, half-width in px], …] from bottom to top
  function creamFront(g, W, H, sh) { g.save(); g.fillStyle = P.cream; g.shadowColor = P.cream; g.shadowBlur = 10;
    for (const x0 of [0, W]) { g.beginPath(); sh.forEach(([v, w], i) => g[i ? "lineTo" : "moveTo"](x0 + w, (1 - v) * H)); [...sh].reverse().forEach(([v, w]) => g.lineTo(x0 - w, (1 - v) * H)); g.closePath(); g.fill(); g.fill(); } g.restore(); }
  const TY0 = -.08, TY1 = .8, tv = y => (y - TY0) / (TY1 - TY0);     // torso: height → v
  function bodyTex() { const c = document.createElement("canvas"); c.width = 512; c.height = 512; const g = c.getContext("2d");
    g.fillStyle = P.base; g.fillRect(0, 0, 512, 512); const sh = g.createLinearGradient(0, 0, 512, 0); sh.addColorStop(.3, "rgba(0,0,0,0)"); sh.addColorStop(.5, P.dark); sh.addColorStop(.7, "rgba(0,0,0,0)"); g.globalAlpha = .6; g.fillStyle = sh; g.fillRect(0, 0, 512, 512); g.globalAlpha = 1;
    spots(g, 512, 512, 34, (u, y) => (u < .16 || u > .84), 1.1);
    // cream only down the middle: narrow belly, wider chest, up the throat
    creamFront(g, 512, 512, [[tv(-.08), 16], [tv(.02), 30], [tv(.2), 40], [tv(.3), 44], [tv(.42), 60], [tv(.52), 72], [tv(.6), 60], [tv(.66), 40], [tv(.72), 46], [tv(.8), 70]]);
    // muscle lines
    g.strokeStyle = P.line; g.lineCap = "round"; const Y = y => (1 - tv(y)) * 512;
    for (const x0 of [0, 512]) { g.lineWidth = 3; g.beginPath(); g.moveTo(x0, Y(.1)); g.lineTo(x0, Y(.5)); g.stroke();
      for (const s of [-1, 1]) { g.lineWidth = 4; g.beginPath(); g.moveTo(x0 + s * 4, Y(.46)); g.quadraticCurveTo(x0 + s * 34, Y(.42), x0 + s * 62, Y(.5)); g.stroke();      // under the pecs
        g.lineWidth = 2.5; for (const y of [.18, .26, .34]) { g.beginPath(); g.moveTo(x0 + s * 5, Y(y)); g.quadraticCurveTo(x0 + s * 16, Y(y - .012), x0 + s * 27, Y(y + .006)); g.stroke(); }   // abs
        g.beginPath(); g.moveTo(x0 + s * 30, Y(.38)); g.quadraticCurveTo(x0 + s * 36, Y(.26), x0 + s * 30, Y(.14)); g.stroke();
        g.beginPath(); g.moveTo(x0 + s * 8, Y(.64)); g.quadraticCurveTo(x0 + s * 30, Y(.61), x0 + s * 52, Y(.63)); g.stroke(); } }   // collar bones
    return ctex(c); }
  const HY0 = -.02, HY1 = .41, hv = y => (y - HY0) / (HY1 - HY0);     // head: height → v
  function headTex() { const c = document.createElement("canvas"); c.width = 512; c.height = 512; const g = c.getContext("2d");
    const gr = g.createLinearGradient(0, 0, 0, 512); gr.addColorStop(0, P.crest); gr.addColorStop(.45, P.crest); gr.addColorStop(1, P.base); g.fillStyle = gr; g.fillRect(0, 0, 512, 512);
    // the face: cream chin and cheeks, narrowing to a point up the forehead
    creamFront(g, 512, 512, [[hv(-.02), 130], [hv(.08), 122], [hv(.16), 104], [hv(.23), 84], [hv(.29), 52], [hv(.34), 26], [hv(.385), 8], [hv(.4), 0]]);
    return ctex(c); }
  const M = { limb: skin(limbTex(true, false)), leg: skin(limbTex(false, false)), crest: skin(crestTex()), body: skin(bodyTex()), head: skin(headTex()),
    plain: new THREE.MeshStandardMaterial({ color: new THREE.Color(P.base).convertSRGBToLinear(), roughness: .32, metalness: .05 }),
    eye: new THREE.MeshStandardMaterial({ color: 0x0a0612, roughness: .05, metalness: .3 }), glint: new THREE.MeshBasicMaterial({ color: 0xffffff }),
    strap: new THREE.MeshStandardMaterial({ color: 0x2c2b34, roughness: .5, metalness: .5, flatShading: true }), gold: new THREE.MeshStandardMaterial({ color: 0xd9a84a, roughness: .35, metalness: .8, flatShading: true }),
    teal: new THREE.MeshStandardMaterial({ color: 0x3fa8a0, roughness: .35, metalness: .6, flatShading: true }),
    light: new THREE.MeshStandardMaterial({ color: 0x000000, emissive: 0x5fe8ff, emissiveIntensity: 1.8 }), core: new THREE.MeshStandardMaterial({ color: new THREE.Color(P.dark).multiplyScalar(.45), roughness: .6 }) };

  // ---- a tentacle: a tapered tube skinned to a chain of bones. Returns the mesh (place it like any object) and its bones. ----
  // `bend` gives each bone's resting rotation [x, z, y] in radians; animation adds to it.
  const rest = {};   // bone name → resting Euler, so the clips can animate around the pose
  function tentacle(name, { len, r0, r1, bones: nb, mat, bend, radial = 10, squash = 1, under = 1, taper = .85, twist = 0 }) {   // under: +1 → the cream underside faces the limb's +Z, −1 → its −Z; twist turns the skin round the limb
    const seg = len / nb, rows = nb * 4, pts = [];
    for (let i = 0; i <= rows; i++) { const v = i / rows, r = r0 + (r1 - r0) * Math.pow(v, taper); pts.push(new THREE.Vector2(Math.max(.0001, r), v * len)); }
    for (let i = 1; i <= 4; i++) { const a = i / 4 * Math.PI / 2; pts.push(new THREE.Vector2(Math.max(.0001, r1 * Math.cos(a)), len + r1 * Math.sin(a) * 1.2)); }   // rounded tip
    const geo = new THREE.LatheGeometry(pts, radial); geo.rotateY((under > 0 ? Math.PI : 0) + twist);        // a lathe's seam (u = 0) starts on +Z, so u = 0.5 (the underside) is on −Z until turned
    if (squash !== 1) geo.scale(1, 1, squash);
    const pos = geo.attributes.position, si = [], sw = [], uv = geo.attributes.uv;
    for (let i = 0; i < pos.count; i++) { const y = Math.min(len - 1e-4, Math.max(0, pos.getY(i))), f = y / seg, b = Math.min(nb - 1, Math.floor(f)), t = f - b;
      // each ring follows its own bone, easing into the next one near the joint, so bends are round
      const w = t > .5 && b < nb - 1 ? (t - .5) : 0; si.push(b, Math.min(nb - 1, b + 1), 0, 0); sw.push(1 - w, w, 0, 0); uv.setY(i, Math.min(1, pos.getY(i) / len)); }
    geo.setAttribute("skinIndex", new THREE.Uint16BufferAttribute(si, 4)); geo.setAttribute("skinWeight", new THREE.Float32BufferAttribute(sw, 4)); geo.computeVertexNormals();
    const bones = []; for (let j = 0; j < nb; j++) { const b = new THREE.Bone(); b.name = `${name}_${j}`; b.position.y = j ? seg : 0; if (j) bones[j - 1].add(b); bones.push(b); }
    const mesh = new THREE.SkinnedMesh(geo, mat); mesh.name = name; mesh.add(bones[0]); mesh.bind(new THREE.Skeleton(bones)); mesh.castShadow = true; mesh.receiveShadow = true; mesh.frustumCulled = false;
    bones.forEach((b, j) => { const [x, z, y = 0] = bend(j, nb); b.rotation.set(x, y, z); rest[b.name] = [x, y, z]; });
    return { mesh, bones, seg }; }
  const add = (parent, geo, mat, name, p = [0, 0, 0], r = [0, 0, 0], s = [1, 1, 1]) => { const m = new THREE.Mesh(geo, mat); m.name = name; m.position.set(...p); m.rotation.set(...r); m.scale.set(...s); m.castShadow = true; m.receiveShadow = true; parent.add(m); return m; };
  const grp = (parent, name, p = [0, 0, 0]) => { const g = new THREE.Group(); g.name = name; g.position.set(...p); parent.add(g); return g; };
  // a smooth lathe outline from a few [radius, height] points, evenly spaced in height so the texture's v follows height
  const outline = (pts, n = 48) => { const d = new THREE.SplineCurve(pts.map(([x, y]) => new THREE.Vector2(x, y))).getPoints(200), y0 = pts[0][1], y1 = pts[pts.length - 1][1], out = []; let k = 0;
    for (let i = 0; i <= n; i++) { const y = y0 + (y1 - y0) * i / n; while (k < d.length - 2 && d[k + 1].y < y) k++; const a = d[k], b = d[k + 1], t = Math.max(0, Math.min(1, (y - a.y) / ((b.y - a.y) || 1))); out.push(new THREE.Vector2(Math.max(.001, a.x + (b.x - a.x) * t), y)); } return out; };

  const SCALE = .8;                                                 // built a little large, then shrunk to about 2.1 m
  const root = new THREE.Group(); root.name = "Alien"; root.scale.setScalar(SCALE);
  const body = grp(root, "Body");                                   // everything; bobs as it glides

  // ---- the gown of leg tentacles: thick, they hang almost straight from the hips, sweep out onto the floor and coil there ----
  const LEG_BONES = 14, FLOOR0 = 8, LEG_LEN = 2.9, SEG = LEG_LEN / LEG_BONES, legs = [];
  // one leg's resting bends. Bones 0–3 hang, 4–7 turn it level with the floor, 8+ lie on the floor and spiral (sp = which way, tight = how much)
  function legPose(T, sp, tight, tipUp) { const x = [0, -.16, -.02, .12], z = new Array(LEG_BONES).fill(0), turn = -(Math.PI / 2 - T) + .06;
    [.15, .3, .35, .2].forEach(w => x.push(turn * w)); z[6] = -sp * .22; z[7] = -sp * .3; const wv = (rnd() - .5) * 1.6; z[1] = .16 * wv; z[2] = -.1 * wv; z[3] = -.2 * wv; z[4] = .12 * wv;   // a lazy S in the hanging part
    for (let j = FLOOR0; j < LEG_BONES; j++) { const f = j - FLOOR0; x.push(tipUp && j >= LEG_BONES - 3 ? -.5 : .012); z[j] = sp * [.6, .7, .78, .85, .9, .95][f] * Math.min(1, tight); }
    let a = Math.PI - T, drop = 0; for (let j = 0; j < FLOOR0; j++) { a += x[j]; drop -= Math.cos(a) * SEG; }   // how far below its root it reaches
    return { x, z, drop }; }
  const ring = [];   // [angle round the body, tilt out from the hips, distance of the root from the centre]
  for (let k = 0; k < 9; k++) ring.push([(k + .5) / 9 * Math.PI * 2, .42 + rnd() * .12, .06]);
  for (let k = 0; k < 5; k++) ring.push([(k + .2) / 5 * Math.PI * 2, .04 + rnd() * .05, .02]);
  const poses = ring.map(([a, T], k) => legPose(T, k % 2 ? 1 : -1, .75 + rnd() * .45, k < 9 && k % 3 === 0));
  const HIP = poses[0].drop + .08;
  const skirt = grp(body, "Skirt", [0, HIP, 0]);
  ring.forEach(([a, T, rad], k) => { const p = poses[k];
    const t = tentacle("Leg" + k, { len: LEG_LEN, r0: k < 9 ? .135 : .12, r1: .07, bones: LEG_BONES, mat: M.leg, radial: 12, under: -1, taper: 1.6, twist: rnd() * Math.PI * 2, bend: (j) => [p.x[j], p.z[j]] });
    t.mesh.rotation.order = "YXZ"; t.mesh.rotation.set(Math.PI - T, a, 0); t.mesh.position.set(Math.sin(a) * rad, p.drop - poses[0].drop, Math.cos(a) * rad); skirt.add(t.mesh); legs.push({ ...t, a, k }); });
  add(skirt, new THREE.LatheGeometry([[.02, -HIP + .02], [.2, -HIP + .02], [.16, -HIP * .5], [.1, -.05]].map(([x, y]) => new THREE.Vector2(x, y)), 14), M.core, "SkirtCore").castShadow = false;

  // ---- torso: narrow waist, broad shoulders, cream chest ----
  const torso = grp(body, "Torso", [0, HIP, 0]);                    // leans from the hips
  add(torso, new THREE.LatheGeometry(outline([[.03, TY0], [.16, -.05], [.18, .02], [.155, .12], [.112, .26], [.108, .32], [.14, .44], [.19, .54], [.2, .6], [.15, .665], [.065, .705], [.05, .75], [.05, TY1]]), 32), M.body, "TorsoSkin", [0, 0, 0], [0, 0, 0], [1, 1, .64]);
  // belt: a wide band low on the hips, with its cyan light
  const belt = grp(torso, "Belt", [0, .03, 0]); belt.rotation.x = .06;
  add(belt, new THREE.TorusGeometry(.185, .034, 6, 30), M.strap, "BeltBand", [0, 0, 0], [Math.PI / 2, 0, 0], [1, .74, 1.5]);
  for (const dy of [-.05, .05]) add(belt, new THREE.TorusGeometry(.19, .011, 5, 30), M.gold, "BeltTrim", [0, dy, 0], [Math.PI / 2, 0, 0], [1, .74, 1]);
  add(belt, new THREE.BoxGeometry(.15, .13, .04), M.gold, "BuckleFrame", [0, 0, .14]); add(belt, new THREE.BoxGeometry(.125, .105, .05), M.strap, "Buckle", [0, 0, .145]);
  add(belt, new THREE.BoxGeometry(.075, .04, .02), M.light, "BeltLight", [0, 0, .166]).castShadow = false;
  for (const sx of [-1, 1]) add(belt, new THREE.BoxGeometry(.035, .12, .05), M.gold, "BeltClasp", [sx * .15, 0, .078], [0, sx * .9, 0]);
  // harness: a wide strap looping over each shoulder and under the arm, gold-edged, with a teal plate on top and a buckle on the chest
  for (const sx of [-1, 1]) { const h = grp(torso, "Harness" + (sx < 0 ? "R" : "L"), [sx * .15, .555, 0]); h.rotation.z = sx * .3;
    add(h, new THREE.TorusGeometry(.125, .02, 6, 26), M.strap, "Strap", [0, 0, 0], [0, Math.PI / 2, 0], [1, 1, 2.6]);
    for (const dx of [-.052, .052]) add(h, new THREE.TorusGeometry(.129, .008, 5, 26), M.gold, "StrapTrim", [dx, 0, 0], [0, Math.PI / 2, 0]);
    add(h, new THREE.BoxGeometry(.1, .022, .12), M.teal, "ShoulderPlate", [0, .14, 0]); add(h, new THREE.BoxGeometry(.115, .012, .135), M.gold, "PlateTrim", [0, .13, 0]);
    add(h, new THREE.BoxGeometry(.085, .075, .03), M.strap, "ChestBuckle", [0, -.03, .125], [.25, 0, 0]); add(h, new THREE.BoxGeometry(.045, .03, .012), M.light, "ChestLight", [0, -.03, .143], [.25, 0, 0]).castShadow = false;
    add(torso, new THREE.SphereGeometry(.088, 16, 12), M.plain, "Shoulder", [sx * .2, .575, 0], [0, 0, 0], [1, 1, .85]); }

  // ---- arms: thick tentacles from the shoulders, hanging in a soft S with the sucker side showing in a big curl at the tip ----
  const ARM_BONES = 8, arms = {};
  for (const sx of [-1, 1]) { const nm = sx < 0 ? "ArmR" : "ArmL";   // it faces +Z, so its own right arm is on −X
    const t = tentacle(nm, { len: 1.12, r0: .08, r1: .04, bones: ARM_BONES, mat: M.limb, radial: 12, taper: 1.6,
      bend: (j) => [[.0, .1, .12, .05, -.1, -.3, -.6, -.85][j], sx * [.0, -.08, -.1, -.02, .15, .35, .6, .8][j]] });
    t.mesh.rotation.set(0, Math.PI, sx * (Math.PI - .32)); t.mesh.position.set(sx * .2, .575, 0); torso.add(t.mesh); arms[nm] = t; }

  // ---- head: wide at the eyes, pointed chin, cream face, big dark eyes, and the crest ----
  const head = grp(torso, "Head", [0, .76, 0]); head.scale.setScalar(1.22);                    // pivots at the top of the neck
  add(head, new THREE.LatheGeometry(outline([[.004, HY0], [.028, 0], [.052, .045], [.088, .11], [.12, .18], [.136, .25], [.13, .31], [.105, .36], [.06, .395], [.004, HY1]]), 32), M.head, "HeadSkin", [0, 0, 0], [0, 0, 0], [1.26, 1, 1.05]);
  for (const sx of [-1, 1]) { const e = grp(head, "Eye" + (sx < 0 ? "L" : "R"), [sx * .08, .215, .104]); e.rotation.set(-.08, sx * .6, -sx * .5);
    add(e, new THREE.SphereGeometry(1, 22, 16), M.eye, "EyeBall", [0, 0, 0], [0, 0, 0], [.058, .09, .028]);
    add(e, new THREE.SphereGeometry(.011, 8, 6), M.glint, "Glint", [-sx * .014, .036, .024]).castShadow = false; add(e, new THREE.SphereGeometry(.005, 8, 6), M.glint, "Glint2", [sx * .012, -.02, .026]).castShadow = false; }
  add(head, new THREE.BoxGeometry(.034, .005, .005), M.eye, "Mouth", [0, .07, .076]).castShadow = false;
  // the crest: a few big flattened lobes that grow out of the top of the skull, sweep up and out, and hook over at the tips
  const HAIR_BONES = 7, hair = [];
  const crest = [ // [angle round the head (0 = straight back, ±π/2 = the sides, ±π = the forehead), lift (0 = level, 1 = straight up), length, thickness, tip flicks back up?]
    [0, .62, .5, .15], [-1.35, .34, .52, .145], [1.35, .34, .52, .145], [-2.2, .55, .44, .13], [2.2, .55, .44, .13],
    [-.65, .12, .46, .135], [.65, .12, .46, .135], [-1.6, .05, .36, .1, 1], [1.6, .05, .36, .1, 1], [0, -.05, .4, .12, 1] ];
  crest.forEach(([ang, lift, len, r, flick], k) => {
    const curve = flick ? [0, .25, .4, .45, .1, -.5, -.9] : [0, .1, .16, .26, .46, .72, .95], sc = .88 + rnd() * .22;
    const t = tentacle("Hair" + k, { len, r0: r, r1: r * .3, bones: HAIR_BONES, mat: M.crest, radial: 12, squash: .6, taper: 1.9, bend: (j) => [curve[j] * sc, (rnd() - .5) * .14] });
    const el = lift * Math.PI / 2, dir = new THREE.Vector3(-Math.sin(ang) * Math.cos(el), Math.sin(el), -Math.cos(ang) * Math.cos(el)).normalize();
    // local Y = the direction it grows; local Z = "downward" as seen from the lobe, so a positive bend hooks the tip over and down
    const down = new THREE.Vector3(0, -1, 0), z = down.clone().addScaledVector(dir, -down.dot(dir)).normalize(), x = new THREE.Vector3().crossVectors(dir, z).normalize();
    t.mesh.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(x, dir, z));
    const rd = new THREE.Vector3(-Math.sin(ang), 0, -Math.cos(ang)), out = .075 * (1 - lift * .5);
    t.mesh.position.set(rd.x * out * 1.1, .27 + Math.max(0, lift) * .07, rd.z * out - .01); head.add(t.mesh); hair.push({ ...t, ang }); });

  // ---- animation: each clip is a set of functions of time, sampled into keyframes around the resting pose ----
  const Q = (x, y, z) => new THREE.Quaternion().setFromEuler(new THREE.Euler(x, y, z)).toArray();
  const track = (name, D, fn, step = 1 / 20) => { const ts = [], v = []; for (let t = 0; t <= D + 1e-6; t += step) { ts.push(+t.toFixed(4)); const d = fn(t), r = rest[name] || [0, 0, 0]; v.push(...Q(r[0] + (d[0] || 0), r[1] + (d[1] || 0), r[2] + (d[2] || 0))); } return new THREE.QuaternionKeyframeTrack(name + ".quaternion", ts, v); };
  const ptrack = (name, D, fn, step = 1 / 20) => { const ts = [], v = []; for (let t = 0; t <= D + 1e-6; t += step) { ts.push(+t.toFixed(4)); v.push(...fn(t)); } return new THREE.VectorKeyframeTrack(name + ".position", ts, v); };
  const TAU = Math.PI * 2, ss = (a, b, t) => { const k = Math.max(0, Math.min(1, (t - a) / (b - a))); return k * k * (3 - 2 * k); };
  // the gown: a wave runs down every tentacle (whole cycles per loop); `amp` is how lively, `trail` leans the tips back when it's moving
  const gown = (D, cycles, amp, trail) => legs.flatMap(({ bones, a, k }) => bones.map((b, j) => track(b.name, D, t => { const w = TAU * cycles * t / D - j * .55 + k * 1.9, fl = j >= FLOOR0, f = fl ? (j - FLOOR0 + 1) / (LEG_BONES - FLOOR0) : j / FLOOR0;
    // hanging part sways a little; the part on the floor slides sideways (never lifting), and trails behind when it's moving
    return fl ? [amp * .12 * Math.sin(w + 1), 0, amp * .7 * f * Math.sin(w) + trail * Math.sin(a) * .22] : [amp * .45 * f * Math.sin(w), 0, amp * .35 * f * Math.cos(w + k)]; })));
  const crestSway = (D, cycles, amp) => hair.flatMap(({ bones }, k) => bones.map((b, j) => track(b.name, D, t => { const w = TAU * cycles * t / D - j * .6 + k * 1.3; return [amp * (j / 6) * Math.sin(w), 0, amp * .7 * (j / 6) * Math.cos(w + k)]; })));
  const armHang = (nm, D, cycles, amp, ph) => arms[nm].bones.map((b, j) => track(b.name, D, t => { const w = TAU * cycles * t / D - j * .5 + ph; return [amp * (j / 7) * Math.sin(w), 0, amp * .6 * (j / 7) * Math.cos(w)]; }));
  const clips = [];
  { const D = 4; clips.push(new THREE.AnimationClip("Idle", D, [...gown(D, 1, .07, 0), ...crestSway(D, 1, .09), ...armHang("ArmL", D, 1, .08, 0), ...armHang("ArmR", D, 1, .08, 2),
      track("Head", D, t => [.04 * Math.sin(TAU * t / D), .12 * Math.sin(TAU * t / D + 1), .03 * Math.sin(TAU * 2 * t / D)]), track("Torso", D, t => [.015 * Math.sin(TAU * t / D), 0, .02 * Math.sin(TAU * t / D + .7)]),
      ptrack("Body", D, t => [0, .012 * Math.sin(TAU * t / D), 0])])); }
  { const D = 2; clips.push(new THREE.AnimationClip("Glide", D, [...gown(D, 2, .16, -.5), ...crestSway(D, 2, .14).map((tr, i) => tr), ...armHang("ArmL", D, 1, .2, 0), ...armHang("ArmR", D, 1, .2, Math.PI),
      track("Head", D, t => [-.05 + .03 * Math.sin(TAU * 2 * t / D), .05 * Math.sin(TAU * t / D), 0]), track("Torso", D, t => [.09 + .02 * Math.sin(TAU * 2 * t / D), .05 * Math.sin(TAU * t / D), .03 * Math.sin(TAU * t / D)]),
      ptrack("Body", D, t => [0, .02 + .018 * Math.sin(TAU * 2 * t / D), 0])])); }
  { // Play: the right arm lifts, straightens forward, taps twice, and settles back; the head tips down to watch
    const D = 3.2, reach = t => ss(.2, .9, t) * (1 - ss(2.4, 3.1, t)), tap = t => (ss(1.1, 1.25, t) - ss(1.25, 1.45, t)) + (ss(1.7, 1.85, t) - ss(1.85, 2.05, t));
    const R = arms.ArmR.bones.map((b, j) => track(b.name, D, t => { const k = reach(t), r = rest[b.name];
      // unbend the resting S, swing the upper arm forward, a soft hook at the tip; the tap dips the last third
      const fwd = j === 0 ? -1.2 : j === 1 ? -.2 : 0, un = -r[0] * (j > 3 ? .6 : .9), hook = j >= 6 ? .2 : 0, dip = j >= 4 ? -.16 * tap(t) : 0;
      return [k * (fwd + un + hook) + dip * k, 0, k * (-r[2] * .75)]; }));
    clips.push(new THREE.AnimationClip("Play", D, [...gown(D, 1, .06, 0), ...crestSway(D, 1, .1), ...armHang("ArmL", D, 1, .06, 0), ...R,
      track("Head", D, t => [.22 * reach(t) + .05 * tap(t), -.1 * reach(t), 0]), track("Torso", D, t => [.1 * reach(t), -.08 * reach(t), 0]), ptrack("Body", D, t => [0, 0, 0])])); }
  { // Cheer: both arms fly up and wave, the crest flares, a little bounce
    const D = 2.4, up = t => ss(0, .4, t) * (1 - ss(1.9, 2.4, t));
    const A = nm => arms[nm].bones.map((b, j) => track(b.name, D, t => { const k = up(t), r = rest[b.name], sx = nm === "ArmR" ? -1 : 1;
      return [k * (-r[0] * .55 + (j > 2 ? .2 * Math.sin(TAU * 3 * t / D + j * .6) : 0)), 0, k * (-r[2] * .6 + (j === 0 ? -sx * 2.25 : 0) + (j > 3 ? sx * .12 * Math.cos(TAU * 3 * t / D + j) : 0))]; }));
    clips.push(new THREE.AnimationClip("Cheer", D, [...gown(D, 2, .12, 0), ...crestSway(D, 3, .22), ...A("ArmL"), ...A("ArmR"),
      track("Head", D, t => [-.18 * up(t), .1 * Math.sin(TAU * 2 * t / D) * up(t), 0]), track("Torso", D, t => [-.06 * up(t), 0, .04 * Math.sin(TAU * 3 * t / D) * up(t)]),
      ptrack("Body", D, t => [0, .05 * Math.abs(Math.sin(TAU * 3 * t / D)) * up(t), 0])])); }
  return { root, clips, height: (HIP + 1.45) * SCALE, palette: opts.palette || "purple" };
}

const TEX_SRC = {};
const cv=document.getElementById("c");
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(2,devicePixelRatio)); renderer.outputEncoding=THREE.sRGBEncoding; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.0;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene(), cam=new THREE.PerspectiveCamera(35,1,.05,50);
cam.position.set(1.6,1.7,4.2);
const ctl=new THREE.OrbitControls(cam,cv); ctl.target.set(0,1.05,0); ctl.enableDamping=true; ctl.minDistance=1.1; ctl.maxDistance=7; ctl.maxPolarAngle=Math.PI*.52; ctl.autoRotate=true; ctl.autoRotateSpeed=.8;
cv.addEventListener("pointerdown",()=>ctl.autoRotate=false);
scene.add(new THREE.HemisphereLight(0xbfb4ff,0x1a1030,.75));
const key=new THREE.DirectionalLight(0xffffff,1.6); key.position.set(2,4,3); key.castShadow=true; key.shadow.bias=-.0006; key.shadow.normalBias=.02; key.shadow.mapSize.set(1024,1024); Object.assign(key.shadow.camera,{left:-3,right:3,top:3,bottom:-2.5}); key.shadow.mapSize.set(2048,2048); scene.add(key);
const rim=new THREE.DirectionalLight(0xff5fae,1.1); rim.position.set(-2.5,2,-2.5); scene.add(rim);
const fill=new THREE.PointLight(0x7dffb0,.5,3); fill.position.set(0,1.5,1.2); scene.add(fill);
// floor: a soft glowing disc under the robot
const fc=document.createElement("canvas"); fc.width=fc.height=256; const fg=fc.getContext("2d"), rg=fg.createRadialGradient(128,128,0,128,128,128);
rg.addColorStop(0,"#3b2a7a"); rg.addColorStop(.55,"#1e1440"); rg.addColorStop(1,"rgba(11,7,24,0)"); fg.fillStyle=rg; fg.fillRect(0,0,256,256);
const ft=new THREE.CanvasTexture(fc); ft.encoding=THREE.sRGBEncoding;

const loadImg=s=>new Promise(r=>{const i=new Image(); i.onload=()=>r(i); i.onerror=()=>r(null); i.src=s;});
let bot, mixer, acts={}, cur=null, beacon=null, mode="Idle";
function build(pal){ if(bot){ scene.remove(bot.root); } acts={}; cur=null;
  bot=buildAlien(THREE,{palette:pal}); scene.add(bot.root);
  mixer=new THREE.AnimationMixer(bot.root); bot.clips.forEach(c=>acts[c.name]=mixer.clipAction(c)); play(); }
setTimeout(()=>build("purple"),0);   // after the rest of the page script has run
document.querySelectorAll(".mood button").forEach(b=>b.onclick=()=>{ document.querySelectorAll(".mood button").forEach(x=>x.setAttribute("aria-pressed",String(x===b))); build(b.dataset.p); });
const NOTES={Idle:"Standing: the gown of tentacles drifts, the crest sways, the head looks around",Glide:"Moving across the floor: a wave runs down the leg tentacles, tips trailing behind",Play:"Reaching out with one arm to tap a button, head tipped down to watch",Cheer:"A win: both arms up and waving, crest flaring",Stop:""};
function play(){ document.getElementById("note").textContent=NOTES[mode];
  if(mode==="Stop"){ if(cur) cur.fadeOut(.3); cur=null; return; }
  const a=acts[mode]; if(a===cur) return; a.reset().setEffectiveWeight(1).play(); if(cur) cur.crossFadeTo(a,.35,false); cur=a; }
function setAnim(n){ document.querySelectorAll(".anim button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.a===n))); mode=n; play(); }
document.querySelectorAll(".anim button").forEach(b=>b.onclick=()=>setAnim(b.dataset.a));
function size(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); cam.aspect=w/h; cam.fov=w<h?52:36; cam.updateProjectionMatrix(); }
addEventListener("resize",size); size();
const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{ const dt=Math.min(.05,clock.getDelta()); if(mixer) mixer.update(dt); ctl.update();
  if(bot && bot.update) bot.update(clock.elapsedTime); if(beacon) beacon.material.emissiveIntensity=1.1+.6*Math.sin(clock.elapsedTime*5); renderer.render(scene,cam); });
