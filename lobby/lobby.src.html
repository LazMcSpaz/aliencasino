<!-- Alien Casino lobby: the 3D casino floor with every game's model in it. Tap a game to walk the camera over, then PLAY to open it.
     build.py fills in the models (../model3d/*_model.js), their textures, and copies the built games into games/ next to this page. -->
<title>Alien Casino</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@500;600;700&family=Monoton&family=Share+Tech+Mono&family=Yellowtail&display=swap">
<style>
:root{--bg:#07040f;--ink:#efe8ff;--dim:#9a8fc0;--holo:#5fe8ff;--holo2:#b48cff;--gold:#ffc845;--f-sign:"Bungee",Impact,sans-serif;--f-mono:"Share Tech Mono",ui-monospace,monospace;--f-tech:"Chakra Petch",system-ui,sans-serif;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 14px var(--f-tech);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
[hidden]{display:none!important}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.holo{--k:10px;--hc:var(--holo);position:relative;border:0;color:var(--ink);clip-path:polygon(var(--k) 0,100% 0,100% calc(100% - var(--k)),calc(100% - var(--k)) 100%,0 100%,0 var(--k));
  background:linear-gradient(180deg,color-mix(in srgb,var(--hc) 18%,#060914e6),#060914e6),repeating-linear-gradient(0deg,color-mix(in srgb,var(--hc) 8%,transparent) 0 1px,transparent 1px 3px);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--hc) 50%,transparent),inset 0 0 22px color-mix(in srgb,var(--hc) 14%,transparent)}
header{position:fixed;z-index:5;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:space-between;align-items:center;pointer-events:none;
  background:linear-gradient(#07040fcc,transparent)}
.logo{position:relative;font:400 1.5rem/1 "Monoton",var(--f-sign);color:#eafcff;text-shadow:0 0 4px #fff,0 0 10px var(--holo2),0 0 24px #8a4dff}
.logo i{position:absolute;right:-30px;bottom:-14px;font:400 1.15rem "Yellowtail",cursive;font-style:normal;color:#fff0d0;transform:rotate(-8deg);text-shadow:0 0 8px #ffb070,0 0 18px #ff7a3a}
.coins{--k:7px;display:flex;align-items:center;gap:6px;padding:6px 12px;font:700 1rem var(--f-mono);pointer-events:auto}
.coins i{width:22px;height:16px;background:var(--bar) center/contain no-repeat}
.hint{position:fixed;z-index:4;left:0;right:0;top:calc(62px + env(safe-area-inset-top,0px));text-align:center;font:400 .66rem var(--f-mono);letter-spacing:.2em;color:var(--dim);pointer-events:none;transition:opacity .4s}
/* the game list along the bottom */
nav{position:fixed;z-index:5;left:0;right:0;bottom:0;padding:10px max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));
  display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;background:linear-gradient(transparent,#07040fe6 35%)}
nav::-webkit-scrollbar{display:none}
nav button{--k:7px;flex:none;padding:8px 11px;cursor:pointer;font:400 .7rem/1 var(--f-sign);letter-spacing:.04em;white-space:nowrap}
nav button[aria-pressed="true"]{--hc:var(--gold);color:#fff;text-shadow:0 0 8px var(--gold)}
/* the card for the game you're looking at */
.card{--k:14px;position:fixed;z-index:6;left:50%;bottom:calc(74px + env(safe-area-inset-bottom,0px));translate:-50% 0;width:min(92vw,360px);padding:14px 16px;display:grid;gap:8px;--hc:var(--gc,var(--holo));
  opacity:0;transform:translateY(16px);transition:opacity .25s,transform .3s cubic-bezier(.3,1.4,.5,1);pointer-events:none}
.card.show{opacity:1;transform:none;pointer-events:auto}
.card h2{margin:0;font:400 1.3rem/1 var(--f-sign);color:var(--gc);text-shadow:0 0 12px var(--gc)}
.card p{margin:0;font:500 .86rem/1.4 var(--f-tech);color:#dde}
.card .kind{font:400 .58rem var(--f-mono);letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
.card .btns{display:grid;grid-template-columns:auto 1fr;gap:8px;margin-top:4px}
.card button{--k:8px;cursor:pointer;padding:12px 14px;font:400 .9rem/1 var(--f-sign);letter-spacing:.06em}
.card .play{--hc:var(--gold);color:#fff;text-shadow:0 0 10px var(--gold);animation:pulse 1.2s ease-in-out infinite alternate}
@keyframes pulse{to{box-shadow:inset 0 0 0 1px var(--gold),inset 0 0 30px #ffc84555,0 0 16px #ffc84566}}
/* a game, open over the casino */
.game{position:fixed;inset:0;z-index:20;background:#000;display:grid;grid-template-rows:auto 1fr}
.game .bar{display:flex;align-items:center;gap:10px;padding:calc(6px + env(safe-area-inset-top,0px)) 12px 6px;background:#07040f;border-bottom:1px solid #5fe8ff33}
.game .bar button{--k:6px;cursor:pointer;padding:7px 12px;font:400 .66rem var(--f-mono);letter-spacing:.14em;color:var(--holo)}
.game .bar b{font:400 .8rem var(--f-sign);color:var(--gc,var(--holo));text-shadow:0 0 8px var(--gc,var(--holo))}
.game iframe{width:100%;height:100%;border:0;background:#000}
.loading{position:fixed;inset:0;z-index:30;display:grid;place-content:center;gap:10px;text-align:center;background:var(--bg);font:400 .7rem var(--f-mono);letter-spacing:.24em;color:var(--dim);transition:opacity .5s}
.loading b{font:400 1.8rem/1 "Monoton",var(--f-sign);color:#eafcff;text-shadow:0 0 10px var(--holo2),0 0 24px #8a4dff;letter-spacing:0}
.loading.done{opacity:0;pointer-events:none}
</style>
<canvas id="c" aria-label="The Alien Casino floor"></canvas>
<header><div class="logo">ALIEN<i>Casino</i></div><div class="coins holo"><i></i><span id="bars">500</span></div></header>
<p class="hint" id="hint">TAP A GAME &middot; DRAG TO LOOK AROUND</p>
<nav id="nav" aria-label="Games"></nav>
<div class="card holo" id="card" role="dialog" aria-live="polite"><span class="kind" id="cKind"></span><h2 id="cName"></h2><p id="cDesc"></p>
  <div class="btns"><button class="holo" id="cBack">BACK</button><button class="holo play" id="cPlay">PLAY</button></div></div>
<div class="game" id="game" hidden><div class="bar"><button class="holo" id="gBack">&larr; CASINO</button><b id="gName"></b></div><iframe id="frame" title="Game" allow="autoplay"></iframe></div>
<div class="loading" id="loading"><b>ALIEN CASINO</b><span id="lmsg">BOARDING…</span></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
const ART = /*{{ART}}*/;
/*{{MODELS}}*/
const TEX_SRC = /*{{TEX}}*/;
document.documentElement.style.setProperty("--bar", `url(${ART.bar})`);
const $=id=>document.getElementById(id);

// ---- the games on the floor: where each model stands, and what it opens ----
const GAMES = [
  { id:"slot",    name:"The Living Slot",  kind:"Slot machine with moods", col:"#ff9a4a", src:"games/slot.html",     pos:[-2.7,0,3.4],  rot:.22, va:.22,  scale:1,   clip:"Idle_Happy",
    desc:"The walking slot robot. Its mood changes the spins. Three themed machines inside." },
  { id:"pyramid", name:"Pyramid Scheme",   kind:"Stacking slot",           col:"#ffc845", src:"games/pyramid.html",  pos:[0,0,4.0],     rot:0,   va:0,    scale:1,   clip:"Idle",
    desc:"Stack the blocks higher for bigger pays. Zib brings the golden brick." },
  { id:"asteroid",name:"Asteroid Field",   kind:"Mines",                   col:"#5fe8ff", src:"games/asteroid.html", pos:[2.7,0,3.4],   rot:-.22, va:-.22, scale:1,   clip:"Idle",
    desc:"Crack asteroids for crystals. Collect before you hit a black hole." },
  { id:"gravity", name:"Gravity Well",     kind:"Spiral roulette",         col:"#b48cff", src:"games/gravity.html",  pos:[-5.6,0,-3.6], rot:.35, va:.1,  scale:1,   clip:"Idle",
    desc:"A comet spirals down three tiers into a black hole. Bet on where it lands." },
  { id:"moons",   name:"Twin Moons",       kind:"Alien craps",             col:"#bfefff", src:"games/moons.html",    pos:[5.8,0,-3.4],  rot:-.35, va:-.1, scale:1,   clip:"Idle",
    desc:"Roll two 8-sided moons. The gap between them counts. Matching moons collide." },
  { id:"warp",    name:"Warp Drive",       kind:"Crash game",              col:"#ff5fae", src:"games/warp.html",     pos:[0,0,-6.4],    rot:0,   va:0,    scale:.82, clip:"Idle",
    desc:"A drone launches and the multiplier climbs. Bail before it explodes." } ];

// ---- renderer, scene, camera ----
const cv=$("c"), renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
const PHONE=Math.min(innerWidth,innerHeight)<700; renderer.setPixelRatio(Math.min(PHONE?1.5:2,devicePixelRatio)); renderer.outputEncoding=THREE.sRGBEncoding; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x07040f); scene.fog=new THREE.Fog(0x07040f,20,42);
const cam=new THREE.PerspectiveCamera(45,1,.1,80);
const HOMES={ wide:{ cam:[0,9.2,15.5], t:[0,1.2,-1] }, tall:{ cam:[0,22,17.5], t:[0,0,-1.6] } };
const home=()=>innerWidth<innerHeight?HOMES.tall:HOMES.wide;
const HOME=home();
cam.position.set(...HOME.cam);
const ctl=new THREE.OrbitControls(cam,cv); ctl.target.set(...HOME.t); ctl.enableDamping=true; ctl.enablePan=false; ctl.minDistance=3; ctl.maxDistance=30; ctl.maxPolarAngle=Math.PI*.47; ctl.minPolarAngle=.25;
ctl.minAzimuthAngle=-.9; ctl.maxAzimuthAngle=.9; ctl.update();

// ---- lights: dim violet room, a key light for shadows, coloured pools of light over the games ----
scene.add(new THREE.HemisphereLight(0xa99cff,0x140a28,.55));
const key=new THREE.DirectionalLight(0xffffff,1.25); key.position.set(4,14,9); key.castShadow=true; key.shadow.mapSize.set(PHONE?1024:2048,PHONE?1024:2048);
Object.assign(key.shadow.camera,{left:-12,right:12,top:12,bottom:-12,near:1,far:40}); key.shadow.bias=-.0005; key.shadow.normalBias=.03; scene.add(key);
const rim=new THREE.DirectionalLight(0xff5fae,.7); rim.position.set(-8,6,-10); scene.add(rim);
GAMES.forEach(g=>{ const l=new THREE.PointLight(new THREE.Color(g.col),1.1,9,2); l.position.set(g.pos[0],4.2,g.pos[2]); scene.add(l); });

// ---- the room: alien carpet, panelled walls with neon and portholes onto space, the casino's sign ----
const ctex=(c,rep)=>{ const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; t.anisotropy=8; if(rep){ t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(...rep); } return t; };
const RW=22, RD=20, WH=7.5;
{ // carpet: a dark violet weave with gold-and-cyan alien motifs, repeating
  const c=document.createElement("canvas"); c.width=c.height=512; const g=c.getContext("2d");
  g.fillStyle="#1a0f33"; g.fillRect(0,0,512,512); for(let i=0;i<3000;i++){ g.fillStyle=`rgba(${Math.random()<.5?"120,80,200":"40,20,80"},${Math.random()*.25})`; g.fillRect(Math.random()*512,Math.random()*512,2,2); }
  const motif=(x,y,s)=>{ g.save(); g.translate(x,y); g.strokeStyle="#ffc84566"; g.lineWidth=3; for(let k=0;k<4;k++){ g.rotate(Math.PI/2); g.beginPath(); g.moveTo(0,s*.2); g.quadraticCurveTo(s*.5,s*.4,s*.25,s*.9); g.stroke(); }
    g.fillStyle="#5fe8ff55"; g.beginPath(); g.arc(0,0,s*.14,0,7); g.fill(); g.strokeStyle="#b48cff55"; g.lineWidth=2; g.beginPath(); g.arc(0,0,s*.55,0,7); g.stroke(); g.restore(); };
  motif(128,128,110); motif(384,384,110); motif(384,128,60); motif(128,384,60);
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(RW,RD+14),new THREE.MeshStandardMaterial({map:ctex(c,[5,8.5]),roughness:.95})); floor.rotation.x=-Math.PI/2; floor.position.z=6;   /* runs on toward the camera */ floor.receiveShadow=true; scene.add(floor); }
{ // walls
  const c=document.createElement("canvas"); c.width=512; c.height=256; const g=c.getContext("2d"), gr=g.createLinearGradient(0,0,0,256); gr.addColorStop(0,"#120b26"); gr.addColorStop(1,"#1f1440"); g.fillStyle=gr; g.fillRect(0,0,512,256);
  for(let x=0;x<512;x+=128){ g.fillStyle="#0a0618"; g.fillRect(x,0,6,256); g.fillStyle="#2c1f55"; g.fillRect(x+6,0,2,256); }
  g.fillStyle="#b48cff"; g.fillRect(0,200,512,3); g.fillStyle="#5fe8ff"; g.fillRect(0,40,512,2);
  const wm=new THREE.MeshStandardMaterial({map:ctex(c,[4,1]),roughness:.7,metalness:.2,emissive:0xffffff,emissiveMap:ctex(c,[4,1]),emissiveIntensity:.18});
  const wall=(w,x,z,ry)=>{ const m=new THREE.Mesh(new THREE.PlaneGeometry(w,WH),wm); m.position.set(x,WH/2,z); m.rotation.y=ry; m.receiveShadow=true; scene.add(m); };
  wall(RW,0,-1-RD/2,0); wall(RD,-RW/2,-1,Math.PI/2); wall(RD,RW/2,-1,-Math.PI/2);
  // neon strips along the foot of the walls
  const neon=(col)=>new THREE.MeshBasicMaterial({color:col});
  for(const [w,x,z,ry,col] of [[RW,0,-1-RD/2+.02,0,0xb48cff],[RD,-RW/2+.02,-1,Math.PI/2,0x5fe8ff],[RD,RW/2-.02,-1,-Math.PI/2,0x5fe8ff]]){ const m=new THREE.Mesh(new THREE.PlaneGeometry(w,.06),neon(col)); m.position.set(x,.25,z); m.rotation.y=ry; scene.add(m); const m2=m.clone(); m2.position.y=WH-.4; scene.add(m2); }
  // portholes onto space along the side walls
  const sc=document.createElement("canvas"); sc.width=sc.height=256; const sg=sc.getContext("2d"), bg=sg.createRadialGradient(90,80,10,128,128,180); bg.addColorStop(0,"#3a1f6b"); bg.addColorStop(.6,"#0b0a2a"); bg.addColorStop(1,"#03040f"); sg.fillStyle=bg; sg.fillRect(0,0,256,256);
  for(let i=0;i<160;i++){ sg.fillStyle=`rgba(255,255,255,${Math.random()*.9})`; sg.fillRect(Math.random()*256,Math.random()*256,Math.random()<.1?2:1,Math.random()<.1?2:1); }
  sg.fillStyle="#ff9a6a"; sg.beginPath(); sg.arc(190,170,26,0,7); sg.fill(); sg.fillStyle="#0b0a2a88"; sg.beginPath(); sg.arc(200,162,24,0,7); sg.fill();
  const winM=new THREE.MeshBasicMaterial({map:ctex(sc)}), rimM=new THREE.MeshStandardMaterial({color:0x8d8aa0,metalness:.85,roughness:.3}), rimG=new THREE.MeshBasicMaterial({color:0x5fe8ff});
  for(const side of [-1,1]) for(const z of [-7,-2.5,2]){ const x=side*(RW/2-.03), g=new THREE.Group(); g.position.set(x,3.6,z); g.rotation.y=-side*Math.PI/2; scene.add(g);
    g.add(new THREE.Mesh(new THREE.CircleGeometry(.85,40),winM)); const r=new THREE.Mesh(new THREE.TorusGeometry(.9,.1,10,40),rimM); g.add(r); const r2=new THREE.Mesh(new THREE.TorusGeometry(1.02,.02,6,40),rimG); g.add(r2); }
  // the casino sign on the back wall
  const nc=document.createElement("canvas"); nc.width=1024; nc.height=300; const ng=nc.getContext("2d"); ng.textAlign="center"; ng.textBaseline="middle";
  ng.font='400 150px "Monoton","Bungee",Impact,sans-serif'; ng.shadowColor="#b48cff"; ng.shadowBlur=40; ng.fillStyle="#f3e9ff"; ng.fillText("ALIEN",440,130);
  ng.font='400 120px "Yellowtail",cursive'; ng.shadowColor="#ff7a3a"; ng.fillStyle="#fff0d0"; ng.save(); ng.translate(760,210); ng.rotate(-.1); ng.fillText("Casino",0,0); ng.restore();
  const sign=new THREE.Mesh(new THREE.PlaneGeometry(7,7*300/1024),new THREE.MeshBasicMaterial({map:ctex(nc),transparent:true})); sign.position.set(-6.2,5.6,-1-RD/2+.05); scene.add(sign);
  const sign2=sign.clone(); sign2.position.x=6.2; scene.add(sign2); }
// ---- textures for the models ----
const loadImg=s=>new Promise(r=>{ const i=new Image(); i.onload=()=>r(i); i.onerror=()=>r(null); i.src=s; });
async function loadAll(o){ if(typeof o==="string") return o.startsWith("data:image") ? loadImg(o) : o; if(Array.isArray(o)||typeof o!=="object"||!o) return o;
  const ks=Object.keys(o), vs=await Promise.all(ks.map(k=>loadAll(o[k]))); const r={}; ks.forEach((k,i)=>r[k]=vs[i]); return r; }   // all images decode at once

// ---- place the models ----
const placed=[], mixers=[], updates=[], pickables=[];
function label(g){ const c=document.createElement("canvas"); c.width=512; c.height=128; const x=c.getContext("2d"); x.textAlign="center"; x.textBaseline="middle";
  x.fillStyle="#060914d0"; x.strokeStyle=g.col; x.lineWidth=4; const w=420; x.beginPath(); x.moveTo(256-w/2+18,14); x.lineTo(256+w/2,14); x.lineTo(256+w/2,96); x.lineTo(256+w/2-18,114); x.lineTo(256-w/2,114); x.lineTo(256-w/2,32); x.closePath(); x.fill(); x.stroke();
  x.font='400 46px "Bungee",Impact,sans-serif'; x.fillStyle=g.col; x.shadowColor=g.col; x.shadowBlur=16; x.fillText(g.name.toUpperCase(),256,64);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:ctex(c),transparent:true,depthWrite:false})); s.scale.set(1.9,.475,1); s.renderOrder=5; return s; }
async function buildFloor(){ const TX=await loadAll(TEX_SRC); const say=t=>$("lmsg").textContent=t;
  const make={ slot:()=>buildSlotBot(THREE,{mood:"happy",tex:TX.slot}), pyramid:()=>buildPyramidBot(THREE,{tex:TX.pyramid}), asteroid:()=>buildPyramidBot(THREE,{tex:TX.asteroid}),
    gravity:()=>buildGravityTable(THREE,{tex:TX.gravity}), moons:()=>buildMoonsTable(THREE,{tex:TX.moons}), warp:()=>buildWarpStage(THREE,{tex:TX.warp}) };
  $("loading").classList.add("done"); let n=0;                                       // the room is already there: show it now
  for(const g of GAMES){ n++; $("hint").textContent=`SETTING UP GAMES ${n}/${GAMES.length}`; await new Promise(r=>requestAnimationFrame(()=>setTimeout(r,0)));
    let m; try{ m=make[g.id](); }catch(e){ console.error(g.id,e); continue; } if(g.id==="slot" && m.setMood) m.setMood("happy");
    const holder=new THREE.Group(); holder.position.set(...g.pos); holder.rotation.y=g.rot; holder.scale.setScalar(g.scale); holder.add(m.root); holder.userData.game=g; scene.add(holder);
    m.root.traverse(o=>{ if(o.isMesh){ o.castShadow=o.castShadow!==false; o.userData.game=g; pickables.push(o); } });
    if(m.clips && m.clips.length){ const mx=new THREE.AnimationMixer(m.root); const c=m.clips.find(c=>c.name===g.clip)||m.clips[0]; mx.clipAction(c).play(); mx.update(Math.random()*2); mixers.push(mx); }
    if(m.update) updates.push(t=>m.update(t,"Idle"));
    // its name floats above it
    const box=new THREE.Box3().setFromObject(holder), lab=label(g); lab.position.set(g.pos[0],box.max.y+.55,g.pos[2]); lab.userData.game=g; scene.add(lab); pickables.push(lab);
    // a glowing ring on the floor shows which game you've picked
    const ring=new THREE.Mesh(new THREE.RingGeometry(1,1.06,64),new THREE.MeshBasicMaterial({color:new THREE.Color(g.col),transparent:true,opacity:0,depthWrite:false})); ring.rotation.x=-Math.PI/2;
    const sz=box.getSize(new THREE.Vector3()), c=box.getCenter(new THREE.Vector3()); ring.scale.setScalar(Math.max(sz.x,sz.z)*.62+.3); ring.position.set(c.x,.02,c.z); scene.add(ring);
    placed.push({ g, holder, box, ring, lab }); try{ renderer.compile(scene,cam); }catch(e){} }
  $("hint").innerHTML="TAP A GAME &middot; DRAG TO LOOK AROUND"; buildNav(); }

// ---- picking a game: tap it (or its name, or the list), the camera glides over, its card comes up ----
let focused=null, tween=null;
function viewFor(p){ const c=p.box.getCenter(new THREE.Vector3()), s=p.box.getSize(new THREE.Vector3()), f=new THREE.Vector3(Math.sin(p.g.va),0,Math.cos(p.g.va));   // va: the direction we look at it from (kept clear of the other games)
  const d=Math.max(s.x,s.y*.9,s.z)*1.25+2.2, portrait=innerWidth<innerHeight;
  const t=new THREE.Vector3(c.x, Math.min(s.y*.5, 2.4), c.z); const pos=t.clone().addScaledVector(f,d*(portrait?1.25:1)).add(new THREE.Vector3(0,s.y*.35+1.2,0)); return { pos, t }; }
function glide(pos,t,ms=900){ const p0=cam.position.clone(), t0=ctl.target.clone(), s=performance.now(); tween={ p0, t0, pos, t, s, ms }; }
function focus(id){ const p=placed.find(q=>q.g.id===id); if(!p) return; focused=p; const v=viewFor(p); glide(v.pos,v.t);
  const g=p.g; $("card").style.setProperty("--gc",g.col); $("cName").textContent=g.name; $("cKind").textContent=g.kind; $("cDesc").textContent=g.desc; $("card").classList.add("show"); $("hint").style.opacity=0;
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.id===id))); }
function unfocus(){ focused=null; const H=home(); glide(new THREE.Vector3(...H.cam),new THREE.Vector3(...H.t)); $("card").classList.remove("show"); $("hint").style.opacity=1; document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-pressed","false")); }
function buildNav(){ GAMES.forEach(g=>{ const b=document.createElement("button"); b.className="holo"; b.dataset.id=g.id; b.textContent=g.name; b.style.setProperty("--hc",g.col); b.onclick=()=>focused&&focused.g.id===g.id?openGame(g):focus(g.id); $("nav").appendChild(b); }); }
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2(); let down=null;
cv.addEventListener("pointerdown",e=>{ down=[e.clientX,e.clientY,performance.now()]; });
cv.addEventListener("pointerup",e=>{ if(!down) return; const moved=Math.hypot(e.clientX-down[0],e.clientY-down[1]); down=null; if(moved>8) return;
  ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1); ray.setFromCamera(ndc,cam); const hit=ray.intersectObjects(pickables,false).find(h=>h.object.userData.game);
  if(hit){ const g=hit.object.userData.game; if(focused&&focused.g.id===g.id) openGame(g); else focus(g.id); } else if(focused) unfocus(); });
$("cBack").onclick=unfocus; $("cPlay").onclick=()=>focused&&openGame(focused.g);

// ---- playing: the game opens over the casino; the casino pauses until you come back ----
const cache={}; let playing=false;
const PREFIX='<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>';
async function openGame(g){ $("gName").textContent=g.name; $("game").style.setProperty("--gc",g.col); $("game").hidden=false; playing=true;
  try{ if(!cache[g.id]){ const r=await fetch(g.src); cache[g.id]=await r.text(); } $("frame").srcdoc=PREFIX+cache[g.id]+"</body></html>"; }
  catch(e){ $("frame").srcdoc=PREFIX+`<p style="font:16px sans-serif;color:#ccc;padding:24px">Couldn't load ${g.name}.</p>`; } }
$("gBack").onclick=()=>{ $("frame").srcdoc=""; $("game").hidden=true; playing=false; clock.getDelta(); };

// ---- loop ----
function size(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); cam.aspect=w/h; cam.fov=w<h?58:42; cam.updateProjectionMatrix(); }
addEventListener("resize",size); size();
const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{ if(playing) return; const dt=Math.min(.05,clock.getDelta()), t=clock.elapsedTime;
  if(tween){ const k=Math.min(1,(performance.now()-tween.s)/tween.ms), e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2; cam.position.lerpVectors(tween.p0,tween.pos,e); ctl.target.lerpVectors(tween.t0,tween.t,e); if(k>=1) tween=null; }
  mixers.forEach(m=>m.update(dt)); updates.forEach(u=>u(t));
  placed.forEach(p=>{ const on=focused===p; p.ring.material.opacity+=((on?.9:0)-p.ring.material.opacity)*.12; p.lab.position.y+=Math.sin(t*1.6+p.g.pos[0])*.0015; const lo=focused&&!on?0:1; p.lab.material.opacity+=(lo-p.lab.material.opacity)*.15; p.lab.visible=p.lab.material.opacity>.02; });
  ctl.update(); renderer.render(scene,cam); });
addEventListener("error",e=>{ $("lmsg").textContent="SOMETHING WENT WRONG: "+(e.message||""); });
(async()=>{ try{ await Promise.race([document.fonts.load('400 40px Bungee'),new Promise(r=>setTimeout(r,600))]); }catch(e){}
  $("lmsg").textContent="UNPACKING THE CASINO"; await new Promise(r=>requestAnimationFrame(()=>setTimeout(r,0)));
  try{ await buildFloor(); }catch(e){ $("lmsg").textContent="SOMETHING WENT WRONG: "+e.message; $("loading").classList.remove("done"); } })();
</script>
