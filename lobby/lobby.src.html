<!-- Alien Casino lobby: the 3D casino floor with every game's model in it. Tap a game to walk the camera over, then PLAY to open it.
     build.py fills in the models (../model3d/*_model.js), their textures, part_music.js and part_extras.js, and copies the built games into games/ next to this page.
     The CC0 models in assets/ (aliens, plants, planets, statue) are published next to the page and fetched when it loads. -->
<title>Alien Casino</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@500;600;700&family=Monoton&family=Share+Tech+Mono&family=Yellowtail&display=swap">
<style>
:root{--bg:#07040f;--ink:#efe8ff;--dim:#9a8fc0;--holo:#5fe8ff;--holo2:#b48cff;--gold:#ffc845;--f-sign:"Bungee",Impact,sans-serif;--f-mono:"Share Tech Mono",ui-monospace,monospace;--f-tech:"Chakra Petch",system-ui,sans-serif;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 14px var(--f-tech);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
[hidden]{display:none!important}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.holo{--k:10px;--hc:var(--holo);position:relative;border:0;color:var(--ink);clip-path:polygon(var(--k) 0,100% 0,100% calc(100% - var(--k)),calc(100% - var(--k)) 100%,0 100%,0 var(--k));
  background:linear-gradient(180deg,color-mix(in srgb,var(--hc) 18%,#060914e6),#060914e6),repeating-linear-gradient(0deg,color-mix(in srgb,var(--hc) 8%,transparent) 0 1px,transparent 1px 3px);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--hc) 50%,transparent),inset 0 0 22px color-mix(in srgb,var(--hc) 14%,transparent)}
header{position:fixed;z-index:5;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:space-between;align-items:center;pointer-events:none;
  background:linear-gradient(#07040fcc,transparent)}
.logo{position:relative;font:400 1.5rem/1 "Monoton",var(--f-sign);color:#eafcff;text-shadow:0 0 4px #fff,0 0 10px var(--holo2),0 0 24px #8a4dff}
.logo i{position:absolute;right:-30px;bottom:-14px;font:400 1.15rem "Yellowtail",cursive;font-style:normal;color:#fff0d0;transform:rotate(-8deg);text-shadow:0 0 8px #ffb070,0 0 18px #ff7a3a}
.coins{--k:7px;display:flex;align-items:center;gap:6px;padding:6px 12px;font:700 1rem var(--f-mono);pointer-events:auto}
.coins .refill{font:700 .75rem var(--f-mono);margin-left:6px;padding:3px 8px;border:0;border-radius:6px;background:#ffc845;color:#1a1030;cursor:pointer}
.right{display:flex;gap:8px;align-items:center}
.music{--k:7px;--hc:var(--holo2);width:38px;height:34px;padding:0;display:grid;place-items:center;cursor:pointer;pointer-events:auto;color:var(--dim)}
.music svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.music[aria-pressed="true"]{color:#fff;--hc:var(--holo)}
.music[aria-pressed="false"] svg{opacity:.55}
.coins i{width:22px;height:16px;background:var(--bar) center/contain no-repeat}
.hint{position:fixed;z-index:4;left:0;right:0;top:calc(62px + env(safe-area-inset-top,0px));text-align:center;font:400 .66rem var(--f-mono);letter-spacing:.2em;color:var(--dim);pointer-events:none;transition:opacity .4s}

  display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;background:linear-gradient(transparent,#07040fe6 35%)}

nav button{--k:7px;flex:none;padding:8px 11px;cursor:pointer;font:400 .7rem/1 var(--f-sign);letter-spacing:.04em;white-space:nowrap}
nav button[aria-pressed="true"]{--hc:var(--gold);color:#fff;text-shadow:0 0 8px var(--gold)}
/* the card for the game you're looking at */
.card{--k:14px;position:fixed;z-index:6;left:50%;bottom:calc(74px + env(safe-area-inset-bottom,0px));translate:-50% 0;width:min(92vw,360px);padding:14px 16px;display:grid;gap:8px;--hc:var(--gc,var(--holo));
  opacity:0;transform:translateY(16px);transition:opacity .25s,transform .3s cubic-bezier(.3,1.4,.5,1);pointer-events:none}
.card.show{opacity:1;transform:none;pointer-events:auto}
.card h2{margin:0;font:400 1.3rem/1 var(--f-sign);color:var(--gc);text-shadow:0 0 12px var(--gc)}
.card p{margin:0;font:500 .86rem/1.4 var(--f-tech);color:#dde}
.card .kind{font:400 .58rem var(--f-mono);letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
.card .btns{display:grid;grid-template-columns:auto 1fr;gap:8px;margin-top:4px}
.card button{--k:8px;cursor:pointer;padding:12px 14px;font:400 .9rem/1 var(--f-sign);letter-spacing:.06em}
.card .play{--hc:var(--gold);color:#fff;text-shadow:0 0 10px var(--gold);animation:pulse 1.2s ease-in-out infinite alternate}
@keyframes pulse{to{box-shadow:inset 0 0 0 1px var(--gold),inset 0 0 30px #ffc84555,0 0 16px #ffc84566}}
/* a game, open over the casino */
.game{position:fixed;inset:0;z-index:20;background:#000}
.game iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
/* back to the casino: a small tab on the left edge, so it never covers a game's buttons */
.game .back{position:absolute;z-index:2;left:0;top:50%;translate:0 -50%;width:26px;height:64px;border:0;padding:0;cursor:pointer;border-radius:0 12px 12px 0;background:#07040fcc;color:var(--holo);box-shadow:inset -1px 0 0 #5fe8ff66,inset 0 1px 0 #5fe8ff44,inset 0 -1px 0 #5fe8ff44,0 0 12px #5fe8ff33;display:grid;place-items:center;opacity:.75}
.game .back svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.game .back:active{opacity:1}
.loading{position:fixed;inset:0;z-index:30;display:grid;place-content:center;gap:10px;text-align:center;background:var(--bg);font:400 .7rem var(--f-mono);letter-spacing:.24em;color:var(--dim);transition:opacity .5s}

.loading.done{opacity:0;pointer-events:none}

  const bc=document.createElement("canvas"); bc.width=512; bc.height=200; const bg=bc.getContext("2d"); bg.textAlign="center"; bg.textBaseline="middle";
  bg.font='400 130px "Monoton","Bungee",Impact,sans-serif'; bg.shadowColor="#5fe8ff"; bg.shadowBlur=30; bg.fillStyle="#eafcff"; bg.fillText("BAR",256,100);
  const bs=new THREE.Mesh(new THREE.PlaneGeometry(2.4,2.4*200/512),new THREE.MeshBasicMaterial({map:ctex(bc),transparent:true})); bs.position.set(6.96,3.35,zc); bs.rotation.y=-Math.PI/2; scene.add(bs);
  const seat=new THREE.MeshStandardMaterial({color:0x2a1a4f,metalness:.2,roughness:.5}), metal=new THREE.MeshStandardMaterial({color:0x8d8aa0,metalness:.85,roughness:.3});
  for(let i=0;i<5;i++){ const z=Z0+.6+i*(len-1.2)/4, g=new THREE.Group(); g.position.set(5.45,0,z); scene.add(g);
    const add=(geo,m,y,rx=0)=>{ const o=new THREE.Mesh(geo,m); o.position.y=y; o.rotation.x=rx; o.castShadow=o.receiveShadow=true; g.add(o); };
    add(new THREE.CylinderGeometry(.2,.2,.08,20),seat,.74); add(new THREE.TorusGeometry(.2,.012,4,24),glowV,.74,Math.PI/2); add(new THREE.CylinderGeometry(.035,.05,.7,10),metal,.36);
    add(new THREE.CylinderGeometry(.22,.25,.03,20),dark,.015); add(new THREE.TorusGeometry(.16,.012,6,20),gold,.32,Math.PI/2); } }
// ---- textures for the models ----
const loadImg=s=>new Promise(r=>{ const i=new Image(); i.onload=()=>r(i); i.onerror=()=>r(null); i.src=s; });
async function loadAll(o){ if(typeof o==="string") return o.startsWith("data:image") ? loadImg(o) : o; if(Array.isArray(o)||typeof o!=="object"||!o) return o;
  const ks=Object.keys(o), vs=await Promise.all(ks.map(k=>loadAll(o[k]))); const r={}; ks.forEach((k,i)=>r[k]=vs[i]); return r; }   // all images decode at once

// ---- place the models ----
const placed=[], mixers=[], updates=[], pickables=[];
function label(g){ const c=document.createElement("canvas"); c.width=512; c.height=128; const x=c.getContext("2d"); x.textAlign="center"; x.textBaseline="middle";
  x.fillStyle="#060914d0"; x.strokeStyle=g.col; x.lineWidth=4; const w=420; x.beginPath(); x.moveTo(256-w/2+18,14); x.lineTo(256+w/2,14); x.lineTo(256+w/2,96); x.lineTo(256+w/2-18,114); x.lineTo(256-w/2,114); x.lineTo(256-w/2,32); x.closePath(); x.fill(); x.stroke();
  x.font='400 46px "Bungee",Impact,sans-serif'; x.fillStyle=g.col; x.shadowColor=g.col; x.shadowBlur=16; x.fillText(g.name.toUpperCase(),256,64);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:ctex(c),transparent:true,depthWrite:false})); s.scale.set(1.9,.475,1); s.renderOrder=5; return s; }
// a cabinet doesn't move, so its hundreds of parts are welded into a few meshes (one per material): far fewer draw calls when there are many
function bake(root){ root.updateMatrixWorld(true); const inv=new THREE.Matrix4().copy(root.matrixWorld).invert(), groups=new Map();
  root.traverse(o=>{ if(!o.isMesh || Array.isArray(o.material) || !o.visible) return; let g=o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone();
    g.applyMatrix4(new THREE.Matrix4().multiplyMatrices(inv,o.matrixWorld)); if(!g.attributes.normal) g.computeVertexNormals();
    if(!g.attributes.uv) g.setAttribute("uv",new THREE.Float32BufferAttribute(new Float32Array(g.attributes.position.count*2),2));
    for(const k of Object.keys(g.attributes)) if(!["position","normal","uv"].includes(k)) g.deleteAttribute(k); g.morphAttributes={};
    const key=o.material.uuid; if(!groups.has(key)) groups.set(key,{m:o.material,gs:[]}); groups.get(key).gs.push(g); });
  const out=new THREE.Group(); for(const {m,gs} of groups.values()){ const merged=THREE.BufferGeometryUtils.mergeBufferGeometries(gs,false); if(!merged) continue;
    const mesh=new THREE.Mesh(merged,m); mesh.castShadow=mesh.receiveShadow=true; out.add(mesh); } return out; }
const walkers=[];
async function buildFloor(){ const TX=await loadAll(TEX_SRC);
  // the shared models: one of each, cloned where the floor needs several
  const proto={}, protoClips={};
  const make={ slot:()=>buildSlotBot(THREE,{mood:"happy",tex:TX.slot}), pyramid:()=>buildPyramidBot(THREE,{tex:TX.pyramid}), asteroid:()=>buildPyramidBot(THREE,{tex:TX.asteroid}),
    gravity:()=>buildGravityTable(THREE,{tex:TX.gravity}), moons:()=>buildMoonsTable(THREE,{tex:TX.moons}), warp:()=>buildWarpStage(THREE,{tex:TX.warp}) };
  $("loading").classList.add("done"); let n=0;
  for(const p of PLAN){ n++; $("hint").textContent=`SETTING UP THE FLOOR ${n}/${PLAN.length}`; await new Promise(r=>requestAnimationFrame(()=>setTimeout(r,0)));
    const g=G[p.game], holder=new THREE.Group(); holder.userData.game=g; scene.add(holder);
    try{
      if(p.kind==="model"){ const m=make[p.game](); holder.add(m.root); holder.position.set(...p.pos); holder.rotation.y=p.rot; holder.scale.setScalar(p.scale);
        if(m.clips && m.clips.length){ const mx=new THREE.AnimationMixer(m.root); mx.clipAction(m.clips.find(c=>c.name==="Idle")||m.clips[0]).play(); mx.update(Math.random()*2); mixers.push(mx); }
        if(m.update) updates.push(t=>m.update(t,"Idle")); }
      else if(p.kind==="bank"){ if(!proto[p.game]){ const b=bake(make[p.game]().root), bb=new THREE.Box3().setFromObject(b), c=bb.getCenter(new THREE.Vector3()); b.children.forEach(m=>m.geometry.translate(-c.x,0,-c.z)); proto[p.game]={ obj:b, size:bb.getSize(new THREE.Vector3()) }; }
        const {obj,size}=proto[p.game], gap=.06;
        for(const row of [1,-1]) for(let i=0;i<p.per;i++){ const c=obj.clone(); c.position.set((i-(p.per-1)/2)*(size.x+gap), 0, row*size.z/2); c.rotation.y=row>0?0:Math.PI; holder.add(c); }   // back to back
        holder.position.set(...p.pos); holder.rotation.y=p.rot; }
      else if(p.kind==="bot"){ if(!proto.slot){ const m=make.slot(); if(m.setMood) m.setMood("happy"); proto.slot=m.root; protoClips.slot=m.clips; }
        const r=proto.slot.clone(true); holder.add(r); const mx=new THREE.AnimationMixer(r), cl=protoClips.slot;
        if(p.walk){ mx.clipAction(cl.find(c=>c.name==="Walk_Happy")||cl[0]).play(); const w={ holder, path:p.walk, seg:0, k:Math.random(), speed:p.speed, paused:false }; walkers.push(w); holder.userData.walker=w; placeWalker(w,0); }
        else { mx.clipAction(cl.find(c=>c.name==="Idle_Happy")||cl[0]).play(); holder.position.set(...p.pos); holder.rotation.y=p.rot; }
        mx.update(Math.random()*2); mixers.push(mx); }
    }catch(e){ console.error(p.game,e); continue; }
    holder.traverse(o=>{ if(o.isMesh){ o.userData.game=g; o.userData.spot=p; pickables.push(o); } });
    const box=new THREE.Box3().setFromObject(holder);
    // one name sign per game (over its main spot), and a ring on the floor for whichever machine you pick
    let lab=null; if(p.kind!=="bot" || p.label){ lab=label(g); lab.position.set((box.min.x+box.max.x)/2,box.max.y+.45,(box.min.z+box.max.z)/2); lab.userData.game=g; lab.userData.spot=p; scene.add(lab); pickables.push(lab); }
    const ring=new THREE.Mesh(new THREE.RingGeometry(1,1.06,64),new THREE.MeshBasicMaterial({color:new THREE.Color(g.col),transparent:true,opacity:0,depthWrite:false})); ring.rotation.x=-Math.PI/2;
    const sz=box.getSize(new THREE.Vector3()), c=box.getCenter(new THREE.Vector3()); ring.scale.setScalar(Math.max(sz.x,sz.z)*.62+.25); ring.position.set(c.x,.02,c.z); scene.add(ring);
    placed.push({ g, p, holder, box, ring, lab }); try{ renderer.compile(scene,cam); }catch(e){} }
  $("hint").innerHTML="TAP A GAME &middot; DRAG TO LOOK AROUND"; buildNav();
  try{ await EXTRAS.build(TX); }catch(e){ console.error("extras",e); } }
// a wandering robot: walks its loop at its own pace, turning to face where it's going
function placeWalker(w,dt){ if(!w.paused) w.k+=dt*w.speed/segLen(w); while(w.k>=1){ w.k-=1; w.seg=(w.seg+1)%w.path.length; }
  const a=w.path[w.seg], b=w.path[(w.seg+1)%w.path.length]; w.holder.position.set(a[0]+(b[0]-a[0])*w.k,0,a[1]+(b[1]-a[1])*w.k);
  const want=Math.atan2(b[0]-a[0],b[1]-a[1]); let d=want-w.holder.rotation.y; d=Math.atan2(Math.sin(d),Math.cos(d)); w.holder.rotation.y+=d*Math.min(1,dt*4+(dt?0:1)); }
const segLen=w=>{ const a=w.path[w.seg], b=w.path[(w.seg+1)%w.path.length]; return Math.hypot(b[0]-a[0],b[1]-a[1])||1; };

// ---- picking a game: tap it (or its name, or the list), the camera glides over, its card comes up ----
let focused=null, tween=null;
function viewFor(p){ p.box.setFromObject(p.holder); const c=p.box.getCenter(new THREE.Vector3()), s=p.box.getSize(new THREE.Vector3()), va=p.holder.userData.walker?p.holder.rotation.y:p.p.va, f=new THREE.Vector3(Math.sin(va),0,Math.cos(va));   // va: the direction we look at it from (kept clear of the other games)
  const d=Math.max(s.x,s.y*.9,s.z)*1.15+1.8, portrait=innerWidth<innerHeight;
  const t=new THREE.Vector3(c.x, Math.min(s.y*.5, 2.4), c.z); const pos=t.clone().addScaledVector(f,d*(portrait?1.25:1)).add(new THREE.Vector3(0,s.y*.35+1.2,0)); return { pos, t }; }
function glide(pos,t,ms=900){ const p0=cam.position.clone(), t0=ctl.target.clone(), s=performance.now(); tween={ p0, t0, pos, t, s, ms }; }
function focus(id,spot){ const p=placed.find(q=>spot?q.p===spot:(q.g.id===id&&(q.lab||q.p.kind!=="bot"))) || placed.find(q=>q.g.id===id); if(!p) return;
  walkers.forEach(w=>w.paused=false); if(p.holder.userData.walker) p.holder.userData.walker.paused=true; focused=p; const v=viewFor(p); glide(v.pos,v.t);
  const g=p.g; $("card").style.setProperty("--gc",g.col); $("cName").textContent=g.name; $("cKind").textContent=g.kind; $("cDesc").textContent=g.desc; $("card").classList.add("show"); $("hint").style.opacity=0;
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.id===id))); }
function unfocus(){ focused=null; walkers.forEach(w=>w.paused=false); const H=home(); glide(new THREE.Vector3(...H.cam),new THREE.Vector3(...H.t)); $("card").classList.remove("show"); $("hint").style.opacity=1; document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-pressed","false")); }
function buildNav(){ GAMES.forEach(g=>{ const b=document.createElement("button"); b.className="holo"; b.dataset.id=g.id; b.textContent=g.name; b.style.setProperty("--hc",g.col); b.onclick=()=>focused&&focused.g.id===g.id?openGame(g):focus(g.id); $("nav").appendChild(b); }); }
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2(); let down=null;
cv.addEventListener("pointerdown",e=>{ down=[e.clientX,e.clientY,performance.now()]; });
cv.addEventListener("pointerup",e=>{ if(!down) return; const moved=Math.hypot(e.clientX-down[0],e.clientY-down[1]); down=null; if(moved>8) return;
  ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1); ray.setFromCamera(ndc,cam); const hit=ray.intersectObjects(pickables,false).find(h=>h.object.userData.game||h.object.userData.alien);
  if(hit&&hit.object.userData.alien){ hit.object.userData.alien.react(); return; }   // tap an alien: it waves
  if(hit){ const g=hit.object.userData.game, sp=hit.object.userData.spot; if(focused&&focused.p===sp) openGame(g); else focus(g.id,sp); } else if(focused) unfocus(); });
$("cBack").onclick=unfocus; $("cPlay").onclick=()=>focused&&openGame(focused.g);

// ---- playing: the game opens over the casino; the casino pauses until you come back ----
// ---- the wallet: one balance of gold bars for the whole casino. Games read and save it through window.__alienWallet ----
const WALLET_KEY="alien-casino-bars", WALLET_START=500, REFILL_BELOW=20;
let bars=(()=>{ try{ const v=localStorage.getItem(WALLET_KEY); if(v!==null&&Number.isFinite(+v)&&+v>=0) return Math.floor(+v); }catch(e){} return WALLET_START; })();
function showBars(){ $("bars").textContent=bars.toLocaleString(); $("refill").hidden=bars>=REFILL_BELOW; }
window.__alienWallet={ get:()=>bars, set:v=>{ bars=Math.max(0,Math.floor(v)); try{ localStorage.setItem(WALLET_KEY,String(bars)); }catch(e){} showBars(); } };
$("refill").onclick=()=>window.__alienWallet.set(WALLET_START);
showBars();
// ---- music: starts with the first tap (browsers need one), remembered on/off, quiet while a game is open ----
const musicBtn=$("music"), showMusic=()=>musicBtn.setAttribute("aria-pressed",String(Music.on));
musicBtn.onclick=e=>{ e.stopPropagation(); Music.setWanted(!Music.on); showMusic(); };
addEventListener("pointerdown",function first(e){ if(e.target===musicBtn) return; removeEventListener("pointerdown",first,true); if(Music.wanted&&!playing){ Music.start(); showMusic(); } },true);
const cache={}; let playing=false;
const PREFIX='<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>';
async function openGame(g){ $("game").style.setProperty("--gc",g.col); $("game").hidden=false; playing=true; Music.stop(.15); showMusic();
  try{ if(!cache[g.id]){ const r=await fetch(g.src); cache[g.id]=await r.text(); } $("frame").srcdoc=PREFIX+cache[g.id]+"</body></html>"; }
  catch(e){ $("frame").srcdoc=PREFIX+`<p style="font:16px sans-serif;color:#ccc;padding:24px">Couldn't load ${g.name}.</p>`; } }
$("gBack").onclick=()=>{ $("frame").srcdoc=""; $("game").hidden=true; playing=false; clock.getDelta(); if(Music.wanted){ Music.start(); showMusic(); } };

// ---- loop ----
function size(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); cam.aspect=w/h; cam.fov=w<h?58:42; cam.updateProjectionMatrix(); }
addEventListener("resize",size); size();
const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{ if(playing) return; const dt=Math.min(.05,clock.getDelta()), t=clock.elapsedTime;
  if(tween){ const k=Math.min(1,(performance.now()-tween.s)/tween.ms), e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2; cam.position.lerpVectors(tween.p0,tween.pos,e); ctl.target.lerpVectors(tween.t0,tween.t,e); if(k>=1) tween=null; }
  walkers.forEach(w=>{ placeWalker(w,dt); }); mixers.forEach(m=>m.update(dt)); updates.forEach(u=>u(t));
  placed.forEach(p=>{ const on=focused===p; p.ring.material.opacity+=((on?.9:0)-p.ring.material.opacity)*.12; if(p.holder.userData.walker){ p.ring.position.x=p.holder.position.x; p.ring.position.z=p.holder.position.z; }
    if(p.lab){ p.lab.position.y+=Math.sin(t*1.6+p.box.min.x)*.0015; const lo=focused&&focused.g!==p.g?0:1; p.lab.material.opacity+=(lo-p.lab.material.opacity)*.15; p.lab.visible=p.lab.material.opacity>.02; } });
  ctl.update(); renderer.render(scene,cam); });
addEventListener("error",e=>{ $("lmsg").textContent="SOMETHING WENT WRONG: "+(e.message||""); });
(async()=>{ try{ await Promise.race([document.fonts.load('400 40px Bungee'),new Promise(r=>setTimeout(r,600))]); }catch(e){}
  $("lmsg").textContent="UNPACKING THE CASINO"; await new Promise(r=>requestAnimationFrame(()=>setTimeout(r,0)));
  try{ await buildFloor(); }catch(e){ $("lmsg").textContent="SOMETHING WENT WRONG: "+e.message; $("loading").classList.remove("done"); } })();
</script>
